    evidence_note: C2 検証文献の紐付け（2026-10-07）：Van Dijk 2020 デジタルデバイド（Polity）＋ World Bank Global Findex 2021 のデータ
  WHERE-F-006:
    name: 緊急時対応
    evidence_note: 標準条項（WCAG 2.2 SC 2.4.1 ＋ ISO 21542 の緊急条項）があり、間接的な支え。C 級を維持
  WHERE-F-007:
    name: 利用コンテキスト
    evidence_note: 標準条項（WCAG 2.2 SC 2.4.11、ISO 9241-110 の状況適合性）があり、間接的な支え。C 級を維持
  WHERE-F-008:
    name: 共有・公共利用コンテキスト
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Zallio & Clarkson 2021（B&E）が空間層を支える。製品層はなお専門家の合意にとどまる
  WHERE-F-009:
    name: 支援付き利用コンテキスト
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Cambridge EDC の方法論著作が支える。定量データに欠けるため、C 級を保持
  WHICH-F-001:
    name: 情報密度の選好
    evidence_note: 標準条項（WCAG 2.2 SC 1.4.4 のテキスト拡大、1.4.10 のリフロー）があり、選好と標準は完全には対応しない。間接的な支え。C 級を維持
  WHICH-F-002:
    name: 探索深度の選好
    evidence_note: 標準条項（ISO 9241-110 5.5 の制御可能性）があり、間接的な支え。C 級を維持
  WHICH-F-003:
    name: コントロール選好
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Parasuraman／Sheridan／Wickens 2000 の自動化段階モデル（IEEE SMC-A）＋ ISO 9241-110 5.5 の制御可能性 ＋ WCAG 3.2.6
  WHICH-F-004:
    name: 社会的可視性の選好
    evidence_note: 標準条項（GDPR 第 25 条のデータ保護バイデザイン、PIPL 第 16 条）があり、間接的な支え。C 級を維持
  WHICH-F-005:
    name: 美的スタイルの選好
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Norman 2004 の三層理論
  WHICH-F-006:
    name: 入力方式の選好
    evidence_note: 標準条項（WCAG 2.2 の入力モダリティ SC）があり、間接的な支え。C 級を維持
  WHICH-F-007:
    name: フィードバック選好
    evidence_note: 標準条項（WCAG 2.2 SC 4.1.3 のステータスメッセージ ＋ ISO 9241-110:2020 5.2 のフィードバック原則）があり、間接的な支え。C 級を維持
  WHICH-F-008:
    name: インタラクションモード選好
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Parasuraman et al. 2000 の自動化段階モデル
  WHICH-F-009:
    name: 通知の選好
    evidence_note: C2 検証文献の紐付け（2026-10-07）：SDT 理論が間接的に支える（自律性の欲求）。通知設計に直接焦点を当てた研究はいまだ不足
  WHO-F-001:
    name: 身体的・認知的能力
    evidence_note: C2 は Microsoft Inclusive Toolkit ＋ Clarkson et al. 2003 を紐付け。間接的な支えであり、C 級を維持
  WHO-F-002:
    name: デモグラフィック
    evidence_note: 標準条項（ISO 9241-110 の人間中心原則）があり、間接的な支え。C 級を維持
  WHO-F-003:
    name: 健康状態
    evidence_note: C2 は Waller, Langdon & Clarkson 2010 の DFS 排除測算を紐付け。間接的な支えであり、C 級を維持
  WHO-F-004:
    name: 学習スタイル
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Pashler et al. 2008 の結論。学習スタイル理論は証拠基盤を欠く——要因は保持しつつ理論的論争を注記し、設計応答は「スタイル適合」ではなく「マルチモーダル提示」へ降格
  WHO-F-005:
    name: 感情と動機づけ
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Norman 2004 のエモーショナルデザイン（本能／行動／反省の三層）＋ Ryan & Deci 2000 の SDT 理論
  WHO-F-006:
    name: 感覚選好
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Aron & Aron 1997 の感覚処理感受性（HSP 尺度、7 研究）の実証。直接的な研究の支え
  WHO-F-007:
    name: テクノロジーリテラシー
    evidence_note: 標準条項（WCAG 2.2／EN 301 549）があり、間接的な支え。C 級を維持
  WHO-F-008:
    name: 文化的背景
    evidence_note: 標準条項（WCAG 2.2 の文化関連 SC）があり、間接的な支え。C 級を維持
  WHO-F-009:
    name: ニューロダイバーシティ
    evidence_note: 標準条項（WCAG 2.2 の認知関連 SC）があり、間接的な支え。C 級を維持
  WHO-F-010:
    name: 認知特性
    evidence_note: C2 は Waller et al. 2010 を紐付け。間接的な支えであり、C 級を維持
  WHO-F-011:
    name: 言語
    evidence_note: 標準条項（WCAG 2.2 SC 3.1.1／3.1.2 の言語）があり、間接的な支え。C 級を維持
  WHO-F-012:
    name: リテラシー
    evidence_note: 標準条項（WCAG 2.2 SC 3.1.5 の読解レベル）があり、間接的な支え。C 級を維持
  WHO-F-013:
    name: 身体寸法と人間工学
    evidence_note: C2 は Waller et al. 2010 を紐付け。間接的な支えであり、C 級を維持
  WHO-F-014:
    name: プライバシーとセキュリティへの懸念
    evidence_note: 標準条項（GDPR／PIPL の条項）があり、間接的な支え。C 級を維持
  WHO-F-015:
    name: 性別と性表現
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Haimson et al. 2016／2023（CHI）のトランスジェンダー・デジタルアイデンティティ研究。空間層の部分はなお C
  WHY-F-001:
    name: コスト制約
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Return on Disability 2024 レポート（$18.3T の市場規模データ、企業調査 N=11,000+）
  WHY-F-002:
    name: 市場ポジショニング
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Return on Disability 2024 レポート（世界人口の 63% に関連するデータ）
  WHY-F-003:
    name: ビジネスモデル
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Mathur et al. 2019 のダークパターン大規模実証が「ビジネスモデルが設計倫理を制約する」方向を支える。ビジネスモデル自体は商業上の合意である
  WHY-F-004:
    name: 持続可能性と環境目標
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Elkington 1997 のトリプルボトムライン理論の著作。サステナビリティは経営学上の合意である
  WHY-F-005:
    name: ステークホルダーへの影響
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Freeman 1984 のステークホルダー理論の基礎著作。経営学上の合意
guides:
  G-HOW-F-001:
    name: ネットワーク耐性設計ガイド
    patterns:
    - name: オフラインファースト設計
      description: 中核機能はオフラインで完了できるよう設計する（ローカルキャッシュ/Service Worker/競合のマージ）。ネットワークは強化であり前提ではない
      domain: digital
      example: ノートアプリはオフラインで書けて見られ、接続後に黙って同期する
      refs:
      - STD-W3C-WCAG22:1.4.10
    - name: 適応型メディア
      description: メディア品質はリアルタイムの帯域に適応させる（ビットレート/解像度/読み込み量）。弱い回線ではまず内容の到達性を確保する
      domain: digital
      example: 動画は 2G 環境では自動で音声+字幕モードに落とす
      refs: []
    - name: 段階的縮退パス
      description: ネットワーク不通時は機能を降格させ停止させない：読み取り専用で使え、キューに溜めて送信し、ローカルで代替する
      domain: digital
      example: 弱い回線のときフォームをローカルに一時保存し『ネット回復後に自動送信します』と知らせる
      refs: []
    - name: 状態の正直な提示
      description: ネットワークの状態と予想される待ち時間を明示する（現在の速度/所要時間の見込み/失敗の理由）。すべて正常であるかのように装わない
      domain: digital
      example: 『現在ネットワークが遅いため、画像は低品質で読み込みます』
      refs: []
    anti_patterns:
    - name: クラウド単一依存
      description: すべての機能がリアルタイムにクラウドへ要求する
      consequence: 地下鉄、エレベーター、地下、料金未納——現代生活の切断点は想像より多い。オフラインで化石になる製品はネットワークの変動前に全线崩壊する
    - name: 白画面ローディング
      description: 弱い回線で無限に回り続け、いかなる降格もない
      consequence: 3 秒のフィードバックがないだけで離脱率が半数を越える——完全な空白より降格された内容の方がよい
  G-HOW-F-002:
    name: 低スペック端末フレンドリーガイド
    patterns:
    - name: 性能バジェット制
      description: 主要な端末グレードに性能予算（メモリ/初回描画時間/パッケージサイズ）を設定し、CI で予算超過なら失敗させる——性能は機能であり最適化ではない
      domain: digital
      example: 目標は 2GB メモリの機種：コールドスタート 3 秒以内、パッケージ 80MB 以下
      refs:
      - STD-EN-301549:8
    - name: 能力検出による適応
      description: 実行時に端末能力を検出して機能を動的に調整する（エフェクト/解像度/バックグラウンドの並行処理）。旧端末でも完全な中核機能を得られる
      domain: digital
      example: ローエンド機では背景ぼかしなどの装飾的描画をオフにし、機能は減らさない
      refs: []
    - name: 周辺機器による能力拡張
      description: 端末自体の能力が不足する場合は外部拡張をサポートする（外付けキーボード/USB メモリ/ディスプレイ）。経路を塞がない
      domain: digital
      example: タブレットは外付けキーボードに対応するとデスクトップ級の操作に切り替わる
      refs: []
    - name: 省電力モードの標準搭載
      description: 省電力モードを一級の選択肢とする：ポーリング/明るさ/描画を下げつつ、機能は完全に保つ
      domain: digital
      example: 低電量時は不要なアニメーションとバックグラウンド更新をオフにする
      refs:
      - STD-GB-T-45122:6.4
    anti_patterns:
    - name: ハイエンド端末前提
      description: チームが持っているハイエンド端末で受け入れ確認する
      consequence: 目標市場の中央値の機種こそが真の基準である——フラッグシップで滑らかでもエントリー機で即カクつく
    - name: 機能差別チェーン
      description: 旧端末を降格対応ではなくそもそも非サポートにする
      consequence: 機器の寿命は 5〜10 年。強制的な陳腐化が低所得ユーザーを排除する——段階的な降格こそデジタル環境保護である
  G-HOW-F-003:
    name: バッテリーと電源のガイド
    patterns:
    - name: バッテリー残量の可視化
      description: 電池の状態と残り使用時間の予測を常時表示して確認できるようにする。低電量の警告は段階を分けて早めに出す
      domain: digital
      example: パーセントだけでなく『残り約 4 時間』と表示する
      refs:
      - STD-GB-T-45122:6.4
    - name: 省電力モードの段階化
      description: 省電力を段階化する（軽度/重度/極限の命綱）。極限段階では中核機能（通話/救難）を保持する
      domain: digital
      example: 電池 5% で極限モードに入る：通話と位置情報のみ残す
      refs: []
    - name: 複数充電方式の冗長化
      description: 汎用の充電標準（USB-C PD/ワイヤレス）をサポートする。専用インターフェースには変換の方案を用意する
      domain: industrial
      example: 機器は独自インターフェースではなく USB-C を使う。変換アダプタを同梱する
      refs: []
    - name: 重要機能の低消費電力保証
      description: 安全系機能（転倒検知/緊急通報）には独立した低消費電力の保障経路を設ける
      domain: digital
      example: 緊急機能は独立した電源アイランドまたは超低消費電力チップ
      refs: []
    anti_patterns:
    - name: バッテリー不安を煽る設計
      description: 高頻度で起動し、バックグラウンドに常駐してこっそり電力を消費する
      consequence: ユーザーは省電力のためにアンインストールする。電池持ちは最も真実のユーザー痛点の一つである（Rahmati & Zhong 2009 の人と電池のインタラクション研究）
    - name: 独自充電エコシステム
      description: 専用充電器/独自プロトコル
      consequence: 充電器を失えば機器が機能停止する——汎用標準は電源包摂の最低ラインである
  G-HOW-F-004:
    name: 互換性マトリクスガイド
    patterns:
    - name: サポートマトリクスの明示
      description: プラットフォーム×ブラウザ×OS バージョン×AT のサポートマトリクスを文書化し継続的にテストする。サポートの境界を明示的にユーザーへ伝える
      domain: digital
      example: 製品ページでサポートマトリクスを公開：Chrome/Firefox/Safari の直近 2 つのメジャー版
      refs:
      - STD-EN-301549:6
    - name: プログレッシブ・エンハンスメント
      description: 基本機能は誰でも使え、拡張能力は端末に応じて漸進的に積み増す——中核は最新機能に依存しない
      domain: digital
      example: レイアウトは安定した CSS で実現し、新機能はあれば尚良い程度に使う
      refs: []
    - name: 標準 API 優先
      description: 標準化された Web/システム API を用い、独自機能や陳腐化したプラグイン（Flash のような袋小路）を避ける
      domain: digital
      example: ネイティブの HTML5 コントロール + ARIA の補完で、独自コントロールを作らない
      refs: []
    - name: AT テストの常時実施
      description: 主要な AT の組み合わせ（NVDA+Firefox、JAWS+Chrome、VoiceOver、TalkBack）を CI のリグレッションに含める
      domain: digital
      example: リリースのたびに AT のスモークテストのケース集を実行する
      refs: []
    anti_patterns:
    - name: 最新版至上主義
      description: 最新のプラットフォーム版のみをサポートする
      consequence: 企業環境、発展途上市場、慎重なユーザーは大量に旧バージョンのまま残る——サポートマトリクスを上へ追うより下へ伸ばすことが重要である
    - name: 単一エコシステムへの結合
      description: 単一のプラットフォーム/エコシステムへ深く依存する
      consequence: エコシステムの政策変更（公開停止/インターフェース変更）で全滅する。標準インターフェースが脱出の口である
  G-HOW-F-005:
    name: 技術環境適応ガイド
    patterns:
    - name: ローカル優先オプション
      description: スマート機器はローカルの制御経路（物理スイッチ/ローカルネットワーク制御）を提供し、クラウドに到達できないときも操作できるようにする
      domain: architecture
      example: スマートカーテン：アプリ + 壁のスイッチ + ローカルリモコンの三チャネル
      refs:
      - STD-EN-301549:11.7
    - name: 縮退体験の設計
      description: あらゆるクラウド依存に切断時の降格案を用意する：ローカルキャッシュ、読み取り専用モード、物理的な代替
      domain: universal
      example: 入退室システムはネット断時もローカルのホワイトリストで通行できる
      refs: []
    - name: 保守ツールの普遍化
      description: 修理に必要な工具と技能は現地での入手性に合わせて設計する（一般的なネジ/標準インターフェース/図解の手引き）
      domain: industrial
      example: プラスドライバー一本ですべて分解できるよう設計された製品
      refs: []
    anti_patterns:
    - name: クラウドへの人質化
      description: 端末がネット接続しないと基本機能を実行できない
      consequence: オフラインやサービス停止の後で製品は電子ゴミになる——ローカルの受け皿は製品の尊厳の最低ラインである
    - name: 専用工具依存
      description: 修理に専用工具/公式の訪問が必要
      consequence: 修理コストの高騰→ユーザーが修理を諦め→早期廃棄（持続可能な目標と直接矛盾する）
  G-HOW-F-006:
    name: 支援技術相互運用ガイド
    patterns:
    - name: 標準アクセシビリティ API
      description: UI コンポーネントはプラットフォーム標準のアクセシビリティ API（ARIA/UIAutomation/AT-SPI）を用いる。自前描画のコントロールは意味的役割を補完する
      domain: digital
      example: カスタムのドロップダウンメニューに完全な ARIA role/state/キーボード操作を含める
      refs:
      - STD-EN-301549:9.4
    - name: 正しいフォーカス順序
      description: フォーカス順は視覚的/論理的な順序と一致させる。フォーカスは可視で消失しない。モーダルはフォーカスを圏内に閉じ込める
      domain: digital
      example: Tab 順は読む順に従う。ダイアログを開くとフォーカスが入り、閉じるとフォーカスが戻る
      refs:
      - STD-W3C-WCAG22:4.1
    - name: テキスト代替の全網羅
      description: すべての非テキスト内容に等価なテキスト代替を用意する（alt/label/説明）。画像ボタンには読み上げ可能な名称を付ける
      domain: digital
      example: アイコンボタンに aria-label を付ける。装飾画像は alt を空にする
      refs: []
    - name: 実ユーザーによる検証
      description: AT 互換はエミュレーターだけでは不十分——実際の AT ユーザーをテスト工程に招く
      domain: digital
      example: リリース前に 5 名のスクリーンリーダーユーザーが中核タスクの点検を完了する
      refs: []
    anti_patterns:
    - name: AT の後付けパッチ
      description: 開発の完了後に『アクセシビリティを足す』
      consequence: 意味的に欠けた UI に ARIA を貼るより、ネイティブ部品の一行のラベルの方がましだ——アクセシビリティはアーキテクチャの決断であり、塩を撒く作業ではない
    - name: フォーカスのブラックホール
      description: フォーカスの消失/キーボードトラップ/順序の混乱
      consequence: スクリーンリーダーのユーザーは直接つながりを失う——フォーカス管理は AT 相互運用性の最初のドミノである
  G-HOW-F-007:
    name: 入出力チャネルガイド
    patterns:
    - name: 複数チャネルの併存
      description: 入力は 2 つ以上のチャネル（タッチ+キーボード/音声）、出力は 2 つ以上のチャネル（視覚+音/触覚）——いかなる単一チャネルも唯一の経路を構成しない
      domain: digital
      example: すべての操作：タッチ + キーボードショートカットの二チャネル
      refs:
      - STD-EN-301549:11.5.2
    - name: IO マッピングのカスタマイズ
      description: キーの再割当て/感度の調整/チャネルの切り替え——ユーザーの身体条件が最も快適な割当てを決める。ハードのデフォルトに任せない
      domain: universal
      example: 片手のユーザーは左右のキー割当てを入れ替える。振動強度は必要に応じて調整する
      refs: []
    - name: 外部デバイスの開放
      description: 標準の入出力 API/インターフェース（HID/Bluetooth/USB）を提供し、第三者の補助機器をプラグアンドプレイで使えるようにする
      domain: industrial
      example: 機器に標準の HID インターフェースを用意し、スイッチ/ジョイスティック/視線入力装置を接続できる
      refs: []
    - name: 多モーダル同期フィードバック
      description: 重要な状態のフィードバックはマルチモーダルで同期する（視覚+音+触覚）。各モダリティの意味が一致すること
      domain: digital
      example: 支払い成功：チェックマークのアニメーション + 短い音 + 軽い振動を同じ意味で
      refs: []
    anti_patterns:
    - name: チャネルの独裁
      description: ある機能がある一つの入力/出力チャネルしか経由しない
      consequence: そのチャネルの能力が制限されたユーザーは即座にロックされる——チャネル冗長性は情報到達の保険である
    - name: マッピングの覇権
      description: いかなるカスタマイズ調整も認めない
      consequence: 左利き、片手、振颤のユーザーの微調整ニーズが無視される。カスタマイズはギークの特権ではなく適応の必須である
  G-HOW-F-008:
    name: 認証アクセシビリティガイド
    patterns:
    - name: 二経路認証の最低ライン
      description: 能力要件の異なる独立した認証経路を少なくとも二つ用意する（例：パスワード+生体認証）。ユーザーが自身の能力に応じて選ぶ
      domain: digital
      example: パスワード（認知負荷）と指紋（運動要求）の二択
      refs:
      - STD-W3C-WCAG22:3.3.8
    - name: 認知テストの免除
      description: 認証では認知機能テスト（パスワードの記憶/パズル/計算）を強制しない。復旧フローも同様に免除する——代わりに信頼できる連絡先/機器/ハードウェアキーを用いる
      domain: digital
      example: パスワードを忘れた → 信頼できる機器に確認をプッシュし、秘密の質問は使わない
      refs: []
    - name: パスワードマネージャー親和
      description: パスワードマネージャーの自動入力を一切妨げない（autocomplete=off にしない）。フォームのセマンティクスを正しくする（type=password + id）
      domain: digital
      example: ログインフォームは貼り付けと自動入力を許す——これは機能であって脆弱性ではない
      refs: []
    - name: 人間に優しいセッション
      description: セッション時間はタスクの必要に応じて設定し延長可能とする。認知/運動の緩慢さで途中切断され再認証させられない
      domain: digital
      example: 長文を読むときは黙ってセッションを更新し、『再ログイン』を出して中断させない
      refs: []
    anti_patterns:
    - name: 単一認証の押し付け
      description: 認証方式をひとつだけ提供し全員に強制する
      consequence: WCAG 3.3.8 に直接違反——認知障害者は複雑なパスワードを覚えられず、運動障害者は指紋を押せない。認証がそのままフィルターになる
    - name: 復旧の死の谷
      description: アカウント復旧が秘密の質問/身分証の提出など高いハードルに依存する
      consequence: 最も弱い瞬間に最も高い壁の外に閉じ出されるユーザー——復旧経路の可用性要求は日常ログインより高い
  G-RUL-001:
    name: アクセシビリティ適合実装ガイド
    patterns:
    - name: AA ベースライン優先
      description: WCAG 2.2 AA を強制ベースラインとする（EN 301 549 の調達要求に整合）。AAA は場面に応じて選択的に達成する——まずベースラインを守ってから卓越を語る
      domain: digital
      example: 新規プロジェクトの受け入れチェックリストに WCAG 2.2 AA の適用可能な全条項を直接内蔵する
      refs:
      - STD-W3C-WCAG22:1
      - STD-EN-301549:9
    - name: アクセシビリティ声明の公開
      description: アクセシビリティ宣言を公表する（対象範囲/既知の障壁/フィードバック経路/改善計画）。ユーザーが照合できる約束を示す
      domain: digital
      example: 製品ページにアクセシビリティ宣言 + 障壁を報告する専用の入口
      refs:
      - STD-GB-T-37668:1
    - name: 自動スキャン＋人手監査の二本柱
      description: CI に自動スキャン（axe/Lighthouse）を内蔵してリグレッションを阻止 + 定期的な人手監査（スクリーンリーダーによる点検/専門家レビュー）——機械は技術項目を、人は体験項目を捉える
      domain: digital
      example: マージリクエストに自動スキャンのゲートをかけ、四半期ごとに専門家監査を行う
      refs: []
    anti_patterns:
    - name: 適合が終点
      description: コンプライアンス報告書を取得した時点で投資を止める
      consequence: 反復の中でもアクセシビリティは持続的に回帰する——コンプライアンスは証明書ではなくプロセスである。アクセシビリティの借金もコードと同じように蓄積する
    - name: オーバーレイパッチ神話
      description: ワンタッチ型アクセシビリティ・オーバーレイツールを買ってコンプライアンスを済ませようとする
      consequence: 業界のコンセンサスもユーザーの報告も、overlay が実際の修正を代替できず逆に補助技術を妨げると示している——偽のコンプライアンスに金が動く
  G-RUL-002:
    name: データプライバシー適合ガイド
    patterns:
    - name: デフォルトで最小化
      description: デフォルトで最小限のデータのみ収集する。各収集には明確な目的があり、目的に限って使用する——最小化はプライバシーコンプライアンスの第一原則である
      domain: universal
      example: 登録ではメールのみ収集。誕生日/携帯番号は任意入力で用途を説明する
      refs:
      - STD-GDPR:25
    - name: 同意撤回の対等な容易さ
      description: 同意を撤回する経路は同意を与えるのと同じくらい容易にする。撤回は即時反映しデータの状態を知らせる
      domain: digital
      example: プライバシーパネルでワンタッチで個別許諾を取り消し + 取消後の処理状態をフィードバックする
      refs:
      - STD-GDPR:7.3
      - STD-PIPL:15
    - name: 権利対応 SLA
      description: データ主体の権利（閲覧/複製/訂正/削除）に応答フローと SLA を設ける：GDPR は 1 か月の期限、PIPL は適時の応答——スローガンではなくプロセスとする
      domain: universal
      example: 権利の請求をチケット化し、期限超過で自動的にエスカレーションする
      refs:
      - STD-GDPR:12.3
      - STD-PIPL:45
    - name: 拒否に不利益なし
      description: 許諾の拒否/同意の撤回後も基本サービスが影響を受けない（法令上必須の処理は例外とし、それを説明する）
      domain: digital
      example: マーケティングの許諾を拒否しても全中核機能が通常どおり使える
      refs:
      - STD-PIPL:16
    anti_patterns:
    - name: 同意工場
      description: 冗長な条項の壁 + デフォルトでチェック済み + 拒否ボタンをグレーアウト
      consequence: GDPR/PIPL のいずれの下でも有効な同意にならない（自由意志による付与の原則）。『同意した』ユーザーは決して本当に許可していない——法と信頼の双方の敗北
    - name: 越境の盲点
      description: データの越境移転でコンプライアンス経路を評価していない
      consequence: PIPL 第38-40条は越境の安全評価/認証/標準契約の三択を要求する——越境処理のコンプライアンス経路を設計に先に織り込む必要がある
  G-RUL-003:
    name: 安全認証計画ガイド
    patterns:
    - name: 対象市場リストの先行策定
      description: プロジェクト開始時に対象市場とその強制認証を確定する（CE/UL/MDR/CCC など）——認証要求は要求の一部であり、後から足す資料ではない
      domain: industrial
      example: 製品要求文書に『対象市場の認証マトリクス』の章を含める
      refs: []
    - name: 要求トレーサビリティ・マトリクス
      description: 各認証条項を設計文書とテスト証拠まで追跡する（条項→要求→設計→テストの四方向で追跡可能）
      domain: industrial
      example: ISO 26262 の条項-要求-テストの三者間トレーサビリティ表
      refs:
      - STD-ISO-26262
    - name: 危害分析の先行実施
      description: 危害分析とリスク評価（HARA/FMEA）は設計の早期に完了させ、事後対応ではなく安全要求を駆動する
      domain: industrial
      example: 概念段階で HARA を出力しレビューしてから詳細設計に入る
      refs: []
    - name: 事前コンプライアンス試験
      description: 正式な認証の前に事前テストのギャップ分析を行う——問題を提出前に潰す
      domain: industrial
      example: 提出前に社内で標準の全項目を自己試験 + ギャップの一覧を作る
      refs: []
    anti_patterns:
    - name: 認証の後回し
      description: 製品完成後に認証基準と照合する
      consequence: 構造的な不適合（材料/冗長設計）は整備では解決できない——やり直しは後置き認証でよくある結末である
    - name: 最低限の合格狙い
      description: 検出サンプルに合わせて個別対応し、標準に沿って設計しない
      consequence: 抜き取り検査/再検査/実際の事故での露見——通関前提で設計された製品は実世界で丸裸である
  G-RUL-004:
    name: 知的財産適合ガイド
    patterns:
    - name: SBOM の全量管理
      description: ソフトウェア部品表（SBOM）を SPDX 標準で維持する：全依存のライセンス、版、出所を機械可読にする
      domain: digital
      example: CI が SBOM を自動生成し、新規依存のライセンススキャンをゲートにする
      refs:
      - STD-SPDX
    - name: 素材ライセンス台帳
      description: 画像/フォント/音声は項目ごとに許諾元と許諾範囲を登録する。『ネットで拾った』は許諾ではない
      domain: universal
      example: 素材ライブラリの各項目に許諾の証憑を付す（購入記録/許諾書/ライセンスのリンク）
      refs: []
    - name: 伝染性ライセンスの隔離
      description: GPL などの伝染性ライセンスのコンポーネント導入には独立したレビュー工程を設ける：リンク方式、配布境界、義務の一覧
      domain: digital
      example: 新規依存が GPL 系ライセンスを含むと法務レビューのチケットが発行される
      refs: []
    - name: ライセンス表記の規範化
      description: すべてのオープンソースコンポーネントについてライセンスの要求どおり著作権表示と LICENSE ファイルを保持する。リリース物にライセンス一覧を添付する
      domain: digital
      example: 配布パッケージに完全な第三者ライセンス表示ファイルを含める
      refs: []
    anti_patterns:
    - name: ライセンス不明の依存
      description: ライセンスの明示されていないコードをコピー&ペーストする/無許諾の素材を使用する
      consequence: 販売停止、賠償要求、企業のデューデリジェンスが通らない——一度の侵害で全てのコスト上の利点が消える
    - name: ライセンス即同意
      description: オープンソース=自由に使えるとみなす
      consequence: オープンソースライセンスは条件なしの許可ではない——GPL の伝染性、表示義務、商用制限はそれぞれ異なり、違反は権利侵害になる
  G-RUL-005:
    name: 倫理審査実践ガイド
    patterns:
    - name: 人対象研究の審査必須
      description: ユーザー研究/データ収集が人に関わるなら倫理審査を通す（IRB/倫理委員会）。インフォームドコンセントのプロセスを完備する——Respect for Persons の制度化
      domain: universal
      example: ユーザーテストの前に目的/リスク/離脱する権利を含むインフォームドコンセントに署名する
      refs:
      - STD-BELMONT
    - name: インフォームドコンセントの敷居下げ
      description: 同意文は参加者が理解できる言語（図解/階層的な要約）で示し、『署名』ではなく『知情』を確保する
      domain: universal
      example: 1 ページ図解版の同意書 + 用語の平易な対照
      refs: []
    - name: アルゴリズム公平性監査
      description: アルゴリズムによる意思決定システムは影響を受ける集団ごとに層別のデータ監査を行う（集団間の誤り率/通過率の差）——Justice 原則を AI の場面に落とし込む
      domain: digital
      example: 採用システムは性別/年齢で層別に通過率の差を監査する
      refs:
      - STD-IEEE-EAD
    - name: 倫理フィードバック経路
      description: 製品に倫理問題の通報/フィードバック経路を内蔵し処置フローに組み込む——倫理監督は一度きりの審査ではなく継続的な仕組みである
      domain: digital
      example: 『問題を報告』の入口に倫理カテゴリを含め、応答期限を設ける
      refs: []
    anti_patterns:
    - name: 倫理の見せかけ
      description: 形だけの倫理審査/壁に掲げただけの価値観
      consequence: 真の倫理問題（依存性設計/偏見アルゴリズム/操作）こそ誰も見ていない場所で起きる——審査は儀式ではなく統治である
    - name: 同意即免責
      description: ユーザーの同意を得れば何でもありと考える
      consequence: Belmont 原則の Beneficence（リスクと利益の評価）は同意とは独立している——同意書は、それ自体が正当化されない害を覆い隠せない
  G-RUL-006:
    name: 業界規範整合ガイド
    patterns:
    - name: 業界規範リストの維持
      description: 対象業界の参入規範を一覧として維持する（医療 HIPAA/金融 PCI DSS/教育 FERPA/航空 DO-178C）。年次で見直し更新する
      domain: universal
      example: コンプライアンス台帳に適用規範の一覧+版+担当者+再審査日を含める
      refs: []
    - name: 条項からエビデンスへのマッピング
      description: 適用される各規範条項を具体的な証拠（設計文書/テスト報告/プロセス記録）に対応づける——対応づけは読んだことではなく、検証可能であること
      domain: universal
      example: HIPAA の技術的保護条項 → 暗号化設定文書 + 監査ログの見本
      refs: []
    - name: 変更追跡の仕組み
      description: 業界規範の更新チャネルを購読する（標準化団体/規制の公告）。版の変更でギャップ評価を発動する
      domain: universal
      example: PCI DSS の新版公表 → 30 日以内にギャップ評価報告を出す
      refs: []
    - name: 領域別コンプライアンス責任者
      description: 業界横断の製品では業界領域ごとにコンプライアンス責任者を置く——規範の専門性は『一人で全部を管む』ことを許さない
      domain: universal
      example: 医療ラインと金融ラインにそれぞれ DPO/コンプライアンス担当を置く
      refs: []
    anti_patterns:
    - name: 規範のスナップショット
      description: コンプライアンス検査を一度行って保管すれば永久に有効とみなす
      consequence: 業界規範は継続的に進化する（PCI DSS 3→4 の変化は巨大）。スナップショット式コンプライアンスは二度目の審査で違反の証拠になる
    - name: 汎用コンプライアンス幻想
      description: ひとつのコンプライアンス策で全業界をまかなおうとする
      consequence: 医療/金融/教育には各々の専門条項があり、汎用案はどの業界にも中途半端になる——領域分割は業界コンプライアンスの鉄則である
  G-WHAT-F-001:
    name: タスク複雑度管理ガイド
    patterns:
    - name: 分割統治
      description: 複雑なタスクは線形の単純なサブタスクに分割する。各ステップはひとつの焦点の意思決定とし、ステップ間で状態を自動的に引き継ぐ
      domain: digital
      example: 口座開設フローを『1 ページ 30 項目』から『5 ステップ各 6 項目』に変える
      refs:
      - STD-ISO-9241-110:5.1
    - name: デフォルト値による負担軽減
      description: 予測可能な選択はデフォルト値+スマート推薦で受け止め、ユーザーはデフォルトから外れるときだけ操作する
      domain: digital
      example: インストールウィザードはデフォルトで推奨構成、詳細オプションは折りたたみ
      refs: []
    - name: ウィザード形式の誘導
      description: 初回の複雑なタスクにはウィザードのテンプレートを提供する。慣れたらスキップして専門家向けの経路へ直行できる
      domain: digital
      example: レポートツール：初回はウィザード、その後はテンプレートライブラリへ直行
      refs: []
    - name: 意思決定ポイントの予算
      description: 中核フローの意思決定点の数に上限を設ける（1 ステップあたり 3 以下）。予算超過ならタスクを再分割する
      domain: universal
      example: 会計フローでは任意の追加購入のポップアップを削り、会計の後に回す
      refs: []
    anti_patterns:
    - name: ステップの詰め込み
      description: 『ユーザーが必要とするかも』としてすべての設定をひとつのフローに詰め込む
      consequence: 意思決定疲労の下でユーザーは選び乱れて諦める——誰も 30 個の選択肢の『自由』を望んでいない
    - name: 一枚の巨大フォーム
      description: 長いフォームを 1 ページで最後まで
      consequence: 完了率は項目数に比例して下がり、段階化+プログレスバーでは完了率が明らかに高くなる——分割は転換の最適化であり包摂でもある
  G-WHAT-F-002:
    name: 認知負荷制御ガイド
    patterns:
    - name: ワーキングメモリの負担軽減
      description: 情報は 1 画面に詰め込まず段階的に提示する。ユーザーが前の手順を覚えていなければ次の手順ができない状態にしてはならない
      domain: universal
      example: 段階式フォームの上部に入力済みの要約を常時表示する
      refs:
      - STD-ISO-9241-110:5.1.3
    - name: 負荷の測定可能性
      description: 中核タスクは NASA-TLX などの尺度で負荷のベースラインを確立する。中程度の負荷（TLX>60）を超えたら再設計を発動する
      domain: digital
      example: 新機能のローンチ前に 5 名で TLX を簡単に測定し、平均が 60 超なら差し戻す
      refs:
      - STD-NASA-TLX
    - name: インライン・ヘルプの埋め込み
      description: ヘルプ情報は使用地点の近くに出す（インラインのヒント/ホバー説明）。ヘルプセンターへの遷移を強制しない
      domain: digital
      example: 日付書式の誤りには文書へ飛ばすのではなくインラインの例を示す
      refs:
      - STD-W3C-WCAG22:3.3.7
    anti_patterns:
    - name: ポップアップ爆撃
      description: ポップアップ、バナー、オーバーレイを重ねて同時に注意を奪い合う
      consequence: 認知過負荷の下ではすべての情報が無情報と等しい——注意力はゼロサムの資源である
    - name: ヘルプセンターの孤島
      description: ヘルプ内容を独立したページにまとめて置く
      consequence: ヘルプへのジャンプ＝文脈の喪失+もう一往復。使用点で答えを与えるのが有効なヘルプである
  G-WHAT-F-003:
    name: フォールトトレランス設計ガイド
    patterns:
    - name: 取り消し優先
      description: エラー処理の第一梯隊は取り消し（undo/履歴/ゴミ箱）であり、確認のポップアップは最後の手段——取り消しは心の流れを中断しない
      domain: digital
      example: ファイル削除 → ゴミ箱 + Ctrl+Z、確認ダイアログなし
      refs:
      - STD-ISO-9241-110:5.6
    - name: 危険操作の隔離
      description: 不可逆操作は物理的/視覚的に隔離する（独立した赤い領域、長押しまたは二度押しで発火）+ 必要な確認
      domain: digital
      example: 『全データを消去』は設定の奥の赤い独立領域にあり、確認語の入力が必要
      refs:
      - STD-W3C-WCAG22:3.3.4
    - name: エラーメッセージの三要素
      description: 各エラーメッセージには次を含める：何が起きたか（平易な言葉）+ なぜか + どう直すか——エラーメッセージは設計の一部であり、プログラマーのデバッグ出力ではない
      domain: universal
      example: 『アップロード失敗：ファイルが 10MB の上限を超えています——画像を圧縮して再度アップロードしてみてください』
      refs: []
    - name: 自動保存スナップショット
      description: 版のスナップショット+自動保存はデフォルトで有効にする。ユーザーはいつでも任意の履歴状態に戻れる
      domain: digital
      example: 文書は 30 秒で自動保存 + 24 時間の版履歴
      refs: []
    anti_patterns:
    - name: 確認ダイアログの乱用
      description: すべての操作に確認を求める
      consequence: 確認疲労の後でユーザーは無脳に『はい』を押す——最も必要なときに確認ダイアログは保護の役割を失う
    - name: エラーコードの責任転嫁
      description: エラー時に『Error 5003』しか出さない
      consequence: ユーザーは自力で解決できず助けも求められない——エラーコードは開発者のためのもので、ユーザーに必要なのは修復への道筋である
    - name: 不可逆すなわち危険
      description: デフォルトでは操作は可逆で、例外のみ保護を要する——逆に言えば：不可逆+無保護=設計上の欠陥
      consequence: 誤削除、誤送信、誤支払い——一度の不可逆なエラーが破壊した信頼を取り戻すには十回の成功が必要である
  G-WHAT-F-004:
    name: タスク継続性ガイド
    patterns:
    - name: 情報の再入力要求をしない最低ライン
      description: 同一フロー内でシステムが既知のユーザー情報は自動入力し、二度目の入力を決して求めない
      domain: digital
      example: 会計ページは配送先住所を自動で呼び出し、変更時のみ確認する
      refs:
      - STD-W3C-WCAG22:3.3.7
    - name: 自動下書き保存
      description: 長時間タスクは全行程で黙って自動保存する。中断（誤操作/着信/停電）から損失なく復元する
      domain: digital
      example: フォームは各フィールドからフォーカスが外れると下書きを保存し、開き直すと直行する
      refs: []
    - name: 「前回の続き」導線
      description: 『前回の続きから』を常に目立つ場所に配置する。再開に再ナビゲーションは一切不要
      domain: digital
      example: 学習アプリの最初の画面の一番目のボタンが『第 3 節を続ける』
      refs:
      - STD-W3C-WCAG22:3.2.3
    - name: デバイス間同期
      description: タスク状態をクラウドで同期し、端末を変えてもシームレスに再開できる（良好/優秀グレード、M-WHAT-F-004-01 参照）
      domain: digital
      example: スマホで書きかけの文書を、タブレットで開くとカーソルが元の位置にある
      refs: []
    anti_patterns:
    - name: 一気に完了の要求
      description: 長時間タスクは一度で完了しなければやり直し
      consequence: 2 回中断されたユーザーはそのまま諦める——中断は常態（着信、子ども、電車到着）であり例外ではない
    - name: サイレント消失
      description: セッションタイムアウトで入力がすべて消去される
      consequence: 30 分の入力が水泡に消える——ユーザーは単に離脱するのではなく、怒りを持って離脱する
    - name: 同じ情報の重複要求
      description: 同一フローで提供済みの情報を繰り返し求める
      consequence: 『さっき入力したのに』——冗長な入力は最も率直な disrespect である（WCAG 3.3.7 の法制化表現）
  G-WHAT-F-005:
    name: 協働タスクガイド
    patterns:
    - name: 役割と権限の明示
      description: 協働の開始前に役割と権限を明確にする（閲覧/コメント/編集/管理）。職責の不明確さはあらゆる協働摩擦の源である
      domain: digital
      example: 文書共有はデフォルトで読み取り専用、必要に応じて編集権限を上げる
      refs:
      - STD-ISO-9241-110:5.5.4
    - name: 非同期優先
      description: デフォルトで非同期の協働をサポートする（コメント/@/状態追跡）。リアルタイム同期は真に並行が必要な場面にのみ用いる
      domain: digital
      example: レビューの流れ：各自が非同期で注釈 → 集約会議では対立点だけを処理する
      refs: []
    - name: 進捗の自動集約
      description: 協働の状態変化を関係者へ自動通知する（購読可能な段階分け）。『進捗を尋ねる』コミュニケーションの手間を減らす
      domain: digital
      example: タスクボードの自動通知：自分が担当するもの + @されたもののみ
      refs: []
    anti_patterns:
    - name: 会議が既定
      description: 協働が必要なら会議を開く
      consequence: 同期会議は全員の予定を最遅の人のペースに固定する。非同期ツールは協働を時間の束縛から解放する
    - name: 権限の混沌
      description: 全員に全権限、または誰が何を管轄するか誰も知らない
      consequence: 誤操作、責任の真空、版の混乱——権限構造は協働の基礎であり、事務的な負担ではない
  G-WHAT-F-006:
    name: 中断耐性設計ガイド
    patterns:
    - name: 未保存状態の可視化
      description: 未保存の状態を UI に常時表示する（ドット/バッジ/文言）。終了前に能動的に確認する——保存状態を可視の状態にする
      domain: digital
      example: 未保存の変更を含むタブを閉じるときは明確に知らせる
      refs:
      - STD-W3C-WCAG22:3.2.3
    - name: 集中モードの設定可能化
      description: ユーザーが非緊急の通知を能動的に遮断できる（集中モード/状態設定）。緊急の例外はホワイトリストとして明示する
      domain: digital
      example: 執筆アプリのワンタッチ禅モード：全画面+おやすみ+タイマー
      refs: []
    - name: 後で処理キュー
      description: あらゆるタスクをワンタッチで ToDo キューへ保留しリマインダーを設定できる——中断は忘却でも即時処理でもない
      domain: digital
      example: 読みかけの記事 → あとで読む + 夜 8 時のリマインダー
      refs: []
    - name: タスクの自然な区切り
      description: タスク構造を中断可能な粒度で分割する。中断点で状態が完全に復元できる
      domain: universal
      example: 動画講座は 10 分ごとに章のクイズがあり、それが自然な中断点になる
      refs:
      - STD-ISO-9241-110:5.5.2
    anti_patterns:
    - name: 通知の全貫通
      description: あらゆる通知があらゆるタスクをいつでも中断させる
      consequence: 深い集中作業は 3 分の断片に解体される。中断された集中の回復には平均 20 分かかる。通知は階層と段階分けが必要である
    - name: 中断が罰
      description: 中断されると進捗/連続記録/セッションが失効する
      consequence: ユーザーは中断のペナルティを避けるために緊張して身構える——製品とユーザーの目標のずれが対立になる
  G-WHEN-F-001:
    name: 利用時間帯適応ガイド
    patterns:
    - name: 時間帯を考慮する UI
      description: UI は使用時間帯に応じて自動調整する（夜間は暗色/朝は明るく）。自動判断を手動で上書きできる
      domain: digital
      example: 22:00 以降は自動で暗色テーマ、日中は高コントラスト
      refs: []
    - name: おやすみモード境界の尊重
      description: 通知とリマインダーはユーザーが設定した希望時間帯とシステムのサイレントモードを守る。緊急情報はホワイトリストで例外とし明示する
      domain: digital
      example: マーケティング通知はおやすみを守る。安全警報は貫通させるが本当の緊急に限る
      refs: []
    - name: 時間帯別タスク推薦
      description: 時間帯に応じて内容と機能を推薦する（朝の速報/昼の軽量/夜の深掘り）。使用習慣の変更を強制しない
      domain: digital
      example: 学習系アプリは朝に 15 分のマイクロ講座を推薦する
      refs: []
    anti_patterns:
    - name: 終日プッシュ
      description: デフォルトでいつでもユーザーを妨害してよい
      consequence: 深夜のマーケティングプッシュはそのままアンインストールを招く。時間帯への配慮は通知の基本的な礼儀である
    - name: 時間帯のハードコード
      description: 固定した時刻表で機能を切り替える
      consequence: シフト勤務や越境旅行者の実作息は固定時刻表と合わない——時計ではなくユーザーに従う
  G-WHEN-F-002:
    name: 利用頻度の階層化ガイド
    patterns:
    - name: 高頻度ユーザー向け効率経路
      description: 高頻度ユーザーには効率機能を提供する：ショートカット、一括操作、よく使う機能の固定——繰り返しは最も強い個別化の信号である
      domain: digital
      example: ある機能を 5 回使うと自動的に最初の画面の推薦枠に現れる
      refs: []
    - name: 低頻度ユーザー向け記憶支援
      description: 低頻度ユーザーには記憶支援を提供する：最近使った記録、デフォルト値の事前入力、明確な案内——『思い出せない』を設計の入力として扱う
      domain: digital
      example: 月次支払いページは前回の支払い段階を自動で呼び出す
      refs: []
    - name: 再訪の仕組みの階層化
      description: 間隔で層別に再訪を設計する（週次アクティブ/月次アクティブ/休眠ユーザー）。頻度は仮定ではなくユーザーデータで決める
      domain: service
      example: 休眠ユーザーにはシステムの売り込みではなく『あなたの植物はまだ生きていますか』が届く
      refs: []
    anti_patterns:
    - name: 一画面で全員対応
      description: ひとつの UI で高頻度ユーザーと低頻度ユーザーを同時に満足させようとする
      consequence: 高頻度ユーザーは遅いと感じ、低頻度ユーザーは乱雑と感じる——階層的な入口は万能 UI より安くて効果的である
    - name: 粘着指標の暴政
      description: DAU/MAU を高めるために強制的に起動理由を作り出す
      consequence: 指標のために設計された機能がユーザーの時間を消費する——依存性設計は短期的にはデータが良く見えるが、長期的には信頼が崩壊する
  G-WHEN-F-003:
    name: 季節性適応ガイド
    patterns:
    - name: 気候パラメータに基づく設計
      description: 対象市場の気候データ（気温の極値/雨季の日数/日照の変化）に基づいてハードと機能の包絡線を設定する。四季が均等という仮定を置かない
      domain: industrial
      example: 南方の高温多湿市場の製品は 35°C の公称ではなく 40°C×90%RH で設計する
      refs: []
    - name: 季節機能のオン・オフ
      description: 季節関連の機能は時季に応じて自動的に使えるようにする（雨季の警報、花粉のリマインダー、雪道モード）。旬でない時期は画面を占めない
      domain: digital
      example: 天気アプリは 6 月に台風追跡を自動で公開し、1 月には氷雪路面の警報に切り替える
      refs: []
    - name: 異常気象への冗長性
      description: 極端な気象（猛暑/厳寒/豪雨）の日数を現地データで製品の信頼性設計に組み込む（M-WHEN-F-003-01 の場面カバレッジに対応）
      domain: industrial
      example: デリバリーの箱は現地の夏の高温ピークに合わせて保温性能を設定する
      refs: []
    anti_patterns:
    - name: 温帯中心主義
      description: デフォルトで四季が明瞭で気候が温暖とする
      consequence: 熱帯では一年中夏、極地では長い冬という地域に誤った季節の製品が届く——気候適応はローカライゼーションの一部である
    - name: 装飾的な季節対応
      description: 季節適応をテーマのスキンだけにする
      consequence: スキンを替えても本当の問題は解決しない（雨季の路面警告は夏のスキンよりずっと有用）。季節性はまず機能を満たしてから雰囲気の話をする
  G-WHEN-F-004:
    name: 時間的プレッシャー適応ガイド
    patterns:
    - name: 残り時間の可視化
      description: 時間制限のあるタスクは残り時間と進捗をリアルタイムに表示する。カウントダウンの設計では圧力が成果に与える影響を考慮する
      domain: digital
      example: 試験システムは残り時間を常時表示し、最後の 10 分で視覚的に知らせる
      refs:
      - STD-W3C-WCAG22:2.2.1
    - name: 制限時間の調整可能な経路
      description: 時間圧がタスクの本質でない場合はオフ/延長できる（時間無制限モード、延長申請）——圧力は手段であり目的ではない
      domain: universal
      example: 練習モードは時間無制限、試験モードでのみ計時する
      refs: []
    - name: ショートカット経路の事前用意
      description: 高頻度の緊急場面には訓練済みのショートカットを提供する（ワンタッチ注文、常用薬の再購入へ直行）
      domain: digital
      example: 常用薬はワンタッチで再処方、閲覧の工程をすべて飛ばす
      refs: []
    - name: 待ち時間の正直な提示
      description: 読み込み待ちには実際の見積りと進捗を示す。想定を超える待ちには代替を用意する（後で通知して）
      domain: digital
      example: プログレスバーは偽の一定速度ではなく実際の速度で進む
      refs: []
    anti_patterns:
    - name: 人為的なカウントダウン
      description: 偽の切迫感（『残り 3 分！』）で意思決定を急かす
      consequence: 圧力下の意思決定の質が低下し、後悔率が上がる——不安を作って転換を得るのはダークモードである（Mathur et al. 2019 分類学の圧迫条項）
    - name: 待ち時間のブラックホール
      description: 進捗表示のない読み込み
      consequence: ユーザーは待てべきか待つなすべきか分からない——2 秒のフィードバックの無さは 10 秒と感じられる。正直な待ち時間は嘘の速さより許容される
  G-WHEN-F-005:
    name: 断片時間適応ガイド
    patterns:
    - name: タスクの分割と再開
      description: 長時間タスクを独立して完了できる時間の塊（15 分粒度）に分ける。各塊に自然な中断点と再開の入口を設ける
      domain: digital
      example: オンライン講座は 15 分で 1 節とし、1 節学ぶと再開位置を自動記録する
      refs:
      - STD-W3C-WCAG22:2.2.1
    - name: 後で再開の仕組み
      description: あらゆる長時間タスクを保留し後で再開できる：『後で』の入口を常設し、状態を完全に保持する
      domain: digital
      example: 長文の読書を途中で終了し、次に開くと元の位置へ直行する
      refs: []
    - name: 段階別の所要時間提示
      description: 長時間タスクの開始前に段階的な計画と総所要時間の見込みを示し、ユーザーが使える時間で判断できるようにする
      domain: universal
      example: フォームの最初のページに『約 20 分、3 回に分けて記入できます』と表示する
      refs: []
    anti_patterns:
    - name: まとまった時間の前提
      description: デフォルトでユーザーに連続したまとまった時間があると想定する
      consequence: 通勤族、ケアする人の実時間はすべて断片だ——まとまりの仮定で 80% のユーザーは永遠に手をつけられない
    - name: 中断で消失
      description: 中断後に進捗が保持されない
      consequence: 一度の割り込みで最初からやり直し——用户在教訓を得た後は最初から始めなくなる
  G-WHEN-F-006:
    name: 疲労フレンドリー設計ガイド
    patterns:
    - name: 疲労シグナルへの対応
      description: 行動の疲労信号（連続ミス、操作の鈍化、セッションの長時間化）を監視し応答を発動する：休憩の提案または UI の簡素化
      domain: digital
      example: パスワードを 3 回続けて間違えると、ロックするのではなく『少し休みませんか』と知らせる
      refs:
      - STD-W3C-WCAG22:2.2.6
    - name: 中断時保存の最低ライン
      description: 長時間セッションは全行程で自動保存する。疲労による中断でもデータを失わない——保存は製品の責任であり、ユーザーの記憶の負担ではない
      domain: universal
      example: 文書は 30 秒ごとに黙って保存し、終了しても即座に復元する
      refs: []
    - name: 疲労時の UI 負荷低減
      description: 疲労状態を検出したら情報量を絞り、重要要素を拡大し、操作の許容度を広げる
      domain: digital
      example: 長時間のセッションの後は自動で大ボタンモードに切り替える
      refs: []
    - name: 小休憩のリマインダー
      description: 長時間セッションの製品には休憩リマインダーを内蔵する（オフ可）。説教ではなくリマインドの間隔を調整可能にする
      domain: digital
      example: 45 分後に穏やかに通知し、ユーザーは以後リマインドしないよう設定できる
      refs: []
    anti_patterns:
    - name: 無限コンボ設計
      description: 連続するタスクの流れ+進捗の不安でユーザーが立ち止まれないようにする
      consequence: 疲労の蓄積で誤り率が急上昇する（特に産業/医療の場面では安全事故になる）。ユーザーを画面に留める設計は敬意ではなく加害である
    - name: 休憩への罰
      description: 中断/休憩で進捗/報酬が失われる
      consequence: streak 仕組みは休息を汚名化する——健全な使用と商業指標の衝突において、ユーザーの健康が賭け金であってはならない
  G-WHERE-F-001:
    name: 物理環境適応ガイド
    patterns:
    - name: 使用環境エンベロープ試験
      description: 製品設計は実使用環境の包絡線で試験する（温度/湿度/振動/光の交差組合せ）。実験室の理想条件を受け入れ基準にしない
      domain: industrial
      example: 屋外機器は単一の公称値ではなく -20〜50°C × 30-90% RH の交差マトリクスで試験する
      refs:
      - STD-ISO-21542:5.4
    - name: 強光下での可読性確保
      description: 屋外/強い光の場面でも画面情報を読めるように保つ：高輝度モード + 高コントラストの方案 + 遮光構造
      domain: digital
      example: 日差しの下では明るさを上げるだけでなくコントラストを自動で高める
      refs: []
    - name: 防水・防塵等級
      description: 対象場面に応じて IP 保護等級を選び仕様に明示する。日常の水はね場面では少なくとも IP54
      domain: industrial
      example: キッチン家電のパネルは IPX4 から
      refs: []
    - name: 環境補償の設計
      description: 環境による感覚の減衰を補う経路を用意する：騒音が大きい→視覚/触覚フィードバックで補う、強い光→音声で補助する
      domain: universal
      example: ノイズキャンセリングマイク + 音声の文字起こしの二重の保険
      refs: []
    anti_patterns:
    - name: 実験室の幻想
      description: 実験室の理想条件のみで設計・検証する
      consequence: 高温+高湿の交叉、移動時の振動などの現実的な組み合わせでは性能が急落する——ユーザーが手にした初日から遭遇する
    - name: 極端条件への偏執
      description: 極端な状況（水中/高温）だけを防ぎ、日常の軽微な不利（やや明るすぎる部屋、手のひらの汗）を無視する
      consequence: 極端な保護でコストだけが積み上がり、日常の 90% の場面の可用性は誰も面倒を見ない
    - name: 環境複合の盲点
      description: 単一の要因ごとに基準を満たせば安全とみなす
      consequence: 高温+高湿、振動+粉塵などの交叉効果が重なると基準を超える——真の環境は単一要因で現れることはない
  G-WHERE-F-002:
    name: 社会環境包摂ガイド
    patterns:
    - name: バイアス監査の先行実施
      description: 内容/アルゴリズム/表示における集団の表象についてバイアス監査を行う（多様性の表現、ステレオタイプの走査）。公開前に完了させる
      domain: digital
      example: 画像素材ライブラリは肌の色/年齢/体型の分布で審査し、単一の美意識の基準を用いない
      refs: []
    - name: 社会的分離の防止
      description: 物理的/デジタルの空間で階層/身分による隔離設計を避ける（別入口、専用区域）。共有設備の品質は均等にする
      domain: architecture
      example: 住宅プロジェクトは全入口を同一基準とし、『サービス要員専用の扉』を設けない
      refs: []
    - name: 多様性の表現
      description: 公衆向けの画像/コピーは集団の多様性を表し、単一の集団が『デフォルトの形象』を独占するのを避ける
      domain: universal
      example: イラストの登場人物が車椅子利用者、さまざまな年齢と文化を覆う
      refs: []
    - name: 地域規範への適応
      description: 社会規範の差異（身体的接触、視線、性別のやり取りの礼儀）をローカライズのチェックリストに含める
      domain: universal
      example: サポートの挨拶は地域文化に応じて丁寧さを段階化する
      refs: []
    anti_patterns:
    - name: 技術可用＝社会可用の錯覚
      description: 機能が動けばすべての集団が使えるとみなす
      consequence: 隠れた偏見（誰をデフォルトにするか、誰を特別扱いするか）が設計を通じて伝わる——周縁集団は『使える』製品の中で不快さを感じ続ける
    - name: 中立性の幻想
      description: 設計は中立だと唱えつつ、実際は支配的集団の視点をデフォルトにしている
      consequence: 『中立』な設計は支配的集団には見え、周辺集団には浮かび上がる——立場を持たないこと自体が立場である
    - name: プア・ドア効果
      description: 支払い/身分に応じて品質の異なる設備入口を設ける
      consequence: 公開の制度的な差別のシグナルであり、すべてのユーザーの信頼と尊厳を損なう
  G-WHERE-F-003:
    name: 空間アクセシビリティガイド
    patterns:
    - name: 通行有効幅の最低ライン
      description: 主たる通行経路の有効幅は 900mm 以上（車椅子が対向ですれ違う箇所は 1500mm 以上）。全行程で突出物による狭まりがないこと
      domain: architecture
      example: 廊下の設計は有効幅 900mm で受け入れ確認し、消防配管の下端は算入しない
      refs:
      - STD-GB-55019:2
    - name: 段差ゼロの入口
      description: 主入口は段差ゼロ、またはそれに相当するスロープ/昇降の代替を設ける。スロープの勾配は 1:12 以下とし手すりを設ける
      domain: architecture
      example: 入口の 15mm の高低差を斜めの移行で処理し、一段の段差にしない
      refs: []
    - name: 垂直移動の冗長化
      description: 階段のほかに必ずエレベーター/スロープの等価な代替を設ける。重要な設備はアクセシブルな階に配置する
      domain: architecture
      example: 公共サービスの窓口をエレベーターで到達できる階に設け、1 階だけにしない
      refs: []
    - name: 遠隔での等価代替
      description: 実空間に到達できない場合、遠隔の等価なサービス経路を提供する（オンライン手続き/配送/訪問）
      domain: service
      example: 役所の窓口に行けない？オンライン手続き + 訪問サービスの二つのチャネル
      refs: []
    anti_patterns:
    - name: 車椅子専用という思い込み
      description: アクセシビリティを車椅子利用者だけに奉仕する付加設備とみなす
      consequence: ベビーカー、荷物の引きずり、配送、一時的な脚の損傷——車椅子のスロープはすべての車輪のある人に仕える。併設の車椅子スロープはゆっくり歩く人まで排除する
    - name: 基準達成が終点
      description: 規範の最低値で作った後は最適化しない
      consequence: 有効幅 810mm の扉、勾配 1:12 のギリギリのスロープ——規格は満たすが体験が際限まで追い詰められ、車椅子利用者は『合法的に』快適さの外へ排除される
    - name: アクセシビリティの後付け
      description: 建築の完成後にアクセシビリティ設備を追設する
      consequence: 後付けの費用は 10 倍で効果もない（構造上の制約）。到達性はレイアウトの問題であり、装修の問題ではない
  G-WHERE-F-004:
    name: リソース耐性設計ガイド
    patterns:
    - name: 中核機能のオフライン化
      description: 中核機能は継続的な資源供給に依存しない：オフラインで使え、電源断でも保存し、ネット断でも停止せず降格動作する
      domain: digital
      example: 編集系アプリはネット断後もローカルで使い続けられ、回復後に同期する
      refs: []
    - name: 必要リソースの明示
      description: 製品/サービスに必要な資源（電気/ネット/水/消耗品）を取得前に明示し、隠れた資源のしきい値を避ける
      domain: universal
      example: ダウンロードページに『XX GB のストレージ + 常時ネット接続が必要』と明記
      refs: []
    - name: 代替手段の並行提供
      description: 資源が乏しい場面には代替経路を用意する：充電の代わりに乾電池、電子の代わりに紙、自動の代わりに手動
      domain: industrial
      example: スマートロックは電池切れでも機械式鍵で開けられる
      refs: []
    - name: リソース消費の最適化
      description: 省電力/省データ/省消耗品モードを内蔵し、デフォルトの段階をそのままエコノミー段階とする
      domain: digital
      example: デフォルトでデータ節約をオン、高消費は任意
      refs: []
    anti_patterns:
    - name: リソース前提の連鎖
      description: デフォルトで電気、ネット、消耗品が常に潤沢とする
      consequence: 停電/料金未納/消耗品が手に入らないとき製品全体が機能停止する——最も脆弱な瞬間恰恰が最も必要な瞬間である（例：インスリンポンプの電源断）
    - name: 単一リソース依存
      description: 取得経路がひとつしかない（充電のみ、ネット接続のみ）
      consequence: その経路が切断されれば機能がゼロになる——冗長性は韌性の最小単位である
    - name: 縮退で消失
      description: 資源が不足すると機能が降格ではなく全体的に使えなくなる
      consequence: ユーザーは資源が圧迫される時期に完全に孤立する——段階的な降格（低画質でも使える）は、全か無かよりよい
  G-WHERE-F-005:
    name: 経済的可達性設計ガイド
    patterns:
    - name: 総所有コストの透明化
      description: 購入価格のほかに使用コストを明示する（消耗品/通信量/保守/アップグレード）。ユーザーが総コストで判断できるようにする
      domain: universal
      example: 製品ページに『年間の消耗品コストは約 XX 元』と明記
      refs: []
    - name: 無料の中核層
      description: 中核機能に課金の壁を設けない。課金は付加価値層に対応させる（比較の階層データ源：World Bank の所得分類による階層価格）
      domain: digital
      example: 学習系アプリは基礎講座が永久無料、上級内容は購読制
      refs: []
    - name: 低スペック端末対応
      description: 対象市場の主流ローエンド機種と旧 OS バージョンをサポートする。軽量版と完全版を並行させる
      domain: digital
      example: Go 版のアプリが 2GB メモリの端末で滑らかに動作する
      refs: []
    - name: 修理しやすい設計
      description: 分解修理が可能（接着剤ではなくネジ）、補修部品を長期供給、第三者の修理でも保証を無効にしない
      domain: industrial
      example: 電池は交換可能 + 公式の修理マニュアルを公開
      refs: []
    anti_patterns:
    - name: 一度きりの価格近視
      description: 購入価格だけを最適化し、使用期間のコストを無視する
      consequence: 『買えても使いきれない』：安価なプリンターと高くつくインクのモデルが低所得ユーザーを継続的な支払いの罠に閉じ込める
    - name: 安価＝使いにくいの誤り
      description: 低所得市場では機能を切り捨て品質を下げる
      consequence: 『安価だが使いにくい』は経済的可及性ではなく二次的排除である。低所得ユーザーにも良い設計に値する（SAST が裏付ける）
    - name: インフレに脆い価格設定
      description: 価格設定とコスト構造が経済変動を考慮していない
      consequence: インフレ期にはユーザー流失が急増する。階層価格と地域価格は変動に対する緩衝帯である
  G-WHERE-F-006:
    name: 緊急時対応設計ガイド
    patterns:
    - name: ワンアクションでの助け要請
      description: 緊急通報機能は 1 ステップ以内で到達でき常に使える（ロック画面/低電量/あらゆる画面状態）
      domain: digital
      example: ロック画面でサイドキーを長押しすると直接 SOS、ロック解除は不要
      refs: []
    - name: 複数チャネルでの発報
      description: 緊急発動は少なくとも二つのチャネル（ボタン + 音声/自動検知）とし、いずれかが不調でも経路が残るようにする
      domain: universal
      example: 転倒検知の自動通報 + 物理ボタンの二チャネル
      refs: []
    - name: フールプルーフ優先（誤作動防止偏重ではない）
      description: 緊急フローでは多層の確認を行わない（慌ただしい中では完了できない）。ただし誤操作の取り消しに短いウィンドウを設ける
      domain: universal
      example: SOS 発動後、3 秒のカウントダウン内なら取り消せる
      refs: []
    - name: 状態確認のフィードバック
      description: 助けを求めた後は明確にフィードバックする：誰に連絡したか、位置共有が成功したか、応答の見込み——慌ただしい中の情報の空白を埋める
      domain: digital
      example: 『緊急連絡先へ発信しました。位置情報を共有済みです。応答を待っています』
      refs: []
    anti_patterns:
    - name: 確認地獄
      description: 誤操作を防ぐために緊急フローに多層の確認を設ける
      consequence: 真の緊急事態では各層の確認が生存の障害になる——誤操作の代償は恥だが、確認の代償は命である
    - name: 緊急機能の深層格納
      description: SOS が多層メニューの奥に隠れている
      consequence: 緊急時には誰も経路を覚えていない——緊急機能の可用性基準は日常機能とは完全に異なる：反射的に到達可能でなければならない
    - name: 一方通行の発信
      description: 助けを求めた後に何の状態フィードバックもない
      consequence: ユーザーは助けが成功したか分からず、同じ操作を繰り返すか諦める——フィードバックの欠如が慌乱を恐慌へ拡大させる
  G-WHERE-F-007:
    name: 利用状況適応ガイド
    patterns:
    - name: 片手操作エリアの設計
      description: 移動場面の中核操作は親指が届く領域（画面の下 1/3）に集める。両手操作は任意の拡張にのみ用いる
      domain: digital
      example: 下部の操作バー + 親指のホットゾーンに主ボタンを置く
      refs: []
    - name: 注意散漫シーンでの負荷低減
      description: 運転/調理など注意が逸れる場面では自動的に低操作モードに切り替える：大きなボタン、音声優先、最小ステップ
      domain: digital
      example: 車載モード：超大型のタッチターゲット + 音声のみの代替経路
      refs: []
    - name: 姿勢変化への連続対応
      description: 設計は座る/立つ/歩く/横たわる姿勢の変化を覆う（WHO-F-007 で検証済みの直感外部化原則——状況への共感）
      domain: universal
      example: 読書アプリは横向き/縦向き + 寝た姿勢でのページめくりジェスチャー
      refs: []
    - name: 移動中の安定操作対応
      description: 不安定な状況（歩行中/車中）ではタッチターゲットを大きくし、微細操作を減らし、誤操作耐性を高める
      domain: digital
      example: 歩行検出時は精細編集モードを自動で一時停止する
      refs: []
    anti_patterns:
    - name: 集中した座位の前提
      description: 静かに座って全集中しているデスク場面だけを想定して設計する
      consequence: 通勤片手、立ち乗り揺れ、抱っこ紐はすべて主要場面だ——専念して座っているのはむしろ少数の情況である
    - name: 静的状況の固定化
      description: 状況を動的な移り変わりではなく静的とみなす
      consequence: 座るから歩く、屋内から強い光へ——移行点が体験の断裂点である。適応は連続的でなければならない
    - name: 認知資源の使い切り
      description: マルチタスクの場面でも全注意を要求する
      consequence: 運転中に精細操作を要求する＝事故を製造する。注意力は稀少資源で、設計は借金を返すためのものであり税を取るためのものではない
  G-WHERE-F-008:
    name: 共有状況プライバシーガイド
    patterns:
    - name: マルチユーザープロファイルの分離
      description: 共有端末はマルチユーザープロファイルと素早い切替に対応する（指紋/顔認証で 1 ステップ以内）。個人の内容とレコメンドが互いに混ざらないこと
      domain: digital
      example: 家庭のタブレット：指紋認証でそれぞれのホーム画面へ直行する
      refs: []
    - name: ゲストモード
      description: ワンタッチで痕跡を残さないモードに入る：履歴を保存せず、レコメンドを汚さず、終了時に消去する
      domain: digital
      example: 他人の PC を借りる → ゲストウィンドウ、閉じれば痕跡なし
      refs: []
    - name: 公開範囲の段階化
      description: 同一製品内で対象者に応じて可視性を段階化する：仕事の資料は同僚のみ、家族写真は家族のみ——プライバシーは全か無かではない
      domain: universal
      example: アルバムは人物の関係で可視性を分ける
      refs: []
    - name: 環境認識型プライバシー
      description: 公共の場面（公共 Wi-Fi/ビーコン）を検出したら自動的に引き締める：覗き見防止の注意、通知の機微内容の非表示
      domain: digital
      example: 公共 Wi-Fi 接続時は通知に『新しいメッセージが 1 件あります』とだけ表示する
      refs: []
    anti_patterns:
    - name: 単一アカウント前提
      description: デフォルトは一人一機器一アカウント
      consequence: 家庭の共有端末では推薦がごちゃまになりプライバシーが覗かれる。共有端末は世界各地で普遍的現実である（家庭/ネットカフェ/図書館）
    - name: 痕跡即露見
      description: 共有場面でクリア/痕跡なしの経路を提供しない
      consequence: ユーザーは借用を詫びるか、使用を拒否する——社会的摩擦が製品を負担に変える
    - name: のぞき見対策なし
      description: 公共の場面でも機微情報をそのまま全表示する
      consequence: 通知の内容、メッセージのプレビューが公共空間で傍観者に丸見え——プライバシー漏洩は能動的な攻撃ではなく受動的な傍観であることが多い
  G-WHERE-F-009:
    name: 支援を受ける利用状況ガイド
    patterns:
    - name: 段階的な代理権限
      description: 代理権は必要最小限で段階化する（閲覧のみ/支援/完全代行/緊急引き継ぎ）。ユーザーはいつでも撤回できる——支援は主権の明け渡しではない
      domain: digital
      example: 子が親の資産管理を支援：『閲覧』権限のみ、資金移動は本人の確認が必要
      refs: []
    - name: 二画面の状態同期
      description: 主ユーザー用 UI と支援者用 UI を並行して存在させ状態を同期する。支援者ダッシュボードは主アカウントから独立させる
      domain: digital
      example: 薬ケースアプリ：高齢者側には大きな文字でリマインド、家族側では服薬したかが見える——パスワードの共有は不要
      refs: []
    - name: プライバシー境界の設定可能化
      description: 支援者の可視範囲は主ユーザーが設定する：タスクの進捗のみ / 完全な内容 / 異常警告のみ
      domain: digital
      example: 糖尿病管理：血糖値は共有するが、チャットの記録は共有しない
      refs: []
    - name: 物理的な支援への適応
      description: 実体製品の補助的な操作経路：微細な留め具をマグネット/面ファスナーで置き換え、大きな開口部の設計、付き添い空間の確保
      domain: fashion
      example: 術後の病衣は側開きのマグネット設計で、患者が自分で着るのも看護師が介助するのも容易
      refs: []
    anti_patterns:
    - name: パスワード共有を代理と誤解
      description: 支援者と被支援者がひとつのアカウントのパスワードを共用する
      consequence: ゼロ権限境界：全プライバシー暴露 + 操作の責任境界不明。代理はシステム機能であってパスワード共有ではない
    - name: 主導権の剥奪
      description: デフォルトで支援者が全権を引き継ぐ
      consequence: 被支援者の自主権と尊厳が剥奪される——支援の目標は能力の拡張であり、意思決定の代替ではない（ICF e3 支援的環境の意味論）
    - name: 付き添いスペースの不在
      description: 設備の設計でユーザー本人だけを考え支援者を考えない
      consequence: 車椅子利用者が来ても同伴家族の場所がない。付き添い席は被支援状況の基礎インフラである
  G-WHICH-F-001:
    name: 情報密度の階層化ガイド
    patterns:
    - name: 密度三段階の切替
      description: 簡潔/標準/詳細の三つの密度（または密度スライダー）を提供し、切替は即時反映され好みを記憶する
      domain: digital
      example: データ表はデフォルト 10 行/画面、コンパクトで 25 行/画面に切り替え可能
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: 段階的開示の構造
      description: 情報を階層化する：概要は常時表示 → 詳細は必要に応じて展開する（折りたたみ/ホバー/ドリルダウン）。1 画面を詰め込まない
      domain: universal
      example: 商品ページ：最初の画面に中核のパラメータ、詳細パラメータは折りたたみ
      refs: []
    - name: カスタムダッシュボード
      description: ユーザーがパネルの内容とレイアウトを制御できる（カードの追加削除/並べ替え）。デフォルト配置は中庸な密度とする
      domain: digital
      example: ワークベンチの最初の画面のカードは追加削除・ドラッグ並べ替えができる
      refs:
      - STD-ISO-9241-110:5.5.4
    anti_patterns:
    - name: デザイナーの好みの押し付け
      description: チームの美意識で唯一の密度を固定する
      consequence: 低密度を好む人は騒がしすぎると感じ、高密度を好む人は遅すぎると感じる——密度は正誤ではなく好みである。答えではなく選択肢を与える
    - name: 折りたたみ迷路
      description: 重要情報まで折りたたんで隠す
      consequence: 『深く隠したものは存在しないのと同じ』——折りたたみは低頻度の詳細にのみ用い、核心経路の情報は直接到達できるようにする
  G-WHICH-F-002:
    name: 探索深度の階層化ガイド
    patterns:
    - name: 二速度経路
      description: 同一の目的に快速経路（直行/デフォルト値）と深度経路（全オプション/詳細設定）を並行して用意し、互いに強制しない
      domain: digital
      example: 『クイック開始』と『カスタムインストール』の二つの入口
      refs:
      - STD-ISO-9241-110:5.4.3
    - name: ブラウズと検索の両立
      description: 深く探索する人は階層のブラウズで、素早い人は検索で直行する——二つの思考様式の双方に応える
      domain: universal
      example: ナレッジベース：目次ツリー + 全文検索の二チャネル
      refs: []
    - name: パンくずによる遡及
      description: 多層の探索はいつでも戻る/跳ぶことができる（パンくず/履歴）。探索で迷子にならない
      domain: digital
      example: カテゴリページ上部のパンくずで任意の階層へ戻れる
      refs: []
    anti_patterns:
    - name: 深層の一方通行扉
      description: 深層に入ると戻りにくい
      consequence: 探検が冒険になる。ユーザーは『開かない』ことを学び、情報アーキテクチャへの深い投資がすべて無駄になる
    - name: 初心者を専門家扱い
      description: 深くも浅くもない中間の経路がひとつしかない
      consequence: 速い人は引き伸ばされ、深い人は足りなくなる——二つの速度を並走させるのは折衷案より安い
  G-WHICH-F-003:
    name: コントロール感設計ガイド
    patterns:
    - name: 自動化レベルの調整可能化
      description: 自動化のレベルをユーザーが選べる（全自動/半自動/手動）。いつでも段階を下げて引き継げる
      domain: universal
      example: エアコン：自動モード + 手動での温度/風量の細かな調整
      refs:
      - STD-ISO-9241-110:5.5
    - name: 上書きと取り消しの二権
      description: システムの決定は上書きでき撤回できる——『最終的に決めるのは常に人である』
      domain: digital
      example: メールの自動分類はワンタッチで取り消し、ルールを再設定できる
      refs: []
    - name: 状態の透明性
      description: システムが今何をしているか、なぜそうするか、次にどうなるか——透明性は制御感の前提である
      domain: universal
      example: 『明るさを自動調整しました（強い光を検出）——ここをクリックで取り消し』
      refs: []
    - name: ヘルプの一貫性
      description: ヘルプの入口は位置を固定し構造を統一し、いつでも呼び出せて主フローを中断させない
      domain: digital
      example: 右上に常設のヘルプアイコン + インラインのヒントの二本立て
      refs:
      - STD-W3C-WCAG22:3.2.6
    anti_patterns:
    - name: ブラックボックス自動化
      description: システムが決定したのに知らせず説明もしない
      consequence: ユーザーは制御できないそして尊重されていないと感じる——ブラックボックスは信頼のブラックホールである（Parasuraman 2000 の十段階モデルにおける透明性の要素に対応）
    - name: 自動化による人質化
      description: 手動で引き継ぐ経路を提供しない
      consequence: 自動化が失敗したときユーザーは手も足も出ない。『君のためだ』という強制が最悪の強制である
  G-WHICH-F-004:
    name: 社会的可視性の制御ガイド
    patterns:
    - name: 項目ごとの独立制御
      description: 可視性設定は情報の種類ごとに独立させる（投稿/オンライン状態/アクティビティ/友達リスト）。全か無かにしない
      domain: digital
      example: オンライン状態は友人のみに、投稿は公開に——二つの錠を分ける
      refs: []
    - name: デフォルトで最も厳格なプライバシー
      description: デフォルトを最も厳しい可視性に設定する。公開は能動的な選択でありデフォルトの状態ではない
      domain: digital
      example: 新規アカウントはデフォルトで自分のみ表示、投稿時には可視範囲を明示的に選ぶ
      refs:
      - STD-GDPR:25
    - name: 公開範囲の明示
      description: 公開/共有の時点で現在の可視範囲を明示する（『公開表示になります』）。後から気づかせない
      domain: digital
      example: 公開ボタンの横に宛先ラベルを常時表示し、クリックで変更できる
      refs: []
    - name: シーン別プリセット
      description: 場面のプリセットを提供する（家族のみ/同僚のみ/公開）+ カスタムの微調整——一括設定で負担を減らす
      domain: digital
      example: アルバムの共有：ワンタッチの『家族のみ表示』プリセット
      refs: []
    anti_patterns:
    - name: 公開デフォルトの罠
      description: 『活性度』を促すためにデフォルトで公開にする
      consequence: ユーザーは予期以上に広い層に知らないうちに露出される——プライバシー事故は信頼事故である。GDPR/PIPL の最小化はすでに法的要求である
    - name: 可視性の迷路
      description: プライバシー設定が多層メニューの奥に埋もれ入口が見つけにくい
      consequence: 『変えられない』は『変更できない』と同じである——到達できないコントロールは権利ではなく飾りである
  G-WHICH-F-005:
    name: スタイル選択ガイド
    patterns:
    - name: 公式テーマの複数提供
      description: 公式テーマを 2 つ以上提供する（少なくとも高コントラストと柔らかい配色を含む）。デフォルトテーマは個性の主張ではなく普遍的な読みやすさを取る
      domain: digital
      example: デフォルトの明色ニュートラル + 暗色 + 高コントラストの三テーマ
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: スタイル切替でも配置不変
      description: あらゆるスタイル/テーマの切替時も中核機能の位置は不変とする——変化はスキン層に限り、筋肉記憶の層は動かさない
      domain: digital
      example: ダークモードに切り替えてもナビ/ボタンの位置は微動だにしない
      refs: []
    - name: 重要なカスタマイズ点
      description: 影響の大きいカスタマイズ（文字サイズ/コントラスト/モーションのオンオフ）に集中し、果てのないカスタマイズ体系にはしない
      domain: digital
      example: 設定の三点セット：文字サイズ、コントラスト、モーション——それで十分
      refs: []
    anti_patterns:
    - name: デフォルトが態度
      description: デフォルトのスタイルが強く個性的（過激な配色/重いモーション）
      consequence: 美は好みの分布であり正規分布の中心ではない。強いデフォルトでは多くのユーザーが最初の一目で離れたくなる
    - name: テーマ替えで配置も変わる
      description: テーマ切替に伴い機能の位置が並べ替わる
      consequence: ユーザーはテーマ変更のたびに操作を学び直す——スタイルの自由は筋肉記憶を代価にしてはならない
  G-WHICH-F-006:
    name: 入力方式冗長化ガイド
    patterns:
    - name: 全機能のキーボード到達
      description: すべての機能をキーボードで完了できる（Tab 順が妥当 + ショートカット）。マウス/タッチは唯一の経路ではない
      domain: digital
      example: すべての操作にショートカット + 可視のフォーカス枠
      refs:
      - STD-W3C-WCAG22:2.1.1
    - name: 非ポインタによる代替
      description: ドラッグ/ホバーなどのポインタ操作には非ポインタの等価（ボタン/メニュー）を用意する。複雑なジェスチャーには単純な代替を用意する
      domain: digital
      example: ドラッグ並べ替え → 上下移動ボタンを併存させる
      refs:
      - STD-W3C-WCAG22:2.5.7
    - name: 入力優先度の自己設定
      description: デフォルトの入力方式をユーザーが選べる（例：音声優先/キーボード優先）。機器を変えても好みが追随する
      domain: digital
      example: 外付けキーボードを接続すると自動でショートカットのヒントを復帰させる
      refs: []
    - name: 状況に応じた入力推薦
      description: 使用状況を検出して入力方式を推薦する（移動中→音声、騒がしい→キーボード）。推薦は強制しない
      domain: digital
      example: 歩行状態を検出すると『音声入力を試してみては』と知らせる
      refs: []
    anti_patterns:
    - name: マウス唯一の経路
      description: 機能がマウス/タッチでしか完結できない
      consequence: 運動障害、スクリーンリーダー、効率志向のユーザーが同時に排除される——キーボード到達はデジタル包摂の基礎である（WCAG 2.1.1 A 級）
    - name: ジェスチャーの暴政
      description: ボタンの代わりに独自の複雑なジェスチャーを使う
      consequence: 発見可能性がゼロに近づく。誰も隠されたジェスチャーを覚えていない。ジェスチャーは加速器であって渡る板ではない
  G-WHICH-F-007:
    name: フィードバックチャネル制御ガイド
    patterns:
    - name: チャネルごとの独立調整
      description: 視覚/音/触覚のフィードバック強度を独立に調整またはオフにできる。ユーザーの感覚の境界はユーザーが決める
      domain: universal
      example: 通知音量、振動強度、アニメーションのオンオフを三つ独立させる
      refs: []
    - name: 高リスク時の多チャネル
      description: 危険/緊急状態ではデフォルトでマルチチャネルの強いフィードバック（音+光+振動）を行うが、能力に応じたカスタマイズを許し、強制オフにはしない
      domain: industrial
      example: 機器の過熱：赤ランプ + ブザー + パネル警告を三チャネルで同時に行う
      refs: []
    - name: ステータスメッセージの通知
      description: 操作結果のフィードバックはプログラムから取得可能な状態メッセージで提示する（aria-live など）。スクリーンリーダーが同時に知得できるようにする
      domain: digital
      example: 保存成功のトーストに aria-live=polite を付ける
      refs:
      - STD-W3C-WCAG22:4.1.3
    - name: おやすみモードでも緊急は通す
      description: サイレント/おやすみモードでも緊急のフィードバックはホワイトリストで貫通させる。ホワイトリストはユーザーが承認する
      domain: digital
      example: おやすみモード中でも安全警報は振動+バナーで通知する
      refs: []
    anti_patterns:
    - name: フィードバックの人質化
      description: 『あなたに確実に見せるため』としてオフにする選択肢を与えない
      consequence: 強制的なフィードバックは感覚的な嫌がらせである。ユーザーはノイズを避けるために製品全体の通知を直接消す
    - name: 単一チャネルの独裁
      description: すべてのフィードバックがひとつのモダリティしかない
      consequence: そのチャネルが弱いユーザーのフィードバックは全盲状態になる——多チャネル冗長性は情報到達の基本的な保険である
  G-WHICH-F-008:
    name: インタラクションモード併存ガイド
    patterns:
    - name: 中核タスクの二モード
      description: 中核タスクは 2 つ以上の操作モードで使える（タッチ+キーボード/音声）。『唯一正しい』使い方を設けない
      domain: digital
      example: リスト操作：タッチ長押し と 右クリックメニュー と ショートカットの三通り
      refs:
      - STD-ISO-9241-110:5.5.4
    - name: 既定モードの自己選択
      description: デフォルトの操作モードをユーザーが設定できる（タッチ優先/キーボードとマウス優先/音声優先）。機器の能力がユーザーの好みを決めない
      domain: digital
      example: タブレットのユーザーも外付けキーボードで全キーボード操作ができる
      refs: []
    - name: 切替コストゼロ
      description: モード切替は 1 ステップ以内で状態を失わない。切替の入口は一定とする
      domain: digital
      example: 音声とタッチをいつでも切り替えられ、会話の文脈は保持される
      refs: []
    anti_patterns:
    - name: デバイス即運命
      description: タッチ端末ではタッチ操作しか作らない
      consequence: 外付け機器を使うユーザー、アクセシビリティを必要とするユーザー、嗜好を持つユーザーが機器の形態に縛られる。機器は能力であって性格ではない
    - name: モードの相互排他的廃止
      description: 新版で旧来の操作パターンを『体験の簡素化』として切り捨てる
      consequence: 古いユーザーの筋肉記憶が一夜で無駄になる——モードの淘汰はユーザーの学習より遅くなければならない
  G-WHICH-F-009:
    name: 通知ガバナンスガイド
    patterns:
    - name: 細粒度の段階化
      description: 通知は種類+送信者+緊急度の三次元で独立に制御する。『すべてオフ』と『すべて受信』の間に中間の領域がある
      domain: digital
      example: プロモはオフ、ダイレクトメッセージはオン、安全警報は強通知——三つの段階を併存させる
      refs:
      - STD-W3C-WCAG22:2.2.3
    - name: デフォルトで保守的
      description: デフォルトでは重要な通知だけを届ける。それ以上の通知はユーザーが能動的に有効にした結果である
      domain: digital
      example: インストール後、最初のプッシュの前に『どれを受け取りますか？』と問い、デフォルトは全オフ
      refs: []
    - name: 時間帯とスロットリング
      description: 通知はユーザーの時間枠（生活リズム/サイレント）と頻度の抑制（同種をまとめて画面を埋めない）を守る
      domain: digital
      example: 未読の同種通知をまとめる：12 回鳴らすのではなく『新しいやり取りが 12 件あります』
      refs: []
    - name: 割り込みには調整手段を
      description: 強い妨害（着信音/全画面）はユーザーが印を付けた高優先度に限る。強い妨害のたびに手早く調整できる入口を用意する
      domain: digital
      example: 強通知のバナーの隅に『この種の通知を減らす』を常設する
      refs: []
    anti_patterns:
    - name: 通知の軍拡競争
      description: リテンションのために通知をデフォルトで全開にする
      consequence: 通知疲労→一括オフ→製品と失聯。ユーザーが切るのはある通知ではなく製品全体である
    - name: 誘導的購読
      description: マーケティング通知をあらかじめチェック済みにし、『購読しない』を 10 ステップの迷路にする
      consequence: GDPR/PIPL は事前チェック済みの同意を明確に禁止する——誘導的な購読はコンプライアンスリスクとダークモードの二重の罪
  G-WHO-F-001:
    name: 身体能力包摂ガイド
    patterns:
    - name: 多感覚チャネルでの冗長提示
      description: 重要情報は同時に 2 つ以上の感覚チャネルで伝える（視覚+聴覚/触覚）。いずれか単一チャネルの能力が低下しても情報に到達できるようにする
      domain: universal
      example: エレベーター到着：階の表示 + 報知音 + 振動
      refs:
      - STD-W3C-WCAG22:1.4.3
    - name: 調整可能な操作パラメータ
      description: 物理的な操作パラメータ（力/寸法/高さ）は少なくとも P5–P95 の集団区間を覆う。重要な操作には省力の代替を用意する
      domain: industrial
      example: 取っ手の操作力は扉金物の標準値以下。高さ調整可能な作業台
      refs:
      - STD-GB-T-10000
    - name: タッチターゲットの拡大
      description: タッチターゲットは 44×44 CSS ピクセル以上（WCAG 2.5.8 のターゲットサイズ下限）。間隔を十分に取り誤操作を防ぐ
      domain: digital
      example: モバイルの主操作ボタンは 48dp、間隔は 8dp 以上
      refs:
      - STD-W3C-WCAG22:2.5.8
    - name: 能力スペクトラムの全網羅
      description: 『障害者 vs 健常者』の二分法ではなく、能力スペクトラム（一時的/状況的な制約を含む：赤ちゃんを抱える、強い光、骨折）に沿って同一の解を設計する
      domain: universal
      example: 音声入力は視覚障害者のチャネルでもあり、両手がふさがる場面のチャネルでもある
      refs: []
    anti_patterns:
    - name: 平均ユーザーの誤謬
      description: 統計的な平均人体寸法で固定パラメータを設計する
      consequence: P5/P95 の両端の集団が直接排除される——平均人は存在せず、統計上の幻にすぎない
    - name: 障害のドラマ化
      description: 極端な障害（全盲/麻痺）だけを考慮し、より大きな集団である軽中度の能力差を無視する
      consequence: 1% の極端なケースを覆ったが、30% の軽中度制約ユーザーを排除した
    - name: 視覚のみのフィードバック
      description: すべての状態フィードバックを視覚だけで伝える（色/図形）
      consequence: 低視力、色覚障害、強い光/まぶしい光の状況のユーザーは重要な状態の変化を察知できない
      domain: digital
  G-WHO-F-002:
    name: 人口統計包摂ガイド
    patterns:
    - name: ペルソナの細分化
      description: 単一の『想定ユーザー』の仮定ではなく多次元の交差した像（年齢×地域×ライフサイクル段階）を用いる。設計が覆う集団の境界を明示する
      domain: universal
      example: シニア向け UI は性別ではなく能力で定義する。子どもモードは認知発達の段階で分ける
      refs: []
    - name: ステレオタイプの排除
      description: 設計レビューに『ステレオタイプ検査』の工程を設ける：あらゆる集団の仮定はデータまたはユーザー研究に支えられている必要があり、支えのない仮定（例：『高齢者は技術がわからない』）は強制的に除く
      domain: universal
      example: 65 歳以上のインターネット利用率データで直感の仮定を置き換える
      refs: []
    - name: 地域発展差への適応
      description: グローバル製品の機能群は地域のインフラに応じて段階化する（ネットワーク/決済/端末水準）。一律の体験ベースラインを仮定しない
      domain: digital
      example: 軽量版アプリは中核機能を保ちローエンド端末に適合させる
      refs: []
    anti_patterns:
    - name: 均質な全体の前提
      description: 対象ユーザー群を内部差のない一枚岩として扱う
      consequence: 内部差異が最も大きい部分集団（初心者/周縁ユーザー）の体験が最も悪化し、まさに包摂が最も必要な集団がそうなる
    - name: 新興層の盲点
      description: 過去のユーザーデータで将来のユーザーを外挿する
      consequence: デジタルノマドや Z 世代といった新たな集団の行動パターンは、既存のプロファイルと系統的に噛み合わない
  G-WHO-F-003:
    name: 健康状態包摂ガイド
    patterns:
    - name: 変動性を考慮した設計
      description: 健康状態は変動スペクトラムとして扱う（慢性疾患の安定期/発作期、疼痛日、疲労日）。中核機能は低エネルギー状態でも使えること
      domain: universal
      example: 疼痛日の画面には『今日は少なめに』モードを用意し、必須のタスクだけを残す
      refs: []
    - name: 安全に敏感なコンテンツの防護
      description: 点滅/高頻度の視覚コンテンツを安全なしきい値内に抑える（てんかん対策）。医療のリマインダーは警告音と混同させない
      domain: digital
      example: モーションは prefers-reduced-motion に従い、毎秒 3 回超の点滅はない
      refs:
      - STD-W3C-WCAG22:2.3.1
    - name: 低操作力の代替経路
      description: 物理操作には低力の代替経路を用意する（回す代わりに押し開ける、ボタンの代わりに音声）。操作力の要求は明示する
      domain: industrial
      example: 滑り止めの低抵抗の取っ手 + 音声制御の二経路
      refs: []
    anti_patterns:
    - name: 健康二分法
      description: 健康状態を『健常/障害』の二態に単純化する
      consequence: 変動する健康問題（慢性疲労、眩暈の発作）のあるユーザーは、『重度でなければ障害と数えられない』灰色の帯で完全に見放される
    - name: 併存疾患の盲点
      description: 単一の疾患に合わせて最適化し、多疾患併存の現実の複雑さを無視する
      consequence: 単一の疾患のために綿密に設計した案も併存疾患の組み合わせでは使えない（例：視覚と手関節の同時制限）
  G-WHO-F-004:
    name: マルチモーダル学習ガイド
    patterns:
    - name: コンテンツ二モダリティの最低ライン
      description: 重要操作の案内は少なくとも 2 つのモダリティで提示する（図解+動画/対話的演習）。『学習スタイル』で個人に合わせるのではなく（証拠により否定済み）、マルチモーダルで網羅する
      domain: universal
      example: 初心者ガイド：図解の手順 + スキップ可能な動画 + 対話的演習の三択
      refs: []
    - name: ペースの自己制御
      description: 学習内容は繰り返し/早送り/スロー再生/スキップに対応し、線形の進捗を強制しない
      domain: digital
      example: チュートリアル動画の倍速再生 + 章へのジャンプ
      refs: []
    - name: 必要に応じた学習順序の選択
      description: 導入フローはデモ→操作、または操作→ヒントの二経路を許容し、順序を一律に強制しない
      domain: digital
      example: 導入の最初の画面に『すぐ始める』と『先にデモを見る』の二つの入口を用意する
      refs: []
    anti_patterns:
    - name: 学習スタイル適合の罠
      description: VARK などの学習スタイル分類に従って個人向けにコンテンツのモダリティをカスタマイズする
      consequence: Pashler et al. 2008 の証拠レビューはマッチング仮定に実証的裏付けがないことを示す——リソースを投げて学習効果がない上、『自分は視覚型』という偽のニーズ札をユーザーに貼ってしまう
    - name: 単一モダリティの強制
      description: すべての教学内容がひとつのモダリティのみ（例：動画チュートリアルのみ）
      consequence: 聴覚障害/読むのが困難な/帯域が制限されたなどのユーザーが排除される。マルチモーダルは最も安価な全包括の解法である
  G-WHO-F-005:
    name: 感情体験設計ガイド
    patterns:
    - name: 挫折ポイントの一掃
      description: 重要フローは感情の接点を一つずつ点検し、挫折を招く箇所（フィードバックのない行き止まり、屈辱的なエラー表示）は P0 として修正する
      domain: universal
      example: エラー表示を『ここには X 形式の日付が必要です』+ ワンタッチ修復ボタンに変え、『入力が無効です！』を置き換える
      refs: []
    - name: 自律性支援の三点セット
      description: 自己決定理論に沿って提供する：選択権（選べる経路）、有能感のフィードバック（知覚できる進捗）、意味の接続（なぜこう操作するのかの説明）
      domain: universal
      example: 設定項目に『なぜこれを尋ねるのか』という用途の説明を一言添える
      refs: []
    - name: ポジティブ強化の設計
      description: 重要な接点には肯定的な感情フィードバックを設計する（完了の祝福、進捗の可視化）。強度は場面に合わせる——医療救急の画面では歓声のアニメーションではなく静かな確認を用いる
      domain: digital
      example: 健康目標の達成：静的なチェックマーク + 短い文言、紙吹雪のアニメーションは使わない
      refs: []
    - name: ピーク・エンドの最適化
      description: フローのピーク時と終了時を識別し、この二箇所に優先して感情設計の資源を投入する
      domain: service
      example: チェックアウトの流れ：終了ページで明示的にお礼を述べ + 次回宿泊へのショートカット
      refs: []
    anti_patterns:
    - name: 機能主義の盲点
      description: 機能の可用性だけを最適化し、感情体験を『あれば尚良い』とみなす
      consequence: 機能は使えるが不安や屈辱を感じる製品（例：エラー時にユーザーが愚かであると仄めす）はユーザーが自主的に避け、可用性への投資が無駄になる
    - name: 楽しさ＝娯楽化の誤り
      description: 肯定的な体験をゲーミフィケーションの要素（ポイント/バッジ/紙吹雪）と同一視する
      consequence: 真剣な場面（医療、金融、行政）における娯楽的要素は信頼感を損なう。感情設計とは場面に応じた適度な肯定的な体験である
    - name: 報酬と罰への依存
      description: 外部報酬で行動を駆動し、内発的動機の育成を無視する
      consequence: 報酬の撤去後に利用行動が崩壊する。SDT の研究は外部報酬が内発的動機を侵食すると示す
  G-WHO-F-006:
    name: 感覚嗜好適応ガイド
    patterns:
    - name: 全チャネル強度の調整可能化
      description: 各感覚チャネル（明るさ/音量/振動/動效）の強度は独立して調整可能とし、デフォルトは中庸の段階とする。『標準ユーザー』の好みを仮定しない
      domain: universal
      example: 設定パネル：明るさスライダー + 音量 + 振動 + モーションのオンオフの四項目を独立させる
      refs: []
    - name: 低刺激モード
      description: ワンタッチの低刺激モードを提供する（暗色+消音+モーション低減+低彩度）。HSP（高感受性の人）や感覚過負荷の場面（片頭痛/自閉スペクトラム）が恩恵を受ける
      domain: digital
      example: prefers-reduced-motion と prefers-contrast の環境設定にすべて応答する
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: 好みの状況別記憶
      description: 感覚設定は状況ごとに複数保存できる（日中の執務/夜間の読書/運転モード）。切替は 1 ステップ以内
      domain: digital
      example: ワンタッチで『ナイトモード』の設定グループに切り替える
      refs: []
    anti_patterns:
    - name: 中性設計の神話
      description: すべての人に適合する『中立な』感覚設計が存在すると仮定する
      consequence: 刺激に敏感な集団は過負荷で（使用をやめ）、刺激を必要とする集団は退屈で（情報を無視する）——両極が同時に排除される
    - name: 静的嗜好の前提
      description: 感覚の好みを固定した個人属性とみなし、状況/疲労/健康による変動を無視する
      consequence: 夜の強い白光の画面、疲労時の高频なモーション——ユーザーが最も脆弱な瞬間恰恰が最も強い刺激の瞬間である
  G-WHO-F-007:
    name: 技術リテラシー階層化ガイド
    patterns:
    - name: 漸進的開示
      description: 機能は使用頻度と複雑さに応じて段階的に露出する：中核操作は最初の画面で見え、高度な機能は漸進的に発見させる。全能力を一度に積み上げない
      domain: digital
      example: カメラアプリ：デフォルトは自動モード、専門パラメータは『その他』の中で段階的に展開する
      refs: []
    - name: 直感の外部検証
      description: 『直感的』という判断は必ず対象ユーザーのテストで検証する。設計者の直感は受け入れ基準にしない
      domain: universal
      example: 初回使用の点検：技術的背景ゼロのユーザーが案内なしで中核タスクを完了できて初めて合格とする
      refs: []
    - name: 一貫したパターンの再利用
      description: 同種の操作は製品内で同一の操作パターンに従う。プラットフォームの慣習（長押しで削除など）を独自ジェスチャーより優先する
      domain: digital
      example: アプリ全体で『左スワイプで削除』を統一し、一部のページは左スワイプ、一部は長押しにはしない
      refs: []
    - name: 可逆操作の最低ライン
      description: 破壊的操作の前には必ず取り消し/確認を設ける。軽い操作はできる限り可逆にする（ソフト削除の 30 日ウィンドウ）
      domain: digital
      example: 削除 → 30 日のゴミ箱 + 上部の Snackbar で取り消し
      refs: []
    anti_patterns:
    - name: デザイナー直感の誤謬
      description: 『自分には直感的に思える』をユーザビリティ判断の根拠にする
      consequence: 設計者の熟練度≠対象ユーザーの直感。低識字ユーザーは高識字設計者の『直感的』な UI で系統的に迷子になる
    - name: マニュアル依存症
      description: 取扱説明書/研修で複雑な設計を補う
      consequence: 読み書きの低いユーザーは恰恰とマニュアルを参照しない。ISO 9241-110 は自記述性を明確に求め、UI 自身が使い方を伝えることを要求している
  G-WHO-F-008:
    name: 文化包摂ガイド
    patterns:
    - name: i18n のフルスタック対応
      description: 国際化は翻訳にとどまらない：日付/時刻/数字の書式、氏名の順序、書字方向（RTL）、改行規則のすべてを適応させる
      domain: digital
      example: アラビア語版はレイアウトを鏡像化（RTL）、日付書式は地域に従う
      refs: []
    - name: 文化記号の審査
      description: 色/アイコン/ジェスチャー/比喩は対象文化で一つずつ意味を審査する。自国の直感で他国の意味を推し量らない
      domain: universal
      example: 白は東アジアの婚礼の文脈と西洋の葬儀の文脈で意味が反対になる
      refs: []
    - name: 宗教・習俗への配慮枠
      description: 飲食に接する材料、図案、空間の向き（礼拝の方向）、祝祭の暦は対象文化に合わせた適応枠を確保する
      domain: architecture
      example: 多目的空間には移動可能な礼拝マットと方向の表示の枠を確保する
      refs: []
    anti_patterns:
    - name: グローバル化＝英語化
      description: 英語 UI を提供すれば国際化だと思い込む
      consequence: 非英語母語者は二重の認知負荷を負う。文化的隔たり（書式/禁忌/礼儀）がそのまま残る
    - name: 直訳の罠
      description: 機械翻訳の内容をローカライズの校閲を経ずにそのまま公開する
      consequence: 無礼または馬鹿げたコピーは信頼を壊す。比喩/冗談/慣用句の直訳による破綻は絶えず生じる
    - name: ステレオタイプ記号の流用
      description: 単純化したステレオタイプの文化的記号（トーテム/衣装）を装飾に使う
      consequence: 対象文化集団への冒犯となる。現地ユーザーに中途半端な擬似ローカライズとして見抜かれる
  G-WHO-F-009:
    name: ニューロダイバーシティ包摂ガイド
    patterns:
    - name: 感覚調整パネル
      description: 集中的な感覚調整の入口を提供する：モーションのオンオフ、明るさの上限、音の低減、UI 密度の低下——一箇所で有効にすれば全体に反映される
      domain: digital
      example: 『感覚刺激を減らす』の主スイッチでアニメーションを切り、コントラスト刺激を下げ、UI を簡素化する
      refs:
      - STD-W3C-WCAG22:2.4.4
    - name: 予測可能なインタラクション
      description: 突然の変化を排除する：予告なしのポップアップ、音声動画の自動再生、ページ遷移。変化の前に予告を出す
      domain: universal
      example: カウントダウン終了の 3 秒前に視覚的な予告を出してから遷移を実行する
      refs: []
    - name: ペースの完全な自己制御
      description: すべての時間制限コンテンツは一時停止/再生/スキップ可能。カウントダウンの圧力を設けない
      domain: universal
      example: チュートリアルとクイズはいずれも時間制限なし
      refs: []
    - name: 多チャネル情報の冗長化
      description: 重要情報はテキスト+アイコン+音声のマルチチャネルで冗長に提示し、どの処理経路が弱くても他の経路が使えるようにする
      domain: digital
      example: エラー表示：文字の説明 + アイコン + 読み上げ可能
      refs:
      - STD-W3C-WCAG22:3.3.7
    anti_patterns:
    - name: 突然の刺激
      description: 予告なしの音/点滅/ポップアップ/自動再生
      consequence: 自閉スペクトラムと感覚過敏のユーザーの感覚過負荷——直接製品を閉じる。全員にとって妨害源になる
    - name: カウントダウンの圧迫
      description: 時間制限のあるタスクで切迫感を演出する
      consequence: 処理速度の遅いユーザー（読むのが困難/不安）では圧力下で成績が落ちる——測っているのは能力ではなく不安である
    - name: 一画面マルチタスク
      description: 同一画面に複数の注意争奪領域を積み上げる（ポップアップ+スクロールバナー+点滅バッジ）
      consequence: 注意の配分が困難なユーザーは過負荷で離脱する。情報取得率は全面的に低下する
  G-WHO-F-010:
    name: 認知フレンドリー設計ガイド
    patterns:
    - name: 情報のチャンク化
      description: 長い内容を 3〜5 項目ずつの意味の塊に分け、塊の間に視覚的な区切りを設ける。1 画面に 1 つの主タスク
      domain: digital
      example: フォームはテーマでまとめて段階的に提示する（基本情報→好み→確認）。各ステップは 5 項目以内
      refs:
      - STD-W3C-WCAG22:3.1.5
    - name: 慣れたパターン優先
      description: 操作はユーザーが慣れ親しんだプラットフォームの慣習と一般的なパターンを踏襲する。革新的な操作には従来型の経路を並行して用意する
      domain: universal
      example: 新しいナビゲーションでも移行期としてハンバーガーメニューの入口を残す
      refs: []
    - name: エラーメッセージの三要素
      description: エラー表示には次を含める：何が起きたか（平易な言葉）+ なぜか + どう直すか。エラーコードのみや『操作に失敗しました』を禁じる
      domain: digital
      example: 『パスワードは 8 文字以上必要です。現在 6 文字——あと 2 文字足してから送信してください』
      refs:
      - STD-ISO-9241-110:5.6
    - name: 認知疲労の予算
      description: 長いフローは進捗と残りの手順を明示し、途中保存して終了できるようにする。高頻度の操作は 3 ステップ以内で直行できる
      domain: digital
      example: 多段フォーム：上部のステップバー + 自動の下書き保存
      refs: []
    anti_patterns:
    - name: 文字依存
      description: すべての説明を文字だけで伝える
      consequence: 読むのが困難で文化程度の低いユーザーが排除される。図形+演示は認知負担が最も低いチャネルである
    - name: 階層の迷路
      description: 機能が 3 階層より深いメニューの奥に埋もれている
      consequence: 作業記憶の限られたユーザーは深いナビゲーションで迷う——『今どこにいるか』を覚えること自体が認知税である
    - name: 認知税の累積
      description: マルチタスク並行の画面が複数の状態を同時に記憶することを要求する
      consequence: 圧力/疲労/マルチタスクの状況で全ユーザーの誤り率が上がる——認知余量は全員が消費している資源である
  G-WHO-F-011:
    name: 言語アクセシビリティガイド
    patterns:
    - name: 多言語インフラ
      description: UI の言語は切替可能で対象市場の言語を網羅する。スクリーンリーダーの音声切替を有効にするため lang 属性を正しく注記する
      domain: digital
      example: <html lang='zh-CN'> を lang='en' に切り替えるとスクリーンリーダーが自動で音声エンジンを切り替える
      refs:
      - STD-W3C-WCAG22:3.1.1
      - STD-W3C-WCAG22:3.1.2
    - name: 図記号による負担軽減
      description: 重要な標識と警告には図形記号を併記し言語依存を下げる。記号は国際的に通用する意味を用いる
      domain: universal
      example: 非常口は文字ではなく走る人型の図を用いる。洗濯表示は図形記号を用いる
      refs: []
    - name: 音声入力の寛容性
      description: 音声認識は非母語のアクセント、構音障害、方言の認識率を受け入れ基準に含める
      domain: digital
      example: テストセットにアクセントのある音声サンプルを含め、認識率は母語話者のサンプルの 90% を下回らない
      refs: []
    - name: 言語レベルの制御
      description: 重要情報には平易な言語（plain language）版を補足する。用語には初出時に短い説明を付す
      domain: digital
      example: 医学用語の横に平易な説明と図示を添える
      refs:
      - STD-W3C-WCAG22:3.1.5
    anti_patterns:
    - name: 単一言語の前提
      description: デフォルトで英語または単一の支配的言語が全ユーザーを覆うとする
      consequence: 非該当言語のユーザーは直接排除される。低文化程度のユーザーにはさらに一層の障壁が重なる
    - name: 機械翻訳の直出し
      description: 機械翻訳の内容を母語話者の校閲を経ずに公開する
      consequence: 重要な操作（医療/金融）での誤訳は実害を生む。丁寧語のズレが信頼を壊す
    - name: 文字のみの単一チャネル
      description: すべての情報を文字だけで伝える
      consequence: 文字を読めない/読むのが困難なユーザーは情報を得る経路がゼロになる——図形+音声は最も基本的な二チャネルの冗長性である
  G-WHO-F-012:
    name: 低リテラシーフレンドリーガイド
    patterns:
    - name: 図形主体の伝達
      description: 中核の操作と警告は図形記号を主チャネル、文字を補助とする。図形の意味は対象ユーザーのテストで理解可能かを確認する
      domain: universal
      example: 薬の説明書：服薬時間は『1 日 2 回』ではなく太陽/月の図で示す
      refs: []
    - name: 音声チャネルの並行提供
      description: 重要情報に音声読み上げの選択肢を設ける。操作は文字入力に代わる音声入力に対応する
      domain: digital
      example: フォームの音声入力：話した内容を自動で記入し、ユーザーが確認してから送信する
      refs: []
    - name: 情報密度の制御
      description: 1 画面 1 テーマ。段落は 3 行以内。詰まった文字の壁ではなく余白と階層で置き換える
      domain: digital
      example: 行政フォームの最初のページには一つの事項の説明と入口だけを置く
      refs:
      - STD-W3C-WCAG22:1.4.8
    - name: 専門用語の敷居ゼロ
      description: 公衆向けの内容では専門用語を禁じる。必須の用語には図示と平易な説明を付す。文は短く能動態で
      domain: universal
      example: 『申請を受け付けました。3 営業日以内に返信します』で『チケットが処理キューに入りました』を置き換える
      refs: []
    anti_patterns:
    - name: 識字率の前提
      description: デフォルトでユーザーが中等教育以上の読み書き能力を持つと想定する
      consequence: 世界には約 7.6 億人の成人文盲があり、より多くの低文化集団が直接排除される。機能的文盲は先進社会でも同様に普遍である
    - name: 文字の壁
      description: 長い段落、密集した条項式の組版
      consequence: 低い読み書き能力のユーザーは文字の壁を見て諦める。情報取得率はページの文字密度と反比例する
  G-WHO-F-013:
    name: 人間工学適合ガイド
    patterns:
    - name: パーセンタイル設計法
      description: 物理的な寸法パラメータは P5（女性第 5 百分位）〜P95（男性第 95 百分位）をカバー区間とする。直感ではなく GB/T 10000-2023 / ANSUR II のデータを用いる
      domain: industrial
      example: 座面高さの調整範囲は P5 女性〜P95 男性の座位高を覆う
      refs:
      - STD-GB-T-10000
      - STD-ANSUR-II
    - name: 調整可能な構造
      description: 重要な物理インターフェース（机/椅子/支架/取っ手）は調整可能とする。固定式のインターフェースには複数仕様の選択肢を用意する
      domain: industrial
      example: ワークステーション：デスク高さは電動調整、モニターは全方向アーム
      refs: []
    - name: 力の上限管理
      description: 通常操作の力は標準の推奨値を超えない。高力の操作には工具の補助や複数人での協働案を用意する
      domain: industrial
      example: バルブのハンドルにトルク延長バーを付け、一人で 200N 以下の操作を完了できる
      refs: []
    - name: 特殊な体型の明示的カバー
      description: 妊婦、子ども、車椅子利用者の寸法と到達性のニーズを明示的に設計範囲に含める。『平均的人体』からの外挿に頼らない
      domain: universal
      example: フロントの窓口は高さが車椅子の視線に適合。椅子は妊婦の腹部の余裕を確保
      refs: []
    anti_patterns:
    - name: 男性規格を既定に
      description: 男性の平均寸法をデフォルトの設計基準とする
      consequence: 女性および体格が平均値から乖離するユーザーは、道具の寸法、操作力、到達距離で系統的に排除される。PPE『均サイズ』の罠の典型的な発生源である
    - name: 固定パラメータ信仰
      description: コストのために単一仕様に固定する
      consequence: カバレッジ区間外のユーザーは不適切な姿勢で使用を強いられる——長期的に筋骨格への損傷が蓄積する
  G-WHO-F-014:
    name: プライバシー信頼設計ガイド
    patterns:
    - name: データ最小化の先行
      description: 各データフィールドに『収集しなければどうなるか』を問う。収集しなくて済むなら収集せず、収集するなら必ず用途の説明を付す
      domain: universal
      example: 登録はメール+パスワードのみ、誕生日/携帯番号は任意で用途を説明する
      refs:
      - STD-GDPR:25
    - name: 段階的な共有制御
      description: 個人情報の公開度を段階化する（公開/友人のみ/自分のみ）。ユーザーは情報の種類ごとに独立して制御する
      domain: digital
      example: プロフィールページの各情報の横に公開度のセレクタがある
      refs: []
    - name: 同意はプロセス
      description: プライバシー条項は階層的な要約で提示する（1 ページの図解 + 節ごとの詳細 + 全文）。拒否の選択肢と同意の選択肢を同じページ・同じ階層・同じ視覚的重みにする
      domain: digital
      example: 初回起動：3 ページの図解要約 + 下部に『同意/拒否』を同じ重みで並べた二つのボタン
      refs: []
    - name: 同意撤回の対等な容易さ
      description: 同意を撤回する経路は同意を与える方法と同じくらい容易にする。撤回後は直ちに反映しデータの状態を知らせる
      domain: digital
      example: プライバシーパネルでワンタッチで特定の許諾を取り消し、取り消すと即座に止まる
      refs:
      - STD-GDPR:7.3
      - STD-PIPL:15
    anti_patterns:
    - name: 機能人質化
      description: 機能の利用を人質にユーザーへデータ提供を迫る（同意しなければ使えない）
      consequence: PIPL 第 16 条は、不同意を理由に製品の提供を拒否することを明確に禁止する——法的リスクと信頼崩壊の二重の敗北
    - name: 条項の壁
      description: 冗長な法律用語のプライバシーポリシー + デフォルトでチェック済み
      consequence: ユーザーは『同意した』のであって知情ではない——GDPR/PIPL のいずれでも有効な同意にならない。信頼はダークモードへ崩壊していく
    - name: 匿名化が終点
      description: 匿名化をプライバシー義務の終着点とみなす
      consequence: 匿名データの再識別リスクは継続する。透明性とユーザー制御は継続的な義務である
  G-WHO-F-015:
    name: ジェンダー包摂設計ガイド
    patterns:
    - name: 性別項目の任意化
      description: 性別フィールドには『回答しない/カスタム』の選択肢を設けるか、そもそも削除する。収集前に用途を問う——正当な用途がなければ当該フィールドを設けない
      domain: digital
      example: 登録フォームの性別はプルダウンの任意選択で、カスタム入力欄を含む
      refs: []
    - name: 呼称と代名詞の設定可能化
      description: 呼称フィールドは任意とする。ユーザーが設定した代名詞を UI と通信で一貫して用いる。氏名/外見から推定してはならない
      domain: universal
      example: カスタマーサポートのシステムがユーザー設定の代名詞（they/彼女/彼）を表示し、呼びかけに自動で用いる
      refs: []
    - name: サイズは性別でなく採寸基準
      description: サイズ体系は身体計測（胸囲/ウエスト/ヒップ）を軸とし、性別の二元で区分しない
      domain: fashion
      example: トップスのサイズ表：胸囲のセンチで直接サイズを選び、男性/女性款の区別がない
      refs: []
    - name: オールジェンダー空間
      description: トイレ/試着室など性別に関わる空間には全性別/家族向けの選択肢を用意する
      domain: architecture
      example: 商業施設は各階に少なくとも一箇所の全性別トイレ（多くの建築規範が既に要求）
      refs: []
    - name: アイデンティティ変更の経路
      description: 履歴中の性別情報はアイデンティティの変化に応じて更新できる。変更手続きは旧アイデンティティの詳細の開示を求めない
      domain: digital
      example: プロフィールの性別は変更でき、履歴も同期して更新され『以前は X』とは表示しない
      refs: []
    anti_patterns:
    - name: 二元的な強制単一選択
      description: 性別フィールドが男/女の排他的な単一選択でかつ必須
      consequence: ノンバイナリー、トランスジェンダー、回答拒否のユーザーは最初のステップで排除される——フォームの第一歩から敵意を生む
    - name: 性別の推定
      description: 氏名、外見、行動習慣から性別を自動推定し、呼称やコンテンツの推送に用いる
      consequence: 推測の誤りは冒犯をもたらす。性別の表現は同一性ではなく、どちらも外部から推測してはならない
    - name: 空間の二元分割
      description: トイレ/試着室/会員特典を男女のみで区分する
      consequence: トランスジェンダーとノンバイナリーのユーザーは『どちらに入っても間違い』という空間的排除に直面し、安全リスクすら生じる
  G-WHY-F-001:
    name: 包摂コスト戦略ガイド
    patterns:
    - name: ライフサイクル全体のコスト視点
      description: インクルーシブへの投資は『前期設計 vs 後期改修』の全ライフサイクルで比較提示する——前期のインクルーシブ設計はローンチ後のコンプライアンス改修よりコストが大幅に低い（M-WHY-F-001-01 の台帳フレームに対応）
      domain: universal
      example: 新築時のスロープのコストは、完成後の改修の約 1/10
      refs: []
    - name: プラットフォーム化によるコスト分散
      description: インクルーシブ能力をプラットフォームのコンポーネントとして蓄積する（アクセシビリティ部品ライブラリ/汎用人間工学モジュール）。多数の製品で再利用し単位コストを薄める
      domain: digital
      example: デザインシステムにアクセシビリティ部品を内蔵し、新製品が追加コストゼロで受け継ぐ
      refs: []
    - name: 優先度マトリクス
      description: 『排除される集団の規模 × 改修コスト』で投資の優先度を決める。強制コンプライアンス項目（WCAG AA/GB 55019）は削れない第一梯隊とする
      domain: universal
      example: P0=法定コンプライアンス；P1=高カバレッジ低コストの改修；P2=長期ロードマップ
      refs: []
    anti_patterns:
    - name: コスト近視眼
      description: 初期投資を抑えるためにアクセシビリティを『第二期』へ先送りする
      consequence: 後からの改修コストが数倍になり、初期ユーザーを失う。『先にローンチして後で補う』は包摂にとって最も高価な道筋である
    - name: 公益扱いの誤解
      description: インクルーシブへの投資を公益/ブランド支出として計上する
      consequence: ROI で検討できない——包摂設計は市場の拡張（障害者の市場+高齢化+状況的なニーズ）であり、慈善ではない
  G-WHY-F-002:
    name: 包摂的市場ポジショニングガイド
    patterns:
    - name: 能力の明示化
      description: アクセシビリティ/シニア対応能力を価値提案に明示する（認証の資質、実測データ）。『黙った良い設計』にしない
      domain: universal
      example: 製品ページで『WCAG 2.2 AA 検証済み + シニア対応認証』を直接示す
      refs:
      - STD-W3C-WCAG22:1
    - name: 関連人群への拡張
      description: 対象集団の定義に『関連する集団』を含める——障害のある人の家族、高齢化社会の主流ユーザー（ROD 2024 対照：人口の 63% が障害のある集団と関連）
      domain: universal
      example: シニア向け製品は『親に買う子ども』にも同時に定位する
      refs: []
    - name: 調達要件の事前組み込み
      description: 政府調達/企業調達のコンプライアンス要件（EN 301 549/アクセシビリティ宣言）を事前に製品能力として内蔵する
      domain: digital
      example: 官公庁・企業市場向けに EN 301 549 のコンプライアンス報告を事前に作成する
      refs:
      - STD-EN-301549:9
    anti_patterns:
    - name: 適合最低ライン狙い
      description: 法定の最低ラインでインクルーシブを行い、それをコストの上限とみなす
      consequence: 最低限のコンプライアンスには差別化の価値がない。調達者が見ているのは『誰がベースラインを超えているか』である。達成は入場券であって売りではない
    - name: 極端への過度な迎合
      description: 最も厳しい基準のために主流の体験を犠牲にする
      consequence: 包摂はゼロサムではない——1% のために 100% の 99% を犠牲にする案は両者の不満を招く。階層的な充足が正解である
  G-WHY-F-003:
    name: ビジネスモデル包摂ガイド
    patterns:
    - name: 無料の中核層
      description: 中核機能は永久無料層 + 付加価値の課金。課金の壁を基本的な可及性の上に設けない（M-WHERE-F-005-01 と本カードの連動に対応）
      domain: digital
      example: ノートアプリ：基本的な記録は無料、協働と AI は課金層
      refs: []
    - name: 体験を損なわない収益化
      description: 広告/収益化の設計は中核タスクの流れに侵入してはならない：操作領域を覆わず、システム通知を装わず、スキップ経路を正直に見えるようにする
      domain: digital
      example: リワード動画広告は任意で視聴、ポップアップ広告は出さない
      refs: []
    - name: 支払い能力に応じた階層化
      description: 支払い方式は支払い能力の低い集団を覆う：月払い/学生価格/地域別価格/タスクで特典を得る（ROD 2024 の価格階層化の実践に対応）
      domain: service
      example: 発展途上国では地域別価格 + 学生半額
      refs: []
    anti_patterns:
    - name: ペイウォール包囲
      description: 中核機能を段階的に課金層へ移して購読を迫る
      consequence: 『 boiling frog』式の課金は信頼を破壊する。無料層の価値の約束は守られなければならない
    - name: 広告の寄生
      description: 広告による遮蔽、クリック誘導、閉じるボタンの偽装
      consequence: Mathur et al. 2019 のダークモード分類学の全項目——短期的な転換は上がるが長期的なブランド反噬を招く。かつ WCAG の複数条項と矛盾する
  G-WHY-F-004:
    name: 持続可能な包摂設計ガイド
    patterns:
    - name: 耐久性は包摂性
      description: 製品寿命を延ばす設計（修理可能/アップグレード可能/モジュール化）は持続可能性と経済的可達性の双方に資する——安く買うより長く使うほうが得（M-WHERE-F-005-01 と連動）
      domain: industrial
      example: 交換可能な電池のスマホ + 5 年間の補修部品の約束
      refs: []
    - name: グリーンモードを既定に
      description: 省エネ/低消費電力モードを深く埋もれた選択肢ではなくデフォルトの段階とする。グリーンな選択に追加の負担をかけない
      domain: digital
      example: デフォルトで有効な暗色の省電力 + バックグラウンド更新オフ
      refs: []
    - name: 回収経路のクローズドループ
      description: 製品ライフサイクル終了時の回収/下取り経路を設計成果物の一部とする
      domain: industrial
      example: ブランド直営の回収 + 材料の分解・分別可能性の表示
      refs: []
    anti_patterns:
    - name: グリーン＝高価の誤り
      description: 環境配慮版を高価格の限定品にする
      consequence: 持続可能性は贅沢品であってはならない。一般価格のグリーンデザインこそ世界を変える（包摂的な価格設定と同じ理屈）
    - name: 計画的陳腐化
      description: 交換不可の電池/閉じたインターフェースで買い替えを強制する
      consequence: 低所得ユーザーには二重の排除である（頻繁に買い替えも買えない）。規制（各国の修理権法）はこの古い道を塞ぎつつある
  G-WHY-F-005:
    name: ステークホルダー均衡ガイド
    patterns:
    - name: 支払い側と利用者の分離認識
      description: 『使う人』と『払う人』が一致しない場面を明示的に識別し、それぞれの中核要請を満たす（Freeman 1984 のフレームの実践）
      domain: universal
      example: 企業ソフト：従業員は効率を、管理層はレポートを求める——折衷的な一つのビューではなく二つのビュー
      refs: []
    - name: 対立の明示的記録
      description: 多主体の要求の衝突は台帳化する：衝突点、裁定の根拠、影響を受ける側——意思決定を追跡可能にする（M-WHY-F-005-01 に対応、C 級証拠の注記）
      domain: universal
      example: 要求レビューで『IT セキュリティのために従業員の利便性を犠牲にした』こととその理由を記録する
      refs: []
    - name: 弱い立場の代弁の仕組み
      description: エンドユーザーの中の弱い立場（管理される学生/後見される患者）が意思決定に明示的な代弁の経路を持つ。払う人が発言権を独占してはならない
      domain: universal
      example: 医療システムの設計レビューには患者代表を必ず含める
      refs: []
    anti_patterns:
    - name: 支払い側の暴政
      description: 金を出す者の言い分に従う
      consequence: B 端製品は『管理者には親切だがユーザーには痛苦な』システムを強制される——足で投票する離脱は最終的に支払者側を痛める
    - name: 折衷の泥沼
      description: 多主体の要求を平均化して処理する
      consequence: どの集団も 60% の満足度を得る=全員が不満になる——中核の要請に応じてビューと機能を分ける方が、大鍋よりよい
cases:
  CASE-001:
    title: Apple Assistive Access：認知アクセシビリティの減算的デザイン
    summary: iOS 17 は Assistive Access を導入。認知障害のあるユーザーに大きなボタン・少ない選択肢・単一タスクのミニマルなインターフェースを提供し、ホーム画面には厳選した App のみを表示、メッセージにはリアクションか自撮り動画で返信できる。
    outcome: 認知アクセシビリティの模範的実践として広く見なされている。Apple は後に iOS/iPadOS 26 で Assistive Access scene API を開放し、サードパーティ App の接続を可能にした。
  CASE-002:
    title: Xbox Adaptive Controller：ハッカソンから V&A コレクションまで
    summary: マイクロソフトは 2018 年に 99.99 ドルの Xbox Adaptive Controller を発売。19 個のジャックポートが従来のコントローラのボタンに代わり、AbleGamers、脳性麻痺財団などの組織と協働で設計され、アクセシブルなパッケージを含む。
    outcome: V&A 博物館のラピッドレスポンス収蔵に収録。Copilot の 2 コントローラ協働モードが遊び方を拡張。インクルーシブなハードウェアの市場実現性と文化的価値を証明した。
  CASE-003:
    title: OXO Good Grips：愛する人の関節炎から生まれたユニバーサル調理器具
    summary: 1990 年、Sam Farber は妻 Betsey の関節リウマチをきっかけに Smart Design と協働し、楕円形の熱可塑性ゴム製グリップの調理器具を設計。最初の 15 点はサンフランシスコの Gourmet Products Show で発表された。
    outcome: ユニバーサルデザインの教科書的事例となった。少数派のために設計しながら主流市場を獲得し、MoMA に永久収蔵。2004 年に OXO は 2.732 億ドルで Helen of Troy に売却された。
  CASE-004:
    title: Nike GO FlyEase：誇大マーケティングに損なわれたアクセシブルデザイン
    summary: Nike 初のハンズフリーで脱ぎ履きできる靴 GO FlyEase（$120、2021-04-30 発売）は数量限定で発売され、転売業者に買い占められ、二次市場では $500〜2000 に吊り上がった。障害のある購入者（設計上の目標ユーザー）はかえって入手できなかった。宣伝文句は「障害」という語を避けている（Slate：Jackson & Virdi の批判）。
    outcome: 障害アドボケイト Louie Lingard の批判動画は 110 万回以上再生された。Nike は追加供給を約束したが、すでにコミュニティの信頼を損なった——「インクルーシブデザインがインクルーシブな販売を伴わない」反面教材。
  CASE-005:
    title: WebAIM Million 2025：ウェブ全体のアクセシビリティ・ベースラインの現状
    summary: WebAIM によるトップ 100 万サイトのホームページの年次スキャン。94.8% のホームページに検出可能な WCAG 2 の失敗項目があり、平均 51.1 エラー／ページ（2024：56.8）。低コントラストの文字 79.1%、alt テキストの欠落 55.5% が最も一般的な問題である。
    outcome: 6 年間でわずか 3.1 ポイントの改善——自動化で検出可能なアクセシビリティ債務はほぼ横ばい。企業のアクセシビリティ負債の直接的な定量証拠。
  CASE-006:
    title: Ed Roberts Campus：建築の主叙事としてのユニバーサルデザイン
    summary: Berkeley の Ed Roberts Campus（Leddy Maytum Stacy Architects、2011）は、直径 56 フィートの螺旋スロープを建築の核となる社交空間として設計した——幅 7 フィートは車椅子 2 台が並んで会話できる広さで、スロープの内側は展示空間を兼ねる。
    outcome: 「ユニバーサルデザインは規則による制約ではなく、良きデザインそのものである」という建築的宣言。3600 万ドルの建設費において、アクセシビリティはコストではなく売りとなった。
  CASE-007:
    title: Robles v. Domino's：ウェブアクセシビリティのコンプライアンスリスク判例
    summary: 盲人ユーザー Robles は、Domino's のウェブサイトと App がスクリーンリーダーで操作できないとして提訴（ADA Title III）。第 9 巡回控訴裁判所は 2019-01-15 に、ADA がウェブサイト／App に適用されると判断。Domino's の手続上の上訴は最高裁に却下された（cert denied 2020）。
    outcome: ウェブアクセシビリティのコンプライアンス先例を確立した。具体的な技術法規がなくても法的義務は免除されない。6 年後（2022-06）に Domino's は和解で決着。企業がアクセシビリティを先延ばしにした場合の訴訟コストの実証。
  CASE-008:
    title: NAD v. Netflix：100% カバレッジを後押しした字幕訴訟
    summary: 2011 年、NAD は Netflix の Watch Instantly が字幕なしで ADA に違反すると提訴。裁判所は Netflix の CVAA 優先適用の抗弁を退け（2012-06-19）、同年 10 月に和解が成立。2 年以内に 100% のストリーミングコンテンツに字幕を付し、Netflix は 75.5 万ドルの弁護士費用を支払い、裁判所は 4 年間の監視を留保した。
    outcome: ストリーミング業界の字幕カバレッジは、訴訟の起点から法定基線（CVAA＋FCC 規則）と市場標準の二重の駆動へと進んだ。法による駆動と技術標準の並行という業界級の変革経路を例示した。
