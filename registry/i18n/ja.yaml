# i18n 覆盖层 — 日语（多语言补译工程 v0.1）
#
# 纪律：
#   1) 译文只落本层；卡片与注册表是字符源，重跑生成不覆盖译文
#   2) 逐字保留：标准编号与条款号（ISO/WCAG/GB/GDPR/PIPL）、单位、数值、工具名（NVDA/JAWS/VoiceOver/NASA-TLX 等）
#   3) 不新增任何标准条款或文献引用（新增须逐条 web 核验）
#   4) 文体：ja = 简洁的常体（だ・である調）／ko = 简洁的书面体（평서형）
#   5) 条目 id 必须存在于对应注册表——构建期 build-data.mjs 会因未知 id 直接报错
#
# 本文件由 scripts/merge_i18n.py 按批次生成/合并（勿手工调整头部注释）。
locale: ja

metrics:
  M-HOW-F-001-01:
    name: ネットワーク耐性の段階
    description: 弱回線/オフラインの段階下で、中核機能の可用性と劣化時の体験を自動テストする
    measurement_method: ネットワーク条件の帯域制限シミュレーション（3G/2G/50% パケット損失/オフライン）→ 機能可用性の自動プローブ
    thresholds:
      minimum: 切断時に読み取り専用機能が利用可能で、明確なオフライン通知がある
      good: 弱回線（3G 級）で中核タスクを完了できる（タイムアウト ≤ 10s）
      excellent: オフラインファースト構成とバックグラウンド自動同期
  M-HOW-F-002-01:
    name: 低スペック端末の性能下限
    description: 対象市場の最低仕様端末上で中核タスクの性能を自動計測する
    measurement_method: 最低仕様端末/エミュレータによる実測：コールドスタート、初回画面、中核インタラクションの応答時間（P75/P95）
    thresholds:
      minimum: コールドスタート ≤ 5s かつ中核インタラクション応答 ≤ 200ms（ISO 9241-112 応答性の実践）
      good: P75 インタラクション応答 ≤ 100ms かつ低メモリ端末でクラッシュなし
      excellent: 適応的な画質と端末性能に応じた段階的読み込み
  M-HOW-F-002-02:
    name: 低スペック端末でのタスク効率
    description: 最低サポート仕様の端末での中核タスク完了の効率を基準端末と比較する（ISO 9241-11 の効率測度、目標達成にかかる資源消費の応用）
    measurement_method: 最低サポート仕様を定義 → 同一のユーザー群が最低仕様と基準端末でそれぞれ中核タスクを完了 → 完了時間と操作ステップ数を比較
    thresholds:
      minimum: 低スペックの完了時間 ≤ 基準 ×1.5
      good: ≤ 基準 ×1.3
      excellent: ≤ 基準 ×1.1 かつ機能の劣化なし
  M-HOW-F-003-01:
    name: バッテリー逼迫シナリオの網羅
    description: Rahmati & Zhong 2009 の人間-バッテリー相互作用研究が特定した高負荷シナリオ（低残量不安/充電不可/長時間外出）への対応機能を監査する
    measurement_method: 高負荷シナリオのチェックリスト監査（省電力モード/低消費最適化/残量予測/複数の充電方式）、人間-バッテリー相互作用研究の行動パターンと照合
    thresholds:
      minimum: 省電力モードを提供し残量状態を確認できる
      good: 残り使用時間の予測と低電力戦略
      excellent: 複数充電方式の冗長化（有線/無線/外部）とシナリオ適応的な消費低減
  M-HOW-F-004-01:
    name: 互換性マトリクスの通過率
    description: サポートマトリクス（ブラウザ/OS/AT のバージョン組み合わせ）にわたり中核フローを自動回帰テストする
    measurement_method: サポートマトリクス×スモークケースの自動回帰；EN 301 549 clause 11 の Web 互換性確認
    thresholds:
      minimum: 宣言したサポートマトリクスがスモークケースを 100% 通過
      good: AT の組み合わせ（スクリーンリーダー×ブラウザ）で中核フローを通過
      excellent: 2 メジャーバージョン分の下位互換と異常時の友好な劣化
  M-HOW-F-005-01:
    name: レガシー環境への適応
    description: 対象ユーザーの既存技術環境（旧 OS/旧ブラウザ/企業の制限環境）への適応戦略と劣化時の代替手段を監査する
    measurement_method: 既存環境の棚卸し → 適応/劣化戦略の監査 → 劣化時体験の実測
    thresholds:
      minimum: 対象市場の主要な既存環境に対する明確なサポート/劣化の宣言
      good: 劣化モードで中核機能が利用可能（白画面ではなくグレースフルデグラデーション）
      excellent: 環境能力に応じた適応版の自動配信
  M-HOW-F-006-01:
    name: 支援技術の相互運用
    description: スクリーンリーダー/スイッチコントロール/音声コントロールで中核タスクを完了する実測通過率
    measurement_method: 主要 AT の組み合わせで実測（WCAG 4.1.2 の Name/Role/Value 確認 + 中核タスクを AT で全行程操作）
    thresholds:
      minimum: WCAG 4.1.2 の失敗ゼロかつスクリーンリーダーで中核タスクを完了できる（A 級ベースライン）
      good: 主要 AT の組み合わせで中核タスク成功率 ≥ 90%
      excellent: 全 AT の組み合わせ + まれな AT（スイッチ/視線入力）を通過
  M-HOW-F-007-01:
    name: 出力チャネルの冗長性
    description: 重要情報の出力が単一の感覚チャネルに依存しない（視覚が色に依存しない WCAG 1.4.1、音声に字幕/テキスト代替がある）
    measurement_method: 出力イベント×チャネルのマトリクス監査（WCAG 1.4.1 色の使用、1.2.2 キャプション、1.1.1 非テキストコンテンツの確認）
    thresholds:
      minimum: 色が唯一の情報伝達手段でない（WCAG 1.4.1 A 級）かつメディアに代替がある（1.1.1/1.2.2 A 級）
      good: 二重チャネル出力で重要情報を網羅
      excellent: ユーザーが出力の優先チャネルを選択でき、チャネル間で同期する
  M-HOW-F-008-01:
    name: 認証パスのアクセシブルな冗長性
    description: WCAG 2.2 SC 3.3.8 に従い認証パスを監査する：認知機能テストの免除、複数パスの独立性、パスワードマネージャー互換性、回復フロー
    measurement_method: 認証パス×能力要件マトリクスの監査（認知/視覚/聴覚/運動）、3.3.8 の逐条確認（認知テストの例外/代替パス/貼り付け許可）
    thresholds:
      minimum: ≥2 本の独立した認証パスかつ強制される認知機能テストがない（WCAG 3.3.8 AA 級）
      good: アカウント回復が秘密の質問に依存せず、パスワードマネージャーの自動入力が妨げられない
      excellent: WebAuthn/マジックリンク等のパスワードレス経路 + セッション延長 + 各パスの能力要件の公示
  M-RUL-001-01:
    name: アクセシビリティ機能の利用率
    description: 中核のアクセシビリティ機能（スクリーンリーダー、キーボードナビゲーション、ハイコントラスト等）の可用性通過率
    measurement_method: WCAG 2.1 AA 達成基準の項目別チェックリスト通過率
    thresholds:
      minimum: WCAG 2.1 AA 100% 通過（必須）
      good: AA 100% + 一部の AAA 条項
      excellent: AA 100% + AAA の重要条項 + 主要 AT 互換の検証
  M-RUL-002-01:
    name: データ主体の権利対応の適合
    description: データ主体の権利のプロセス（同意の撤回/閲覧と複製/訂正と補足/削除）が対象法域の期限と利便性要件を満たすか監査する
    measurement_method: データ権利プロセスのウォークスルー × 法域条項マトリクス（GDPR：撤回を付与と同等の方法で容易に[Art.7(3)]/1か月以内の応答[Art.12(3)]/削除権[Art.17]；PIPL：容易な撤回[第15条]/サービスの拒否禁止[第16条]/告知[第17条]/知情決定/閲覧と複製/訂正/削除[第44-47条]）
    thresholds:
      minimum: 対象法域のすべての法定権利の経路が存在し期限を満たす（GDPR は1か月以内の応答；PIPL は容易な撤回）
      good: 同意の撤回経路が付与と同じページ・同レベルで到達可能（設定の奥に埋もれていない）、権利請求にステータス追跡がある
      excellent: 権利行使の全行程セルフサービス化 + 処理期限の内部 SLA が法定より厳格 + 多法域請求の自動ルーティング
  M-RUL-003-01:
    name: 対象市場の安全認証の準備度
    description: 製品が対象市場の強制安全認証（CE/UL/FDA/MDR/ISO 26262 等）に対して条項レベルでどの程度準備できているか監査する
    measurement_method: 対象市場×認証体系マトリクスの監査：認証チェックリストの確認 → 設計文書における安全要件のトレーサビリティ → 事前適合テストのギャップ分析
    thresholds:
      minimum: 対象市場の強制認証チェックリストを確認し、安全要件が設計文書まで追跡可能
      good: ハザード分析とリスク評価の文書が完備し、事前適合テストに合格
      excellent: 複数認証の並行経路（1 回の設計で複数市場の認証を満たす）+ 認証維持プロセス（再審査の追跡）
  M-RUL-004-01:
    name: ライセンスと SBOM の完備度
    description: SPDX 標準に従いコード/依存関係/素材のライセンス識別の網羅度とライセンス競合を監査する（License List の短縮識別子仕様を含む）
    measurement_method: SCA ツールによるスキャン（ソースコード+依存関係）→ SPDX 識別子の正規化 → 伝染性ライセンス（GPL 系）の競合分析；素材ライセンス台帳の確認
    thresholds:
      minimum: 100% のコンポーネントが SPDX ライセンス識別子を持つ（Unknown ライセンスがビルドに入らない）
      good: SBOM が機械可読（SPDX 形式）+ 伝染性ライセンスの競合がゼロ
      excellent: 素材ライセンスチェーンが完備（フォント/画像/音声ごとにライセンス証明）+ ライセンス変更の CI 監視
  M-RUL-005-01:
    name: 倫理審査体制の完備度
    description: Belmont 三原則と IEEE EAD フレームワークに従い倫理審査体制を監査する：インフォームドコンセントのプロセス、リスク-便益評価、公平性監査、苦情申立ての窓口
    measurement_method: 倫理チェックリスト監査（Belmont：尊重[自律と保護]→インフォームドコンセント、善行→リスク便益評価、正義→公平な選択；IEEE EAD：透明性/説明責任/説明可能性）+ ユーザー研究プロトコルの抜き取り確認
    thresholds:
      minimum: 人を対象とする研究にインフォームドコンセントのプロセスがあり IRB/倫理委員会の審査が記録されている（Belmont 三原則が項目ごとに確認可能）
      good: アルゴリズム判断に公平性監査の記録 + ダークパターンの自主点検がゼロ + 倫理フィードバック窓口が利用可能
      excellent: 倫理評価を設計段階に前倒し（デザイン倫理ワークショップ）+ AI システムを IEEE EAD 八原則体系に整合
  M-RUL-006-01:
    name: 業界参入規範のマッピング度
    description: 製品が対象業界の参入規範（HIPAA/PCI DSS/FERPA/DO-178C 等）に対して条項レベルでどのようにマッピングされ適合しているか監査する
    measurement_method: 対象業界×参入規範マトリクスの監査（医療 HIPAA/金融 PCI DSS/教育 FERPA/航空 DO-178C）→ 条項要件から設計/プロセスへのエビデンスマッピング
    thresholds:
      minimum: 対象業界の参入規範チェックリストを確認し担当責任者を指定
      good: 適用される各条項にエビデンスマッピングがある（設計文書/テスト報告/プロセス記録）
      excellent: 業界規範の変更追跡体制 + クロス業界製品での複数規範並行のマッピング再利用
  M-WHAT-F-001-01:
    name: タスク手順の複雑度
    description: 中核タスクのステップ数、判断点数、分岐数を評価し、タスク構造の複雑度がユーザー能力に適合するか判断する
    measurement_method: タスク分析 → ステップ/判断点/分岐の計数 → 複雑度の等級付け（低/中/高）
    thresholds:
      minimum: 中核タスク ≤ 7±2 ステップかつ判断点 ≤ 3（ミラーの法則の合意値）
      good: 段階的なガイダンスと進捗表示を提供
      excellent: エキスパート向けショートカット経路を提供（並行した上級操作）
  M-WHAT-F-001-02:
    name: 中核タスクの操作ステップ数
    description: 中核タスクの主フローの操作ステップ数と判断点の計数（ISO 9241-11 効率測度の構造的代理指標、ステップが多いほど認知と操作の負荷が高い）
    measurement_method: タスク分析で主フローを分解 → 操作ステップを計数（ページ/フォーム送信/重要判断）→ 統合または省略できるステップを特定
    thresholds:
      minimum: 主フロー ≤10 ステップ
      good: ≤7 ステップ
      excellent: ≤5 ステップかつ手戻りループなし
  M-WHAT-F-002-01:
    name: 認知負荷の測定指標
    description: NASA-TLX 尺度でタスクの認知負荷を測定する
    measurement_method: NASA-TLX 尺度（6 次元の重み付け）
    thresholds:
      minimum: NASA-TLX 総合スコア ≤ 60
      good: NASA-TLX 総合スコア ≤ 45
      excellent: NASA-TLX 総合スコア ≤ 30
  M-WHAT-F-002-02:
    name: タスク完了時間のパーセンタイル
    description: 十分なサンプル数でタスク完了時間を収集し、P5/P50/P95 を算出する
    measurement_method: P95 完了時間 / 期待完了時間
    thresholds:
      minimum: P95 ≤ 期待時間 × 2
      good: P95 ≤ 期待時間 × 1.5
      excellent: P95 ≤ 期待時間 × 1.2
  M-WHAT-F-003-01:
    name: エラー許容と回復の完備度
    description: 典型的な操作エラー（誤タップ/誤削除/誤送信）を注入し、回復可能性、取り消しの可用性、損失防止を測定する
    measurement_method: エラー注入テスト → 取り消し成功率/データ損失率/回復ステップ数を記録
    thresholds:
      minimum: 破壊的操作に確認があり取り消し可能（ISO 9241-110:2020 5.6 Use error robustness に対応）
      good: エラーメッセージに回復の手引きが含まれる（WCAG 3.3.1/3.3.3）
      excellent: 下書きの自動保存とロールバック履歴
  M-WHAT-F-003-02:
    name: エラー回復の成功率
    description: 注入エラーに遭遇した後、外部支援なしでタスクを回復するユーザーの割合と所要時間（エラー許容要求の直接測定、ISO 9241-110 のエラー許容原則、WCAG 3.3.1 エラーの識別）
    measurement_method: 典型的なエラー（必須項目の欠落/形式エラー/ネットワーク中断）を注入 → 支援なしで回復するユーザーの割合と平均回復時間を観察・記録
    thresholds:
      minimum: ≥70% のエラーを支援なしで回復
      good: ≥85% かつ回復経路に明確な手引きがある（3.3.1 エラーをテキストで説明）
      excellent: ≥95% かつ平均回復時間 <30 秒
  M-WHAT-F-004-01:
    name: 永続化と再開の完備度
    description: セッション/端末をまたぐ長いタスクについて、自動保存、再開の入り口、状態同期、冗長入力の排除を監査する（WCAG 3.3.7）
    measurement_method: セッション中断/端末切り替えの実測 → データ保存率/再開成功率；同一フロー内の重複入力項目の計数（WCAG 2.2 SC 3.3.7 Redundant Entry A 級の確認）
    thresholds:
      minimum: 同一フロー内で既知情報を再入力しない（WCAG 3.3.7 A 級 必須）
      good: 自動保存 + 長いタスクを網羅する再開の入り口
      excellent: 端末をまたぐリアルタイム同期とバージョン履歴
  M-WHAT-F-005-01:
    name: 協働ロールの網羅
    description: 協働タスクのロール別ビュー、権限、並行編集の競合処理、第三者協働支援ツールとの互換性を監査する
    measurement_method: ロール×権限マトリクスの監査 + 2 名の並行編集による競合処理の実測
    thresholds:
      minimum: 協働タスクがロール別権限と操作の記録をサポート
      good: 並行編集の競合にマージ/ロック戦略がある
      excellent: アシスタント/代理人がシームレスに参加できる（WHERE-F-009 被支援使用に対応）
  M-WHAT-F-006-01:
    name: 中断耐性の実測
    description: タスクの要所で中断（着信/通知/人為的割り込み）を注入し、タスク再開率と認知的再起動コストを測定する
    measurement_method: 中断注入実験 → 再開成功率/再起動時間/重複操作回数の統計
    thresholds:
      minimum: 中断後も状態が保持され、再開時に最初からやり直す必要がない
      good: 再開点の提示（「先ほどの操作を続ける」）
      excellent: 中断時の内容を自動一時保存し、状況に応じた提示で再開
  M-WHEN-F-001-01:
    name: 全時間帯での可用性
    description: 中核機能の全時間帯での可用性と夜間適応（ダークモード/明るさ/おやすみモード）を確認する
    measurement_method: 時間帯別の機能チェックリスト監査 + 夜間シナリオの実測
    thresholds:
      minimum: 中核機能が 24h 利用可能でダークモードがある
      good: 夜間のおやすみモードと遅延処理のオプション
      excellent: 照度/時間帯に適応するインターフェース
  M-WHEN-F-002-01:
    name: 利用頻度層別の適応度
    description: 高頻度/低頻度ユーザーの層別に差異化設計を監査する（高頻度：効率機能；低頻度：記憶補助、最近の記録、簡素化した画面）
    measurement_method: 頻度層別の定義（DAU/MAU 比またはセッション間隔の分布）→ 層別機能マトリクスの監査；習慣形成は Lally et al. 2010 の漸近線モデルを参照
    thresholds:
      minimum: 低頻度の経路に記憶補助がある（最近使用/既定値のプリフィル）
      good: 高頻度の経路に一括/ショートカット操作；低頻度の経路に利用ガイド
      excellent: 個人の利用パターンに応じて難易度と画面密度を適応
  M-WHEN-F-003-01:
    name: 季節適応の監査
    description: 季節/異常気象/祝日パターン下での機能保持度を監査する（照度/温度/湿度/休日の分布などの次元の適応特性を含む）
    measurement_method: 季節シナリオのチェックリスト（異常気象/光周期/祝日パターン）× 機能保持の監査；光感受性の高い集団は SAD 研究の照度要件と照合
    thresholds:
      minimum: 異常気象/温度下でも中核機能が失効しない（防水/耐温仕様を達成）
      good: 照度/温度の変化にモード適応（冬季は暗色/夏季はハイコントラスト/防眩）
      excellent: 祝日モードと季節コンテンツの自動切り替え
  M-WHEN-F-004-01:
    name: 時間制限の調整可能性
    description: 製品内のすべての時間制限を棚卸しし、オフ/調整/延長が可能かを逐条確認する；本質的な例外は根拠を記録する必要がある
    measurement_method: 時間制限の棚卸し → WCAG 2.2.1 に基づく逐条確認（オフ/調整/延長）→ 本質的例外の根拠記録
    thresholds:
      minimum: 本質的でない時間制限の 100% が調整可能（WCAG 2.2.1 A 級）
      good: 残り時間の可視化と進捗表示
      excellent: 既定では時間制限なし（本質的に必要な場合のみ設定し根拠を残す）
  M-WHEN-F-004-02:
    name: 時間負荷スコア（NASA-TLX）
    description: NASA-TLX の時間的要求（Temporal Demand）下位次元でタスクの時間的圧迫の主観負荷を測定する（本尺度の六次元に Temporal Demand を含み 0-20 点、Hart & Staveland 1988）
    measurement_method: 改版の前後にそれぞれ ≥8 名の代表的なユーザーに同一の中核タスクを完了してもらい NASA-TLX に記入、Temporal Demand 次元の平均値を比較
    thresholds:
      minimum: 時間的要求の平均 ≤15/20
      good: ≤10/20
      excellent: ≤6/20 かつ改版での低減幅 ≥30%
  M-WHEN-F-005-01:
    name: 断点からの再開サポート
    description: 長いタスクについて自動保存、再開の入り口、所要時間の見積り、段階的計画の特性を監査する
    measurement_method: 長いタスクの棚卸し → 中断注入テスト（データ保存率/再開成功率の統計）
    thresholds:
      minimum: 長いタスクが自動保存（間隔 ≤ 30s またはリアルタイム）され再開の入り口がある
      good: タスクの所要時間見積りと段階的計画の表示
      excellent: 端末をまたぐシームレスな再開（状態同期）
  M-WHEN-F-006-01:
    name: 疲労対応の完備度
    description: 疲労検知シグナル（連続エラー/操作の鈍化/セッション時間）と対応機構（休憩の促し/画面の簡素化/断点保存）を監査する
    measurement_method: 疲労シグナル×対応機構マトリクスの監査；長時間セッションの実測によるエラー率の増加曲線（NASA-TLX 尺度と照合して検証）
    thresholds:
      minimum: 長時間セッションに一時停止と断点保存がある（疲労による中断でデータが失われない）
      good: 連続エラー/操作の鈍化が能動的な休憩の促しをトリガーする
      excellent: 疲労に適応する画面（情報量の削減/重要要素の拡大）
  M-WHERE-F-001-01:
    name: 環境エンベロープへの適応
    description: 使用環境のエンベロープ（照度/騒音/天候/手の状態）を定義し、エンベロープの端での機能保持度を逐条テストする
    measurement_method: 環境エンベロープ×機能マトリクスの実測または推定（照明と音響は ISO 21542:2021 cl.5.4/5.7 を参照）
    thresholds:
      minimum: 公称環境（通常の屋内照明など）で全機能が利用可能
      good: 強光/低光と高騒音下で中核機能が利用可能
      excellent: 全シナリオへの自動適応（明るさ/コントラスト/触覚フィードバックの切り替え）
  M-WHERE-F-001-02:
    name: 強光環境でのコントラスト維持
    description: 強光/高い環境照度の条件下で、前景と背景のコントラストが WCAG 1.4.3（4.5:1）と 1.4.11（3:1）の要件を依然として満たすかを実測する
    measurement_method: 対象環境の照度範囲を定義 → 画面のピーク輝度での本文と主要 UI コンポーネントの実際のコントラストを実測 → 重要情報の可読性を記録
    thresholds:
      minimum: 本文 ≥4.5:1 かつ UI コンポーネント ≥3:1（強光下の実測）
      good: minimum に加えてハイライト/無効状態ともに判別可能
      excellent: 自動ハイコントラストまたは明るさ適応モードを提供
  M-WHERE-F-002-01:
    name: 社会的状況における機能監査
    description: 公共/共有の場面におけるプライバシー遮蔽、ミュート、状況モード、複数ロールの切り替え特性を監査する
    measurement_method: 社会的状況（公共の場で一人/共視聴/第三者が在席）× 機能マトリクスの監査
    thresholds:
      minimum: 公共の場での使用でプライバシーの強制的な露出がない（ミュート/遮蔽を選択可能）
      good: 状況/ロールの迅速な切り替えを提供
      excellent: 状況適応的な提示（同行者/位置を感知）
  M-WHERE-F-003-01:
    name: 空間アクセシビリティの適合率
    description: GB 55019 の強制条項（通行の有効幅 ≥900mm、スロープ、手すり等）と ISO 21542 の通行条項に基づき逐条実測する
    measurement_method: 実地計測+チェックリスト（GB 55019 ch.2 通行施設 / GB 50763 / ISO 21542:2021 cl.8 内部通行と cl.9 建築部材）
    thresholds:
      minimum: GB 55019 の強制条項 100% 適合（法規のレッドライン）
      good: ISO 21542 の推奨条項 ≥ 80% 適合
      excellent: 車椅子による実地走査で全動線が通貫（避難経路を含む）
  M-WHERE-F-004-01:
    name: 資源喪失への耐性
    description: 外部資源への依存（電力/ネットワーク/人手/消耗品）を列挙し、単一点の喪失下で中核機能の保持度をテストする
    measurement_method: 資源×機能マトリクス + 供給停止演習（停電/オフライン/支援なし）
    thresholds:
      minimum: いずれかの単一点の資源喪失時に中核機能が利用可能（劣化モード）
      good: 劣化状態を明確に提示し自動復旧する
      excellent: オフラインファースト/自給アーキテクチャ
  M-WHERE-F-005-01:
    name: 経済的可及の段階
    description: 無料層/低価格層、端末と通信量のコスト最適化を監査し、対象市場の所得分布と金融包摂データと照合する
    measurement_method: 価格階層×対象市場の所得分布の照合（World Bank の所得分類/貧困ラインを参照）；通信量と旧端末サポートの監査
    thresholds:
      minimum: 無料または低価格の入手経路がある（中核機能にペイウォールを設けない）
      good: 低スペック端末と通信量節約モードをサポート（オフライン/軽量版）
      excellent: 支払い能力に応じた階層価格（学生/地域別価格/公益ライセンス）
  M-WHERE-F-006-01:
    name: 緊急機能の到達可能性
    description: 緊急操作（SOS/避難/中止）のステップ数と多感覚アラートを監査し、GB 55019 の情報伝達条項と ISO 21542 の消防避難条項と照合する
    measurement_method: インターフェースの状態グラフを走査して最短ステップ数を計測 + アラートチャネルの確認（視/聴/触）、建築系は GB 55019 ch.4 と ISO 21542:2021 cl.11 のチェックリストで実測
    thresholds:
      minimum: 緊急操作 ≤ 3 ステップかつアラートが多感覚（適用範囲内で強制規範に適合）
      good: ログイン/ロック解除なしで緊急機能が利用可能
      excellent: オフラインの緊急情報と訓練モード
  M-WHERE-F-007-01:
    name: 状況の網羅マトリクス
    description: ISO 9241-210 の使用状況の要素（ユーザー/目標/環境）に基づき状況×機能マトリクスを構築し、実測の網羅を確認する
    measurement_method: 状況の棚卸しと等級付け（P0/P1/P2）→ 設計の網羅確認 → 実測記録
    thresholds:
      minimum: P0 の状況を 100% 定義し設計で網羅
      good: P0 をすべて実測 + P1 を机上走査
      excellent: 極端/並行の状況（割り込み、マルチタスク）を実測で網羅
  M-WHERE-F-008-01:
    name: 共有利用の分離度
    description: マルチユーザーシナリオのセッション分離、データ消去、清掃可能性、無監視での耐久性を監査する
    measurement_method: 共有シナリオのチェックリスト（公共端末/家庭での共用/複数人での覗き見）× 分離と衛生特性の監査
    thresholds:
      minimum: 共有シナリオにセッション分離と使用後のデータ消去がある
      good: 迅速なユーザー切り替えとゲストモード
      excellent: 複数人での覗き見に適応するレイアウトと衛生材質の仕様
  M-WHERE-F-009-01:
    name: 協働代理のサポート度
    description: 支援者による代理完了、認可、遠隔支援、操作記録の特性（被支援使用の状況）を監査する
    measurement_method: 支援者シナリオの実測（中核タスクを代理完了するための認可機構と成功率）
    thresholds:
      minimum: 中核タスクを支援者が代理で完了できる（明確な認可機構）
      good: 協働者のビューと操作の記録
      excellent: 遠隔リアルタイム支援と音声による協働ガイド
  M-WHICH-F-001-01:
    name: 情報密度の選好指標
    description: 複数の情報密度設定下でのユーザーの選択頻度と満足度スコア
    measurement_method: 調整可能な密度段階の数 + ユーザー満足度スコア
    thresholds:
      minimum: 2-3 個の密度段階を選択可能
      good: 4+ 段階またはカスタムスライダーを提供
      excellent: 適応的な推薦 + 完全なカスタマイズ + 選好の記憶
  M-WHICH-F-002-01:
    name: 探索深度の段階的サポート
    description: 漸進的開示の階層（基本/上級/エキスパート）と「危険操作の保護」の段階設計を監査する
    measurement_method: 機能の棚卸しを階層別に分類して監査 + 初心者/エキスパートの二視点による走査
    thresholds:
      minimum: 中核経路に強制的な探索がない（最少クリックで直接到達）
      good: 「シンプル/詳細」の二モードまたは階層化された入り口を提供
      excellent: ユーザーが探索深度を選択し選好を記憶
  M-WHICH-F-003-01:
    name: 自動化レベルの調整可能性
    description: Parasuraman 2000 の十段階自動化モデルに基づき自動化レベルの選択可能性を監査し、各レベルに対するユーザーの信頼と介入頻度を測定する
    measurement_method: 自動化機能×レベルマトリクスの監査 + ユーザー実測（手動介入率/取り消し利用率/受容度尺度）
    thresholds:
      minimum: すべての自動化判断が取り消しまたは上書き可能（ISO 9241-110 5.5 制御性に対応）
      good: 自動化レベルをユーザーが選択可能（全自動/半自動/手動の段階）
      excellent: システム能力の公示 + ユーザーが介入の粒度を選択（項目別/一括）
  M-WHICH-F-003-02:
    name: 自動化の制御可能な網羅率
    description: システムが自動実行する操作を棚卸しし、各項目に知覚可能な一時停止/取り消し/パラメータ調整があるかを確認する（ISO 9241-110 の対話原則における制御性 controllability に対応）
    measurement_method: 自動実行される全行為を列挙（自動送信/自動課金/自動リダイレクト/自動入力）→ 各項目に確認、取り消し、パラメータ調整の入り口があるかを逐条確認
    thresholds:
      minimum: 自動操作の 100% が取り消し可能または事前確認あり
      good: minimum に加えてインタラクションのテンポと順序をユーザーが制御可能
      excellent: 自動化の程度をユーザーの選好に合わせて個別設定可能
  M-WHICH-F-004-01:
    name: 可視性の粒度制御
    description: ソーシャル場面の可視性オプションの粒度（全体/グループ/単発）と状態公開の既定値を監査する
    measurement_method: 可視性オプションのマトリクス監査 + 既定値のプライバシー傾向の確認（既定は最小公開であるべき）
    thresholds:
      minimum: 可視性スイッチを提供し既定は最小公開
      good: グループ/単発の可視性粒度を選択可能
      excellent: 公開前の可視性プレビュー（「誰がこれを見られるか」）
  M-WHICH-F-005-01:
    name: スタイル選択度と一貫性
    description: 公式テーマ/カスタマイズ能力、およびスタイル切り替え時の機能位置の安定性（再学習コストの低減）を監査する
    measurement_method: テーマとカスタマイズ能力の棚卸し監査 + 切り替え前後の機能位置の一貫性の走査
    thresholds:
      minimum: ≥2 の公式テーマを提供し既定は普遍（高い可読性の中性的なスタイル）
      good: 主要なカスタマイズ能力（文字サイズ/コントラスト/モーションの切り替え）+ 切り替え後も機能位置が不変
      excellent: スタイルの選好をクロスプラットフォームで同期し記憶
  M-WHICH-F-005-02:
    name: 美的満足度スコア
    description: 代表的なユーザーによる視覚スタイルの主観的な満足度スコア（ISO 9241-11 の満足度 satisfaction 測度の応用、選好に正誤はなく測定するのは対象集団の受容度）
    measurement_method: ≥8 名の代表的なユーザーを招き、実際のタスク後に 3 問の満足度アンケート（1-5 点）に記入、改版の前後で比較
    thresholds:
      minimum: 平均 ≥3.5/5
      good: ≥4.0/5
      excellent: ≥4.3/5 かつ推薦意向が非負
  M-WHICH-F-006-01:
    name: 入力モダリティの冗長度
    description: 中核操作の入力モダリティ数（タッチ/キーボード/音声/ジェスチャ/物理ボタン）、単一モダリティ障害時の代替経路の有無
    measurement_method: 中核操作×モダリティマトリクスの監査；WCAG 2.5.1 ポインタジェスチャと 2.1.1 キーボードに基づく代替経路の確認
    thresholds:
      minimum: 中核操作が ≥ 2 種のモダリティ（キーボード等価を含む、WCAG 2.1.1 A 級）
      good: ≥ 3 種のモダリティで、微細動作を要さないモダリティ（音声/大ボタン）を含む
      excellent: モダリティを自由に切り替えられ選好を記憶
  M-WHICH-F-007-01:
    name: フィードバックのマルチチャネル冗長
    description: 重要フィードバック（成功/失敗/進捗/警告）の多感覚チャネル冗長を監査する（視覚+聴覚+触覚のうち少なくとも二チャネル）
    measurement_method: フィードバックイベント×チャネルマトリクスの監査；WCAG 4.1.3 ステータスメッセージ（AA）でスクリーンリーダーの読み上げを確認
    thresholds:
      minimum: 重要フィードバックが単一の感覚チャネルに依存しない（WCAG 1.4.2 音声制御関連 + ISO 9241-110 5.2 自己記述性）
      good: 二チャネルのフィードバックでユーザーが優先チャネルを選択可能
      excellent: 三チャネルの冗長と感覚代替（点滅→振動）
  M-WHICH-F-008-01:
    name: インタラクションモードの選択性
    description: インタラクションモードの棚卸し（直接操作/コマンド/ジェスチャ/音声/ショートカット）の併存性、既定の選択性、切り替えコストを監査する
    measurement_method: モード×タスクマトリクスの監査 + モード切り替えのステップ数と再学習コストの評価
    thresholds:
      minimum: 中核タスクが ≥2 モードで利用可能で既定モードをユーザーが選択可能
      good: 切り替え ≤1 ステップかつ強制モードなし（タッチでもショートカット等価を保持）
      excellent: モードの選好の記憶と状況感知の推薦（運転→音声）
  M-WHICH-F-009-01:
    name: 通知の制御可能性
    description: 通知の粒度制御（カテゴリ別の切り替え/おやすみモード/一括サイレント）と緊急通知の貫通戦略を監査する
    measurement_method: 通知種別×制御粒度マトリクスの監査 + おやすみモードの実測（緊急カテゴリが貫通できるか）
    thresholds:
      minimum: 通知をカテゴリ別に切り替え可能で全体ミュートを提供
      good: おやすみモードの時間帯/状況ルール（緊急の例外を含む）
      excellent: 通知の要約統合と優先度のユーザー定義
  M-WHO-F-001-01:
    name: 能力要求の排除率
    description: Cambridge 排除測算法（Waller/Langdon/Clarkson 2010）に基づき、製品の使用をタスクに分解し各タスクの能力要求を評価して、集団の能力分布と照合し排除されるユーザーの割合を推定する
    measurement_method: タスク分析 → 五類の能力要求の評価（視覚/聴覚/操作/到達/移動）→ 1996/97 DFS の能力分布と照合して排除率を算出
    thresholds:
      minimum: いずれかの中核タスクの排除率 ≤ 10%
      good: 中核タスクの排除率 ≤ 5%
      excellent: ≤ 2% かつ多重障害の重畳分析を含む
  M-WHO-F-001-02:
    name: 支援技術の互換性
    description: インタラクティブなコンポーネントが名称/役割/値をプログラムでアクセス可能な形で公開しているか、状態変化を支援技術（スクリーンリーダー、スイッチコントロール）が知覚できるか（能力代替チャネルの基盤的保障）を確認する
    measurement_method: NVDA/VoiceOver + キーボードのみで中核タスクを走査し、各コントロールの名称/役割/状態の読み上げ可能性を記録；動的フィードバックはリアルタイムに読み上げられるかを確認（WCAG 4.1.2/4.1.3）
    thresholds:
      minimum: 中核タスクの全コントロールが読み上げ可能な名称と役割を持つ（4.1.2）
      good: minimum に加えて状態変化がリアルタイムに読み上げられる（4.1.3）
      excellent: NVDA/JAWS/VoiceOver の三主要スクリーンリーダーで阻害級の問題がゼロ
  M-WHO-F-002-01:
    name: ユーザーペルソナの多様性バイアス
    description: 調査サンプルと persona の分布を対象市場の人口統計（年齢層/性別/地域）と照合し、代表性の偏差を算出する
    measurement_method: persona と対象集団の統計の対照表 + 交叉次元の網羅確認
    thresholds:
      minimum: 年齢/性別/地域の三次元すべてに代表があり単一点のペルソナでない
      good: 各次元で対象集団との偏差 ≤ 20%
      excellent: 偏差 ≤ 10% かつ交叉的な不利組合せを網羅（例 高齢×低技術リテラシー）
  M-WHO-F-003-01:
    name: 健康状態への適応の網羅
    description: 設計が一般的な健康影響のカテゴリ（感覚/運動/慢性疼痛/疲労/服薬期の変動）に対してどの程度適応できているか監査する
    measurement_method: 健康影響カテゴリ×適応措置マトリクスの監査（WCAG AA ベースラインの確認を含む）
    thresholds:
      minimum: 感覚と運動のカテゴリの適応 100%（WCAG AA ベースライン）
      good: 慢性疾患の一般的な影響（疲労/疼痛/認知の変動）に明示的な設計
      excellent: 低頻度・高リスクの状態（光過敏性てんかん等）に専用の保護
  M-WHO-F-004-01:
    name: マルチモーダル提示の完備度
    description: 重要コンテンツの二チャネル以上の提示（図と文+動画+インタラクティブ演習）を監査し、Pashler 2008 の結論に従い設計の応答をスタイル適応ではなくマルチモーダル提示と位置づける
    measurement_method: 重要コンテンツ×提示モダリティマトリクスの監査（コンテンツが ≥2 チャネルで取得可能か）
    thresholds:
      minimum: 重要な操作ガイダンスが ≥2 モダリティ（例 図と文+動画）
      good: 学習/ヘルプの既定モダリティをユーザーが選択可能
      excellent: 全コンテンツが ≥2 モダリティで、テンポを制御可能（繰り返し/早送り/スロー再生）
  M-WHO-F-005-01:
    name: 感情体験の三層監査
    description: Norman の三層（本能/行動/内省）に基づき感情のタッチポイントを監査し、ユーザーの感情反応を測定する
    measurement_method: 感情タッチポイントマップ × 三層分類の監査 + PANAS/SAM 尺度による測定 + SDT 三欲求の充足度評価
    thresholds:
      minimum: 主要フローに挫折を招く点がない（PANAS のネガティブスコアが基準を上回らない）
      good: 主要タッチポイントにポジティブな設計（達成感/信頼感）があり SDT 三欲求を明示的に支援
      excellent: エンパワーメントの瞬間の設計（知覚可能な進歩/掌握）+ ピークエンドの法則の最適化
  M-WHO-F-006-01:
    name: 感覚強度の調整可能性
    description: 各感覚チャネル（視覚/聴覚/触覚）の強度調整能力を監査し、HSP 尺度の敏感度分布を参照して調整範囲を設計する
    measurement_method: 感覚チャネル×調整可能特性マトリクスの監査（明るさ/色温度/音量/振動/モーション強度）、HSP 敏感度分布と照合して調整範囲を設定
    thresholds:
      minimum: 主要な感覚チャネルの強度が調整可能（明るさ/音量/振動）
      good: モーションをオフ可能（prefers-reduced-motion に応答）+ 無刺激モード（低感覚モード）
      excellent: 全チャネルが連続的に調整可能 + 状況別の感覚プロファイルの記憶
  M-WHO-F-006-02:
    name: 多感覚冗長の網羅
    description: 情報が単一の感覚チャネルのみで伝達されていないかを確認する（WCAG 1.4.1 色を唯一の視覚的手段にしてはならない、1.3.3 説明を形状/色/位置/音声などの感覚的特徴のみに依存させない）
    measurement_method: インターフェースと文書内で色/形状/位置/音声のみで意味を伝える情報点を棚卸し → 各点に冗長な符号化（テキスト/アイコン/パターン/音声）があるかを確認
    thresholds:
      minimum: 色のみで伝達する情報点がゼロ
      good: いずれかの単一の感覚チャネルのみで伝達する情報点がゼロ
      excellent: 重要情報にマルチモーダルな代替（視覚+聴覚/触覚）
  M-WHO-F-007-01:
    name: 未経験者の初回成功率
    description: 低技術リテラシーのユーザー（例 スマートデバイスを初めて使う高齢者）を募り、支援なしで中核タスクを完了する
    measurement_method: 支援なしのユーザビリティテストで、初回のタスク成功率、ヘルプ要求回数、完了時間を記録
    thresholds:
      minimum: 中核タスクの支援なし成功率 ≥ 80%
      good: ≥ 90% かつ平均ヘルプ要求 ≤ 1 回
      excellent: ≥ 95% かつ完了時間 ≤ 熟練ユーザー P95
  M-WHO-F-008-01:
    name: 文化ローカライズの監査
    description: アイコンの隠喩、色の象徴、氏名/日付/住所の形式、読む方向について文化横断で監査する
    measurement_method: 対象文化のチェックリストによる逐条監査 + ≥2 の文化背景のユーザーによる検証
    thresholds:
      minimum: 攻撃的な記号がなく、ローカライズ形式をサポート（氏名/日付/住所）
      good: アイコンと隠喩を ≥2 の文化背景のユーザーで検証
      excellent: RTL レイアウトと対象市場の全言語をサポート
  M-WHO-F-009-01:
    name: 神経多様性に配慮した特性の網羅
    description: モーションの低減、予測可能なレイアウト、平易な言葉、コンテンツの分割、時間的圧迫を伴わない既定値など、神経多様性に配慮した特性を確認する
    measurement_method: 神経多様性に配慮した設計チェックリストの監査（モーション切り替え/レイアウトの一貫性/言葉の平易さ/コンテンツの分割/既定の時間制限）、prefers-reduced-motion への応答確認を含む
    thresholds:
      minimum: モーション低減のオプションを提供しレイアウトが予測可能に保たれる
      good: 平易な言葉とコンテンツの分割が基準を達成
      excellent: 感覚強度が全面的に調整可能で集中モードを提供
  M-WHO-F-010-01:
    name: 認知要求の排除率
    description: Cambridge 排除測算の認知次元（記憶/注意/理解）を用い、タスクの認知要求を評価して認知排除率を推定する
    measurement_method: タスクの認知要求の評価（同時保持項目数/ステップ数/判断点の計数）→ 能力分布と照合して排除を推定
    thresholds:
      minimum: 中核タスクの同時記憶項目 ≤ 4 かつステップを分割可能
      good: 認知排除の推定 ≤ 5%
      excellent: ≤ 2% かつプリフィル/進捗提示などの負担軽減支援を提供
  M-WHO-F-011-01:
    name: 言語アクセシビリティの監査
    description: ページの言語宣言（lang）、コンテンツの読解レベル、平易な言葉による代替のアクセシビリティを確認する
    measurement_method: lang 属性の確認（WCAG 3.1.1/3.1.2）+ コンテンツの読解レベルの測定 + 対象言語の網羅チェックリスト
    thresholds:
      minimum: lang 宣言が正しく対象市場の言語を 100% 網羅
      good: 中核コンテンツの読解レベル ≤ 中学レベル
      excellent: 平易な言葉の版と用語集を提供
  M-WHO-F-012-01:
    name: 非テキスト代替の網羅
    description: 中核タスクに図解/動画/音声などの非テキストの代替ガイダンスがあるか、重要コピーが統制語彙を採用しているかを確認する
    measurement_method: タスク×代替チャネルマトリクスの監査 + 語彙の複雑度の抜き取り確認
    thresholds:
      minimum: 中核タスクに ≥1 の非テキストのガイダンス（図解または動画）
      good: 主要な操作語が統制されている（常用語彙表の範囲内）
      excellent: 全タスクを音声ガイダンスのみで完了可能
  M-WHO-F-013-01:
    name: 人体寸法の適合パーセンタイル
    description: ANSUR II と GB/T 10000-2023 の人体データで、主要寸法（到達/クリアランス/把持/視距離）の集団パーセンタイルの網羅を確認する
    measurement_method: 主要寸法×集団パーセンタイルの照合（まず対象集団でデータセットを選択：中国は GB/T 10000-2023、北米は ANSUR II を参照）
    thresholds:
      minimum: 主要寸法が対象集団の P5–P95 を網羅
      good: P1–P99 を網羅
      excellent: 主要寸法が連続的に調整可能（座席/スタンド/ストラップ等）
  M-WHO-F-014-01:
    name: プライバシー制御の完備度
    description: 権限の粒度、データの削除/エクスポートの入り口、ゲストモード、保持ポリシーを監査し、ユーザーの権利請求への応答時効を確認する
    measurement_method: プライバシー制御のチェックリスト監査 + 権利請求プロセスの演習（GDPR/PIPL の適用範囲内）
    thresholds:
      minimum: 権限を項目別に切り替え可能でアカウント削除の入り口に到達可能（法定の応答期間内）
      good: データのエクスポートと状況別の認可を提供
      excellent: ゲスト/匿名モードとローカル処理のオプションを提供
  M-WHO-F-014-02:
    name: データ収集の最小化
    description: 製品が収集する個人情報が中核機能の必要性と整合しているかを監査する（GDPR 第 5(1)(c) 条のデータ最小化 adequate, relevant and limited to what is necessary と PIPL の最小必要原則の応用）
    measurement_method: フォーム別/権限別に収集フィールドを棚卸し → 各フィールドの機能的必要性を注記 → 非必須の収集フィールドの割合を算出し用途の説明を確認
    thresholds:
      minimum: 中核機能と無関係な必須の個人情報がない
      good: 非必須の収集フィールドの 100% に用途の説明が付く
      excellent: 非必須の収集がゼロかつエクスポートと削除の経路を提供
  M-WHO-F-015-01:
    name: ジェンダー包摂の完備度
    description: ジェンダーフィールドの中立性、敬称/代名詞の設定可能性、サイズ体系の中立性を監査する；トランスジェンダー/ノンバイナリのユーザーを招いて検証する
    measurement_method: ジェンダー関連タッチポイントのチェックリスト監査（フォーム/敬称/空間/サイズ）+ トランスジェンダーとノンバイナリのユーザーによる実測（Haimson 2016/2023 の方法論：アイデンティティ変更のシナリオとコミュニティ参加型設計）
    thresholds:
      minimum: ジェンダーフィールドは任意でノンバイナリ/回答しないの選択肢を含む；代名詞を設定可能
      good: 過去データの変更経路が存在する（アイデンティティ移行後に記録を更新可能）
      excellent: 全ジェンダーの空間オプション + 性別二元ではなく身体計測に基づくサイズ
  M-WHY-F-001-01:
    name: 包摂的投資の投入産出フレームワーク
    description: 包摂的投資の定量記録（適合コスト/開発投入）と便益フレームワーク（市場規模/改修回避/ブランド価値）を監査し、ROD 2024 の市場データと照合する
    measurement_method: 包摂的投資の台帳 × 便益次元の照合（ROD 2024：世界の障害市場 $18.3T/米国 PWD の可処分所得 $1.3T/人口の 63% が関連）
    thresholds:
      minimum: 包摂的投資に専用の記録がある（一般の開発コストに混入していない）
      good: ライフサイクルコストの比較がある（初期の包摂設計 vs 後期の改修コスト）
      excellent: 包摂的便益を事業の論証に組み込む（市場ポジショニング/差別化/調達上の優位）
  M-WHY-F-002-01:
    name: 包摂的市場ポジショニングの監査
    description: 製品ポジショニングにおける包摂的価値提案の明示性（対象集団の網羅宣言/差別化の説明/アクセシビリティ能力の公示）を監査する
    measurement_method: ポジショニング文書 × 包摂的価値提案チェックリスト；ROD 2024 の 63% 人口関連データと照合して対象集団の定義の完備性を評価
    thresholds:
      minimum: 対象集団の定義が合理的に到達可能な集団を排除しない（「〜に限る」式の排除宣言がない）
      good: 包摂的能力が価値提案に明示的（例 アクセシビリティ資格/シニア対応認証）
      excellent: 包摂性を中核の差別化要素とし調達資格で裏付ける
  M-WHY-F-003-01:
    name: ダークパターンの監査
    description: Mathur et al. 2019 の分類学に基づき誘導的な設計（カウントダウンの圧迫/偽の在庫/隠れた解約/強制バンドル）を監査する
    measurement_method: 主要フローを画面ごとにダークパターンのチェックリスト（7 大分類 15 型）と照合して監査；解約フローと登録フローのステップ数の対称性を実測
    thresholds:
      minimum: 解約のステップ数 ≤ 登録のステップ数かつ隠れた解約がない（EU 消費者保護指令の実践）
      good: 全フローに Mathur 分類学の欺瞞的パターンがない
      excellent: 重要判断にクーリングオフ/取り消し機構がある
  M-WHY-F-004-01:
    name: 持続可能性指標の網羅
    description: トリプルボトムライン（Elkington 1997）と照合し、環境次元の定量目標とデータ開示を監査する
    measurement_method: エネルギー効率/寿命/修理可能性/リサイクル可能性の四点確認；電源製品はエネルギー効率ラベルとカーボンフットプリントの開示を確認
    thresholds:
      minimum: 適用される環境法規に適合（RoHS/エネルギー効率標準の強制項目）
      good: エネルギー効率と修理可能性のデータを開示（修理する権利指令の実践）
      excellent: ライフサイクル全体のカーボンフットプリントの開示とリサイクル経路
  M-WHY-F-005-01:
    name: ステークホルダー間の利害対立の解決
    description: Freeman 1984 のステークホルダー識別フレームワークに基づき、多者のニーズ対立の明示的な記録と解決戦略を監査する
    measurement_method: ステークホルダーマップ → ニーズ対立の登録 → 解決戦略の記録監査（判断が追跡可能）
    thresholds:
      minimum: 中核ユーザーと支払者とのニーズ対立が明示的に記録されている
      good: 各対立に裁定の根拠と影響を受ける側の説明がある
      excellent: 脆弱なステークホルダー（エンドユーザーの中の脆弱な集団）に代弁の仕組みがある
facets:
  FAC-WHO-F-001-01:
    name: 視覚能力
    definition: 視覚情報を知覚するために必要な視力・視野・色覚・光順応の能力（聴覚・身体操作・認知処理を含まない）
  FAC-WHO-F-001-02:
    name: 聴覚能力
    definition: 聴覚情報を知覚するために必要な聴力と音の識別能力（視覚・身体操作・認知処理を含まない）
  FAC-WHO-F-001-03:
    name: 運動能力
    definition: 操作を完了するために必要な四肢の筋力・巧緻動作・到達範囲・移動能力。排除測算法の巧緻／到達／移動の三類型に対応する（感覚チャネルと認知処理を含まない）
  FAC-WHO-F-001-04:
    name: 言語・認知能力
    definition: 情報を理解・表出するために必要な言語の受容／産出能力、および注意・記憶・実行機能などの認知処理能力（感覚チャネルと身体操作を含まない）
factors:
  HOW-F-001:
    name: ネットワーク条件
    evidence_note: 標準条項（WCAG 2.2／EN 301 549 のネットワーク関連）はあるが、次元特異的な研究に欠ける。間接的な支えであり、C 級を維持
  HOW-F-002:
    name: デバイス能力
    evidence_note: 標準条項（WCAG 2.2 のターゲットサイズなど）があり、デバイス能力を標準が間接的に支える。C 級を維持
  HOW-F-003:
    name: 電源とバッテリー持続時間
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Rahmati & Zhong 2009 の人–電池インタラクション実証研究（MobileHCI'07＋PMC 拡張）。直接的な研究の支え
  HOW-F-004:
    name: 互換性要件
    evidence_note: 標準条項（EN 301 549 の互換性要求）はあるが、独立した研究に欠ける。C 級を維持
  HOW-F-005:
    name: 技術的環境
    evidence_note: 標準条項（EN 301 549 の開放性条項）があり、間接的な支え。C 級を維持
  HOW-F-006:
    name: 支援技術の互換性
    evidence_note: 標準条項（WCAG 2.2 SC 4.1 の互換性、EN 301 549 clause 11 の AT 互換性）があり、間接的な支え。C 級を維持
  HOW-F-007:
    name: 入出力能力
    evidence_note: 標準条項（WCAG 2.2 の入力関連 SC）があり、間接的な支え。C 級を維持
  HOW-F-008:
    name: 認証とアイデンティティの負担
    evidence_note: WCAG 2.2 SC 3.3.8（アクセシブル認証、A 級）、ICF d1（学習と知識の応用）。クロス対照レポート INCL-XREF-001 GAP-3 の判定
  RUL-001:
    name: アクセシビリティ法規のコンプライアンス
    evidence_note: コンプライアンス基線カード：直接の条項の支えは各国法規の原文（ADA／EN 301 549／GB/T 37668-2019 など）であり、研究証拠ではなく法規上の義務に属する。C 級を維持
  RUL-002:
    name: データプライバシーのコンプライアンス
    evidence_note: コンプライアンス基線カード：直接の条項の支えは GDPR／PIPL の法規原文であり、研究証拠ではなく法規上の義務に属する。C 級を維持
  RUL-003:
    name: 安全認証要件
    evidence_note: コンプライアンス基線カード：直接の条項の支えは各業界の強制安全標準の原文（CE／UL／FDA／ISO 26262 など）であり、研究証拠ではなく法規上の義務に属する。C 級を維持
  RUL-004:
    name: 知的財産のコンプライアンス
    evidence_note: コンプライアンス基線カード：直接の条項の支えは各国の知的財産法とオープンソースライセンスの条項であり、研究証拠ではなく法規上の義務に属する。C 級を維持
  RUL-005:
    name: 倫理審査
    evidence_note: コンプライアンス基線カード：直接の条項の支えは Belmont Report、IRB ガイドライン、IEEE EAD などの倫理枠組みの原文であり、研究証拠ではなく制度的義務に属する。C 級を維持
  RUL-006:
    name: 業界固有の基準
    evidence_note: コンプライアンス基線カード：直接の条項の支えは各業界規範の原文（HIPAA／PCI DSS／DO-178C など）であり、研究証拠ではなく法規上の義務に属する。C 級を維持
  RUL-007:
    name: 政策と法規
    evidence_note: 墓碑カード（B1 裁決）：RUL-001〜006 の単行コンプライアンスカードと意味が重複するため、上記 6 カードに統合済み。本カードは歴史的参考にとどまり、もはや条項と文献を紐付けない
  WHAT-F-001:
    name: タスクの複雑さ
    evidence_note: 標準条項（ISO 9241-110 のタスク適合性）があり、間接的な支え。C 級を維持
  WHAT-F-002:
    name: 認知負荷
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Sweller 1988 認知負荷理論の基礎文献（Cognitive Science、8600+ 引用）
  WHAT-F-003:
    name: フォールトトレランス要件
    evidence_note: 標準条項（WCAG 2.2 のエラー許容関連 SC）があり、間接的な支え。C 級を維持
  WHAT-F-004:
    name: タスク持続性要件
    evidence_note: 標準条項（WCAG 2.2 SC 3.3.7 Redundant Entry の冗長入力 ＋ SC 3.2.3 の一貫したナビゲーション、間接的な支え。C 級を維持
  WHAT-F-005:
    name: タスク協調性
    evidence_note: 標準条項（WCAG 2.2 の協働関連 SC）があり、間接的な支え。C 級を維持
  WHAT-F-006:
    name: タスク中断耐性
    evidence_note: 標準条項（WCAG 2.2 SC 3.2.6 の一貫したヘルプ、2.2.1 の時間調整可能）があり、間接的な支え。C 級を維持
  WHEN-F-001:
    name: 利用時間帯
    evidence_note: 標準条項（WCAG 2.2 の時間関連 SC）があり、間接的な支え。C 級を維持
  WHEN-F-002:
    name: 利用頻度
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Lally et al. 2010 の習慣形成曲線（18〜254 日の漸近線、「21 日」という俗説ではない）。直接的な研究の支え
  WHEN-F-003:
    name: 季節性
    evidence_note: C4a 検証文献の紐付け（2026-10-08）：Rosenthal et al. 1984 の SAD 基礎文献（季節性気分と光の実証）。直接的な研究の支え
  WHEN-F-004:
    name: 時間的プレッシャー
    evidence_note: 標準条項（WCAG 2.2 SC 2.2.1／2.2.2 ＋ ISO 9241-110:5.5.2）があり、間接的な支え。C 級を維持
  WHEN-F-005:
    name: 時間の可用性
    evidence_note: 標準条項（WCAG 2.2 の時間調整 SC）があり、間接的な支え。C 級を維持
  WHEN-F-006:
    name: 疲労度
    evidence_note: C2 検証文献の紐付け（2026-10-07）：Hart & Staveland 1988 の NASA-TLX 原典 ＋ WCAG 2.2 SC 2.2.6 の標準条項
  WHERE-F-001:
    name: 物理的環境
    evidence_note: 標準条項（ISO 21542 の照明／音響、WCAG 2.2）があり、間接的な支え。C 級を維持
  WHERE-F-002:
    name: 社会的環境
    evidence_note: C2 は Zallio & Clarkson 2021（B&E）の空間社会性研究を紐付け。間接的な支えであり、C 級を維持
  WHERE-F-003:
    name: 空間アクセシビリティ
    evidence_note: C2 は Zallio & Clarkson 2021 ＋ ISO 21542 の空間アクセシビリティ条項を紐付け。間接的な支えであり、C 級を維持
  WHERE-F-004:
    name: リソースの可用性
    evidence_note: 標準条項（ISO 21542 のリソース条項）があり、間接的な支え。C 級を維持
  WHERE-F-005:
