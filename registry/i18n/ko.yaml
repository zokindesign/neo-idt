# i18n 覆盖层 — 韩语（多语言补译工程 v0.1）
#
# 纪律：
#   1) 译文只落本层；卡片与注册表是字符源，重跑生成不覆盖译文
#   2) 逐字保留：标准编号与条款号（ISO/WCAG/GB/GDPR/PIPL）、单位、数值、工具名（NVDA/JAWS/VoiceOver/NASA-TLX 等）
#   3) 不新增任何标准条款或文献引用（新增须逐条 web 核验）
#   4) 文体：ja = 简洁的常体（だ・である調）／ko = 简洁的书面体（평서형）
#   5) 条目 id 必须存在于对应注册表——构建期 build-data.mjs 会因未知 id 直接报错
#
# 本文件由 scripts/merge_i18n.py 按批次生成/合并（勿手工调整头部注释）。
locale: ko

metrics:
  M-HOW-F-001-01:
    name: 네트워크 복원력 등급
    description: 약한 네트워크/오프라인 그라디언트에서 핵심 기능 가용성과 저하된 경험을 자동으로 테스트한다
    measurement_method: 네트워크 조건 속도 제한 시뮬레이션(3G/2G/50% 패킷 손실/오프라인) → 기능 가용성 자동 프로브
    thresholds:
      minimum: 오프라인 시 읽기 전용 기능이 사용 가능하고 명확한 오프라인 안내가 제공된다
      good: 약한 네트워크(3G 수준)에서 핵심 작업을 완수할 수 있다(타임아웃 ≤ 10s)
      excellent: 오프라인 우선(offline-first) 아키텍처와 백그라운드 자동 동기화
  M-HOW-F-002-01:
    name: 저사양 디바이스 성능 하한선
    description: 목표 시장의 최저 사양 디바이스에서 핵심 작업 성능을 자동으로 측정한다
    measurement_method: '최저 사양 디바이스/에뮬레이터 실측: 콜드 스타트, 첫 화면, 핵심 상호작용 응답 시간(P75/P95)'
    thresholds:
      minimum: 콜드 스타트 ≤ 5s이고 핵심 상호작용 응답 ≤ 200ms이다(ISO 9241-112 응답성 실무)
      good: P75 상호작용 응답 ≤ 100ms이고 저메모리 디바이스에서 크래시가 없다
      excellent: 적응형 화질과 디바이스 성능에 따른 계층적 로딩
  M-HOW-F-002-02:
    name: 저사양 디바이스 작업 효율
    description: 최저 지원 사양 디바이스에서 핵심 작업을 완수하는 효율을 기준 디바이스와 비교한다 — ISO 9241-11 효율 측도(목표 달성에 소요되는 자원)의 적용
    measurement_method: 최저 지원 사양 정의 → 동일한 사용자 집단이 최저 사양과 기준 디바이스에서 각각 핵심 작업을 완수 → 완료 시간과 조작 단계 수 비교
    thresholds:
      minimum: 저사양 완료 시간 ≤ 기준 ×1.5
      good: ≤ 기준 ×1.3
      excellent: ≤ 기준 ×1.1이고 기능 저하가 없다
  M-HOW-F-003-01:
    name: 배터리 지속시간 압박 시나리오 커버리지
    description: Rahmati & Zhong 2009 인간-배터리 상호작용 연구가 식별한 고압박 시나리오(저전력 불안/충전 불가 조건/장시간 외출)에 대한 대응 특성을 감사한다
    measurement_method: 고압박 시나리오 체크리스트 감사(절전 모드/저전력 최적화/배터리 예측/다중 충전 방식), 인간-배터리 상호작용 연구의 행동 패턴과 대조
    thresholds:
      minimum: 절전 모드가 제공되고 배터리 상태를 확인할 수 있다
      good: 잔여 사용 시간 예측과 저전력 전략
      excellent: 다중 충전 방식 중복(유선/무선/외부)과 시나리오 적응형 소비 전력 절감
  M-HOW-F-004-01:
    name: 호환성 매트릭스 통과율
    description: 지원 매트릭스(브라우저/OS/AT 버전 조합)에 따라 핵심 흐름을 자동 회귀 테스트한다
    measurement_method: 지원 매트릭스 × 스모크 케이스 자동 회귀; EN 301 549 clause 11 웹 호환성 확인
    thresholds:
      minimum: 선언된 지원 매트릭스가 스모크 케이스를 100% 통과한다
      good: AT 조합(스크린 리더 × 브라우저)에서 핵심 흐름이 통과한다
      excellent: 2개 메이저 버전 하위 호환이며 예외 상황에서 우아하게 저하된다
  M-HOW-F-005-01:
    name: 레거시 환경 적응
    description: 목표 사용자의 기존 기술 환경(구형 OS/구형 브라우저/기업 제한 환경)에 대한 적응 전략과 폴백 방안을 감사한다
    measurement_method: 기존 환경 목록 → 적응/저하 전략 감사 → 저하된 경험 실측
    thresholds:
      minimum: 목표 시장의 주류 기존 환경에 대해 명확한 지원/저하 선언이 있다
      good: 저하 모드에서 핵심 기능이 사용 가능하다(우아한 저하, 백지 화면 아님)
      excellent: 환경 성능에 따라 적응 버전을 자동 배포한다
  M-HOW-F-006-01:
    name: 보조 기술 상호운용성
    description: 스크린 리더/스위치 컨트롤/음성 제어로 핵심 작업을 완수한 실측 통과율
    measurement_method: 주류 AT 조합 실측(WCAG 4.1.2 Name/Role/Value 확인 + 핵심 작업 전 과정을 AT로 조작)
    thresholds:
      minimum: WCAG 4.1.2 실패 0건이고 스크린 리더로 핵심 작업을 완수할 수 있다(A 수준 기준선)
      good: 주류 AT 조합에서 핵심 작업 성공률 ≥ 90%
      excellent: 전체 AT 조합 + 희소 AT(스위치/아이 컨트롤) 통과
  M-HOW-F-007-01:
    name: 출력 채널 중복성
    description: 핵심 정보 출력이 단일 감각 채널에 의존하지 않는다(시각이 색상에 의존하지 않음 — WCAG 1.4.1; 오디오에는 자막/텍스트 대안이 있음)
    measurement_method: 출력 이벤트 × 채널 매트릭스 감사(WCAG 1.4.1 색상 사용, 1.2.2 자막, 1.1.1 비텍스트 콘텐츠 확인)
    thresholds:
      minimum: 색상이 유일한 정보 전달 수단이 아니며(WCAG 1.4.1 A 수준) 미디어에 대안이 있다(1.1.1/1.2.2 A 수준)
      good: 이중 채널 출력이 핵심 정보를 전부 커버한다
      excellent: 사용자가 선호 출력 채널을 선택할 수 있고 채널 간 동기화된다
  M-HOW-F-008-01:
    name: 인증 경로 접근성 중복성
    description: 'WCAG 2.2 SC 3.3.8에 따라 인증 경로를 감사한다: 인지 기능 테스트 면제, 다중 경로 독립성, 비밀번호 관리자 호환성, 복구 절차'
    measurement_method: 인증 경로 × 능력 요구 매트릭스 감사(인지/시각/청각/운동), 3.3.8 항목별 확인(인지 테스트 예외/대안 경로/붙여넣기 허용)
    thresholds:
      minimum: 독립적인 인증 경로 ≥2개이고 강제 인지 기능 테스트가 없다(WCAG 3.3.8 AA 수준)
      good: 계정 복구가 보안 질문에 의존하지 않고 비밀번호 관리자 자동 완성이 차단되지 않는다
      excellent: WebAuthn/매직 링크 등 비밀번호 없는 경로 + 세션 연장 + 경로별 능력 요구 사항 공개
  M-RUL-001-01:
    name: 접근성 기능 사용률
    description: '핵심 접근성 기능(예: 스크린 리더, 키보드 내비게이션, 고대비)의 가용성 통과율'
    measurement_method: WCAG 2.1 AA 성공 기준 항목별 체크리스트 통과율
    thresholds:
      minimum: WCAG 2.1 AA 100% 통과(필수)
      good: AA 100% + 일부 AAA 항목
      excellent: AA 100% + AAA 핵심 항목 + 주류 AT 호환성 검증
  M-RUL-002-01:
    name: 정보주체 권리 대응 준수
    description: 정보주체 권리 절차(동의 철회/열람 및 복사/정정 및 보충/삭제)가 목표 관할 법역의 기한과 편의성 요건을 충족하는지 감사한다
    measurement_method: '데이터 권리 절차 워크스루 × 관할 법역 조항 매트릭스(GDPR: 동의 부여와 동일한 방식으로 철회 용이 [Art.7(3)]/응답은 1개월 이내 [Art.12(3)]/삭제권 [Art.17]; PIPL: 편리한 철회 [제15조]/서비스 거부 금지 [제16조]/고지 [제17조]/정보에 기반한 결정/열람 및 복사/정정/삭제
      [제44-47조])'
    thresholds:
      minimum: 목표 관할 법역의 모든 법정 권리 경로가 존재하고 기한을 충족한다(GDPR 1개월 응답; PIPL 편리한 철회)
      good: 동의 철회 경로가 동의 부여와 같은 페이지·같은 수준에서 도달 가능하고(설정 깊숙이 숨겨지지 않음), 권리 요청에 상태 추적이 있다
      excellent: 권리 행사 전 과정 셀프서비스화 + 처리 기한 내부 SLA가 법정보다 엄격 + 다중 관할 법역 요청 자동 라우팅
  M-RUL-003-01:
    name: 목표 시장 안전 인증 준비도
    description: 제품이 목표 시장의 강제 안전 인증(CE/UL/FDA/MDR/ISO 26262 등)에 대해 조항 수준에서 어느 정도 준비되었는지 감사한다
    measurement_method: '목표 시장 × 인증 체계 매트릭스 감사: 인증 목록 확인 → 설계 문서에서의 안전 요구 사항 추적성 → 사전 적합성 테스트 격차 분석'
    thresholds:
      minimum: 목표 시장의 강제 인증 목록이 확인되고 안전 요구 사항이 설계 문서로 추적 가능하다
      good: 위해 분석과 위험 평가 문서가 완비되고 사전 적합성 테스트를 통과한다
      excellent: 다중 인증 병행 경로(한 번의 설계로 다중 시장 인증 충족) + 인증 유지 절차(재심사 추적)
  M-RUL-004-01:
    name: 라이선스 및 SBOM 완비도
    description: SPDX 표준에 따라 코드/의존성/소재의 라이선스 식별 커버리지와 라이선스 충돌을 감사하며, 라이선스 목록(License List) 단축 식별자 규범을 포함한다
    measurement_method: SCA 도구 스캔(소스 코드 + 의존성) → SPDX 식별자 정규화 → 전염성(copyleft) 라이선스(GPL 계열) 충돌 분석; 소재 라이선스 대장 확인
    thresholds:
      minimum: 100% 컴포넌트에 SPDX 라이선스 식별자가 있다(Unknown 라이선스가 빌드에 유입되지 않음)
      good: SBOM이 기계 판독 가능(SPDX 형식) + 전염성 라이선스 충돌 0건
      excellent: 소재 라이선스 체인 완비(폰트/이미지/오디오 항목별 라이선스 증명) + 라이선스 변경 CI 모니터링
  M-RUL-005-01:
    name: 윤리 심의 체계 완비도
    description: 'Belmont 3원칙과 IEEE EAD 프레임워크에 따라 윤리 심의 체계를 감사한다: 사전 동의(informed consent) 절차, 위험-편익 평가, 공정성 감사, 이의 제기 채널'
    measurement_method: '윤리 체크리스트 감사(Belmont: 존중[자율성과 보호] → 사전 동의, 선행 → 위험-편익 평가, 정의 → 공정한 선택; IEEE EAD: 투명성/책임성/설명 가능성) + 사용자 연구 프로토콜 표본 점검'
    thresholds:
      minimum: 인간 대상 연구에 사전 동의 절차가 있고 IRB/윤리위원회 심의가 기록되어 있다(Belmont 3원칙 항목별 확인 가능)
      good: 알고리즘 의사결정에 공정성 감사 기록 + 다크 패턴 자체 점검 0건 + 윤리 피드백 채널 사용 가능
      excellent: 윤리 평가를 설계 단계로 선행(설계 윤리 워크숍) + AI 시스템이 IEEE EAD 8원칙 체계에 정렬
  M-RUL-006-01:
    name: 산업 진입 규범 매핑도
    description: 제품이 목표 산업의 진입 규범(HIPAA/PCI DSS/FERPA/DO-178C 등)에 대해 조항 수준의 매핑과 준수 상태를 갖추었는지 감사한다
    measurement_method: 목표 산업 × 진입 규범 매트릭스 감사(의료 HIPAA/금융 PCI DSS/교육 FERPA/항공 DO-178C) → 조항 요구 사항에서 설계/절차로의 증거 매핑
    thresholds:
      minimum: 목표 산업의 진입 규범 목록이 확인되고 지정 담당자가 있다
      good: 적용되는 각 조항에 증거 매핑이 있다(설계 문서/테스트 보고서/절차 기록)
      excellent: 산업 규범 변경 추적 체계 + 산업을 넘나드는 제품에서 다중 규범 병행의 매핑 재사용
  M-WHAT-F-001-01:
    name: 작업 단계 복잡도
    description: 핵심 작업의 단계 수, 의사결정 지점 수, 분기 수를 등급화하여 작업 구조 복잡도가 사용자 능력에 부합하는지 판단한다
    measurement_method: 작업 분석 → 단계/의사결정 지점/분기 계수 → 복잡도 등급화(낮음/중간/높음)
    thresholds:
      minimum: 핵심 작업 ≤ 7±2단계이고 의사결정 지점 ≤ 3개(밀러 법칙 합의값)
      good: 단계별 안내와 진행 상황 표시를 제공한다
      excellent: 전문가용 단축 경로를 제공한다(병행 고급 조작)
  M-WHAT-F-001-02:
    name: 핵심 작업 조작 단계 수
    description: 핵심 작업 주 흐름의 조작 단계 수와 의사결정 지점을 계수한다 — ISO 9241-11 효율 측도의 구조화된 대리 지표(단계가 많을수록 인지 및 조작 부하가 높다)
    measurement_method: 작업 분석으로 주 흐름을 분해 → 조작 단계 계수(페이지/양식 제출/핵심 결정) → 병합하거나 생략할 수 있는 단계 식별
    thresholds:
      minimum: 주 흐름 ≤10단계
      good: ≤7단계
      excellent: ≤5단계이고 재작업 루프가 없다
  M-WHAT-F-002-01:
    name: 인지 부하 측정 지표
    description: NASA-TLX 척도로 작업 인지 부하를 측정한다
    measurement_method: NASA-TLX 척도(6개 차원 가중)
    thresholds:
      minimum: NASA-TLX 총점 ≤ 60
      good: NASA-TLX 총점 ≤ 45
      excellent: NASA-TLX 총점 ≤ 30
  M-WHAT-F-002-02:
    name: 작업 완료 시간 백분위
    description: 충분한 표본 크기에서 작업 완료 시간을 수집하고 P5/P50/P95를 계산한다
    measurement_method: P95 완료 시간 / 기대 완료 시간
    thresholds:
      minimum: P95 ≤ 기대 시간 × 2
      good: P95 ≤ 기대 시간 × 1.5
      excellent: P95 ≤ 기대 시간 × 1.2
  M-WHAT-F-003-01:
    name: 오류 관용 및 복구 완비도
    description: 전형적인 조작 오류(잘못된 터치/실수로 삭제/실수로 제출)를 주입하고 복구 가능성, 실행 취소 가용성, 손실 방지를 측정한다
    measurement_method: 오류 주입 테스트 → 실행 취소 성공률/데이터 손실률/복구 단계 수 기록
    thresholds:
      minimum: 파괴적 조작에 확인 절차가 있고 실행 취소가 가능하다(ISO 9241-110:2020 5.6 Use error robustness에 대응)
      good: 오류 메시지에 복구 안내가 포함된다(WCAG 3.3.1/3.3.3)
      excellent: 임시 저장 자동화와 롤백 이력
  M-WHAT-F-003-02:
    name: 오류 복구 성공률
    description: 사용자가 주입된 오류를 만난 후 외부 지원 없이 작업을 복구하는 비율과 소요 시간 — 오류 관용 요구의 직접 측정(ISO 9241-110 오류 관용 원칙, WCAG 3.3.1 오류 식별)
    measurement_method: 전형적 오류 주입(필수 항목 누락/형식 오류/네트워크 중단) → 사용자의 무지원 복구 비율과 평균 복구 소요 시간을 관찰·기록
    thresholds:
      minimum: ≥70% 오류를 무지원으로 복구
      good: ≥85%이고 복구 경로에 명확한 안내가 있다(3.3.1 오류를 텍스트로 설명)
      excellent: ≥95%이고 평균 복구 소요 시간 <30초
  M-WHAT-F-004-01:
    name: 지속성 및 이어하기 완비도
    description: 세션/디바이스를 넘나드는 장시간 작업에 대해 자동 저장, 이어하기 진입점, 상태 동기화, 중복 입력 제거를 감사한다(WCAG 3.3.7)
    measurement_method: 세션 중단/디바이스 전환 실측 → 데이터 저장률/이어하기 성공률; 동일 흐름 내 반복 입력 항목 계수(WCAG 2.2 SC 3.3.7 Redundant Entry A 수준 확인)
    thresholds:
      minimum: 동일 흐름 내에서 이미 알려진 정보를 반복 입력하지 않는다(WCAG 3.3.7 A 수준 필수)
      good: 자동 저장 + 이어하기 진입점이 장시간 작업을 전부 커버한다
      excellent: 디바이스 간 실시간 동기화와 버전 이력
  M-WHAT-F-005-01:
    name: 협업 역할 커버리지
    description: 협업 작업의 역할별 보기, 권한, 병행 편집 충돌 처리, 제3자 협업 보조 도구 호환성을 감사한다
    measurement_method: 역할 × 권한 매트릭스 감사 + 2인 병행 편집 실측 충돌 처리
    thresholds:
      minimum: 협업 작업이 역할별 권한과 조작 이력 기록을 지원한다
      good: 병행 편집 충돌에 병합/잠금 전략이 있다
      excellent: 조력자/대리자가 매끄럽게 참여할 수 있다(WHERE-F-009 피조력 사용에 대응)
  M-WHAT-F-006-01:
    name: 인터럽트 관용 실측
    description: 작업의 핵심 지점에 인터럽트(전화 수신/알림/사람의 방해)를 주입하고 작업 복구율과 인지 재시작 비용을 측정한다
    measurement_method: 인터럽트 주입 실험 → 복구 성공률/재시작 시간/반복 조작 횟수 통계
    thresholds:
      minimum: 인터럽트 후 상태가 유지되고 복구에 처음부터 다시 할 필요가 없다
      good: 복구 지점 안내("하던 작업 계속하기")
      excellent: 인터럽트된 내용을 자동으로 임시 보관하고 상황 안내와 함께 복구한다
  M-WHEN-F-001-01:
    name: 전 시간대 가용성
    description: 핵심 기능의 전 시간대 가용성과 야간 적응(다크 모드/밝기/방해 금지)을 확인한다
    measurement_method: 시간대별 특성 체크리스트 감사 + 야간 시나리오 실측
    thresholds:
      minimum: 핵심 기능이 24h 사용 가능하고 다크 모드가 있다
      good: 야간 방해 금지와 지연 처리 옵션
      excellent: 조도/시간대 적응형 인터페이스
  M-WHEN-F-002-01:
    name: 빈도 계층 적응도
    description: '고빈도/저빈도 사용자 계층별로 차별화 설계(고빈도: 효율 특성; 저빈도: 기억 보조, 최근 기록, 단순화된 인터페이스)를 감사한다'
    measurement_method: 빈도 계층 정의(DAU/MAU 비율 또는 세션 간격 분포) → 계층별 특성 매트릭스 감사; 습관 형성은 Lally et al. 2010 점근선 모델 참조
    thresholds:
      minimum: 저빈도 경로에 기억 보조가 있다(최근 사용/기본값 미리 채우기)
      good: 고빈도 경로에 일괄/단축 조작이 있고, 저빈도 경로에 사용 안내가 있다
      excellent: 개인의 사용 패턴에 따라 난이도와 인터페이스 밀도를 적응시킨다
  M-WHEN-F-003-01:
    name: 계절 적응 감사
    description: 계절/극한 기상/휴일 패턴에서의 기능 유지도를 감사하며, 조도/온도/습도/휴가 분포 등 차원의 적응 특성을 포함한다
    measurement_method: 계절 시나리오 체크리스트(극한 기상/조도 주기/휴일 패턴) × 기능 유지 감사; 광과민 집단은 SAD 연구의 조도 요구와 대조
    thresholds:
      minimum: 극한 기상/온도에서 핵심 기능이 실패하지 않는다(방수/내온 규격 충족)
      good: 조도/온도 변화에 모드 적응이 있다(겨울 다크/여름 고대비/눈부심 방지)
      excellent: 휴일 모드와 계절 콘텐츠를 자동 전환한다
  M-WHEN-F-004-01:
    name: 시간 제한 조정 가능성
    description: 제품 내 모든 시간 제한을 목록화하고 항목별로 해제/조정/연장 가능한지 확인한다; 본질적 예외는 근거를 논증하여 기록해야 한다
    measurement_method: 시간 제한 목록 → WCAG 2.2.1에 따라 항목별 확인(해제/조정/연장) → 본질적 예외 논증 기록
    thresholds:
      minimum: 비본질적 시간 제한 100% 조정 가능(WCAG 2.2.1 A 수준)
      good: 잔여 시간 시각화와 진행 상황 표시
      excellent: 기본적으로 시간 제한이 없다(본질적으로 필요한 경우에만 설정하고 논증을 남긴다)
  M-WHEN-F-004-02:
    name: 시간 부하 점수
    description: NASA-TLX 시간 요구(Temporal Demand) 하위 차원으로 작업 시간 압박의 주관적 부하를 측정한다 — 이 척도의 6개 차원에는 Temporal Demand가 포함되며 0-20점이다(Hart & Staveland 1988)
    measurement_method: 개편 전후로 각각 ≥8명의 대표 사용자를 초청해 동일한 핵심 작업을 완수하고 NASA-TLX를 작성하게 한 뒤 Temporal Demand 차원의 평균을 비교
    thresholds:
      minimum: 시간 요구 평균 ≤15/20
      good: ≤10/20
      excellent: ≤6/20이고 개편 감소폭 ≥30%
  M-WHEN-F-005-01:
    name: 중단점 이어하기 지원
    description: 장시간 작업에 대해 자동 저장, 이어하기 진입점, 소요 시간 예측, 단계별 계획 특성을 감사한다
    measurement_method: 장시간 작업 목록 → 인터럽트 주입 테스트(데이터 저장률/복구 성공률 통계)
    thresholds:
      minimum: 장시간 작업을 자동 저장하고(간격 ≤ 30s 또는 실시간) 이어하기 진입점이 있다
      good: 작업 소요 시간 예측과 단계별 계획 표시
      excellent: 디바이스 간 매끄러운 이어하기(상태 동기화)
  M-WHEN-F-006-01:
    name: 피로 대응 완비도
    description: 피로 감지 신호(연속 오류/조작 둔화/세션 길이)와 대응 기제(휴식 안내/인터페이스 단순화/중단점 저장)를 감사한다
    measurement_method: 피로 신호 × 대응 기제 매트릭스 감사; 장시간 세션 실측 오류율 증가 곡선(NASA-TLX 척도와 대조 검증)
    thresholds:
      minimum: 장시간 세션에 일시정지와 중단점 저장이 있다(피로로 인한 중단으로 데이터가 손실되지 않는다)
      good: 연속 오류/조작 둔화가 능동적 휴식 안내를 유발한다
      excellent: 피로 적응형 인터페이스(정보량 축소/핵심 요소 확대)
  M-WHERE-F-001-01:
    name: 환경 엔벨로프 적응성
    description: 사용 환경 엔벨로프(조도/소음/날씨/손 상태)를 정의하고 엔벨로프 경계에서 기능 유지도를 항목별로 테스트한다
    measurement_method: 환경 엔벨로프 × 기능 매트릭스 실측 또는 추정(조명과 음향은 ISO 21542:2021 cl.5.4/5.7 참조)
    thresholds:
      minimum: '공칭 환경(예: 일반 실내 조명)에서 전 기능 사용 가능'
      good: 강한 빛/낮은 빛과 높은 소음에서 핵심 기능 사용 가능
      excellent: 전 시나리오 자동 적응(밝기/대비/촉각 피드백 전환)
  M-WHERE-F-001-02:
    name: 강한 빛 환경 대비 유지
    description: 강한 빛/높은 주변 조도 조건에서 전경과 배경의 대비가 여전히 WCAG 1.4.3(4.5:1)과 1.4.11(3:1) 요구를 충족하는지 실측한다
    measurement_method: 목표 환경 조도 범위 정의 → 화면 최대 밝기에서 본문과 핵심 UI 컴포넌트의 실제 대비 측정 → 핵심 정보 가독성 기록
    thresholds:
      minimum: 본문 ≥4.5:1이고 UI 컴포넌트 ≥3:1(강한 빛 실측)
      good: minimum 이상으로, 강조/비활성 상태 모두 식별 가능
      excellent: 자동 고대비 또는 밝기 적응 모드를 제공한다
  M-WHERE-F-002-01:
    name: 사회적 상황 기능 감사
    description: 공개/공유 장소의 프라이버시 가림, 음소거, 상황 모드, 다중 역할 전환 특성을 감사한다
    measurement_method: 사회적 상황(공공장소에서 혼자/함께 보기/주변인 존재) × 기능 매트릭스 감사
    thresholds:
      minimum: 공개 장소에서 사용 시 강제 프라이버시 노출이 없다(선택적 음소거/가림)
      good: 상황/역할 빠른 전환을 제공한다
      excellent: 상황 적응형 안내(동행인/위치 인식)
  M-WHERE-F-003-01:
    name: 공간 접근성 준수율
    description: GB 55019 강제 조항(통로 유효 폭 ≥900mm, 경사로, 손잡이 등)과 ISO 21542 통행 조항에 따라 항목별로 실측한다
    measurement_method: 현장 측정 + 체크리스트(GB 55019 ch.2 통행 시설 / GB 50763 / ISO 21542:2021 cl.8 내부 통행과 cl.9 건축 부재)
    thresholds:
      minimum: GB 55019 강제 조항 100% 충족(법규 레드라인)
      good: ISO 21542 권장 조항 ≥ 80% 충족
      excellent: 휠체어 현장 답사에서 전 동선이 관통한다(비상 대피 경로 포함)
  M-WHERE-F-004-01:
    name: 자원 결핍 복원력
    description: 외부 자원 의존(전력/네트워크/인력/소모품)을 열거하고 단일 지점 결핍 시 핵심 기능 유지도를 테스트한다
    measurement_method: 자원 × 기능 매트릭스 + 공급 중단 훈련(정전/오프라인/무지원)
    thresholds:
      minimum: 어느 단일 지점 자원이 결핍되어도 핵심 기능이 사용 가능하다(저하 모드)
      good: 저하 상태를 명확히 안내하고 자동 복구한다
      excellent: 오프라인 우선/자급 아키텍처
  M-WHERE-F-005-01:
    name: 경제적 접근성 계층
    description: 무료 계층/저가 계층/디바이스와 데이터 비용 최적화를 감사하고, 목표 시장의 소득 분포와 금융 포용 데이터와 대조한다
    measurement_method: 가격 계층 × 목표 시장 소득 분포 대조(World Bank 소득 분류/빈곤선 참조); 데이터 사용량과 구형 디바이스 지원 감사
    thresholds:
      minimum: 무료 또는 저가 접근 경로가 있다(핵심 기능에 유료 장벽을 두지 않는다)
      good: 저사양 디바이스와 데이터 절약 모드를 지원한다(오프라인/경량 버전)
      excellent: 지불 능력에 따른 계층별 가격 책정(학생/지역별 가격/공익 라이선싱)
  M-WHERE-F-006-01:
    name: 비상 기능 접근성
    description: 비상 조작(SOS/대피/중단)의 단계 수와 다중 감각 경보를 감사하며, GB 55019 정보 전달과 ISO 21542 소방 대피 조항과 대조한다
    measurement_method: 인터페이스 상태 그래프 순회로 최단 단계 수 측정 + 경보 채널 확인(시각/청각/촉각), 건축 부문은 GB 55019 ch.4와 ISO 21542:2021 cl.11 체크리스트로 실측
    thresholds:
      minimum: 비상 조작 ≤ 3단계이고 경보가 다중 감각이다(적용 범위 내에서 강제 규범을 충족한다)
      good: 로그인/잠금 해제 없이 비상 기능을 사용할 수 있다
      excellent: 오프라인 비상 정보와 훈련 모드
  M-WHERE-F-007-01:
    name: 상황 커버리지 매트릭스
    description: ISO 9241-210 사용 상황 요소(사용자/목표/환경)에 따라 상황 × 기능 매트릭스를 구축하고 실측 커버리지를 확인한다
    measurement_method: 상황 목록 등급화(P0/P1/P2) → 설계 커버리지 확인 → 실측 기록
    thresholds:
      minimum: P0 상황이 100% 정의되고 설계 커버리지가 있다
      good: P0 전부 실측 + P1 데스크 워크스루
      excellent: 극단적/병행 상황(방해, 멀티태스킹) 실측 커버리지
  M-WHERE-F-008-01:
    name: 공유 사용 격리도
    description: 다중 사용자 시나리오의 세션 격리, 데이터 삭제, 청결성, 무감독 내구성을 감사한다
    measurement_method: 공유 시나리오 목록(공용 단말기/가정 공용/다수 열람) × 격리와 위생 특성 감사
    thresholds:
      minimum: 공유 시나리오에 세션 격리와 사용 후 데이터 삭제가 있다
      good: 빠른 사용자 전환과 게스트 모드
      excellent: 다수 열람 적응형 레이아웃과 위생 소재 규범
  M-WHERE-F-009-01:
    name: 협력 대리 지원도
    description: 조력자 대리 완수, 권한 부여, 원격 지원, 조작 기록 특성을 감사한다(피조력 사용 상황)
    measurement_method: 조력자 시나리오 실측(핵심 작업 대리 완수의 권한 부여 기제와 성공률)
    thresholds:
      minimum: 핵심 작업을 조력자가 대리 완수할 수 있다(명확한 권한 부여 기제)
      good: 협력자 보기와 조작 이력 기록
      excellent: 원격 실시간 지원과 음성 협업 안내
  M-WHICH-F-001-01:
    name: 정보 밀도 선호 지표
    description: 여러 정보 밀도 설정에서 사용자의 선택 빈도와 만족도 점수
    measurement_method: 조정 가능한 밀도 단계 수 + 사용자 만족도 점수
    thresholds:
      minimum: 선택 가능한 밀도 단계 2-3개를 제공한다
      good: 4개 이상 단계 또는 사용자 정의 슬라이더를 제공한다
      excellent: 적응형 추천 + 완전 사용자 정의 + 선호 기억
  M-WHICH-F-002-01:
    name: 탐색 깊이 등급 지원
    description: 점진적 공개 계층(기본/고급/전문가)과 '위험 조작 보호'의 등급 설계를 감사한다
    measurement_method: 기능 목록을 계층별로 분류 감사 + 초보/전문가 이중 관점 워크스루
    thresholds:
      minimum: 핵심 경로에 강제 탐색이 없다(최소 클릭으로 바로 접근)
      good: '''간단/상세'' 이중 모드 또는 계층형 진입점을 제공한다'
      excellent: 사용자가 탐색 깊이를 직접 선택하고 선호를 기억한다
  M-WHICH-F-003-01:
    name: 자동화 등급 조정 가능
    description: Parasuraman 2000 10단계 자동화 모델에 따라 자동화 등급의 선택 가능성을 감사하고, 각 등급에 대한 사용자의 신뢰와 개입 빈도를 측정한다
    measurement_method: 자동화 기능 × 등급 매트릭스 감사 + 사용자 실측(수동 개입률/실행 취소 사용률/수용도 척도)
    thresholds:
      minimum: 모든 자동화 의사결정을 실행 취소하거나 재정의할 수 있다(ISO 9241-110 5.5 제어 가능성에 대응)
      good: 자동화 등급을 사용자가 선택할 수 있다(완전 자동/반자동/수동 등급)
      excellent: 시스템 능력 공개 + 개입 세분도 사용자 선택(항목별/일괄)
  M-WHICH-F-003-02:
    name: 자동화 제어 가능 커버리지
    description: 시스템이 자동으로 실행하는 조작을 목록화하고, 각 항목이 인지 가능한 일시정지/실행 취소/파라미터 조정을 제공하는지 점검한다 — ISO 9241-110 대화 원칙의 제어 가능성(controllability)에 대응
    measurement_method: 모든 자동 실행 행위(자동 제출/자동 결제/자동 이동/자동 채우기)를 나열 → 항목별로 확인, 실행 취소 또는 파라미터 조정 진입점이 있는지 확인
    thresholds:
      minimum: 100% 자동 조작을 실행 취소할 수 있거나 사전 확인이 있다
      good: minimum 이상으로, 상호작용 리듬과 순서를 사용자가 제어할 수 있다
      excellent: 자동화 정도를 사용자 선호에 따라 개인화 설정할 수 있다
  M-WHICH-F-004-01:
    name: 가시성 세분도 제어
    description: 소셜 시나리오의 가시성 옵션 세분도(전역/그룹/1회)와 상태 노출 기본값을 감사한다
    measurement_method: 가시성 옵션 매트릭스 감사 + 기본값 프라이버시 성향 확인(기본값은 최소 노출이어야 한다)
    thresholds:
      minimum: 가시성 스위치를 제공하고 기본값이 최소 노출이다
      good: 그룹/1회 가시성 세분도를 선택할 수 있다
      excellent: 게시 전 가시성 미리보기("누가 이 글을 볼 수 있는가")
  M-WHICH-F-005-01:
    name: 스타일 선택도와 일관성
    description: 공식 테마/사용자 정의 능력, 그리고 스타일 전환 시 기능 위치 안정성(재학습 비용 감소)을 감사한다
    measurement_method: 테마와 사용자 정의 능력 목록 감사 + 전환 전후 기능 위치 일관성 워크스루
    thresholds:
      minimum: ≥2개 공식 테마를 제공하고 기본값이 범용적이다(가독성 높은 중립적 스타일)
      good: 핵심 사용자 정의 능력(글자 크기/대비/모션 전환) + 전환 후 기능 위치 불변
      excellent: 스타일 선호를 플랫폼 간 동기화하여 기억한다
  M-WHICH-F-005-02:
    name: 미학 만족도 점수
    description: 대표 사용자가 시각 스타일에 대해 매긴 주관적 만족도 점수 — ISO 9241-11 만족도(satisfaction) 측도의 적용(선호에는 옳고 그름이 없으며, 측정 대상은 목표 인구의 수용도이다)
    measurement_method: ≥8명의 대표 사용자를 초청해 실제 작업 후 3문항 만족도 설문(1-5점)을 작성하게 하고 개편 전후를 비교
    thresholds:
      minimum: 평균 ≥3.5/5
      good: ≥4.0/5
      excellent: ≥4.3/5이고 추천 의향이 음수가 아니다
  M-WHICH-F-006-01:
    name: 입력 모달리티 중복도
    description: 핵심 조작의 입력 모달리티 계수(터치/키보드/음성/제스처/물리 버튼), 단일 모달리티가 작동하지 않을 때 대안 경로가 있는지 여부
    measurement_method: 핵심 조작 × 모달리티 매트릭스 감사; WCAG 2.5.1 포인터 제스처와 2.1.1 키보드에 따라 대안 경로 확인
    thresholds:
      minimum: 핵심 조작 ≥ 2가지 모달리티(키보드 등가 포함, WCAG 2.1.1 A 수준)
      good: ≥ 3가지 모달리티이고 정밀 동작이 필요 없는 모달리티를 포함한다(음성/큰 버튼)
      excellent: 모달리티를 자유롭게 전환하고 선호를 기억한다
  M-WHICH-F-007-01:
    name: 피드백 다채널 중복성
    description: 핵심 피드백(성공/실패/진행/경고)의 다중 감각 채널 중복 감사(시각 + 청각 + 촉각 중 최소 이중 채널)
    measurement_method: 피드백 이벤트 × 채널 매트릭스 감사; WCAG 4.1.3 상태 메시지(AA)로 스크린 리더 낭독 확인
    thresholds:
      minimum: 핵심 피드백이 단일 감각 채널에 의존하지 않는다(WCAG 1.4.2 오디오 제어 관련 + ISO 9241-110 5.2 자기 설명성)
      good: 이중 채널 피드백이고 사용자가 선호 채널을 선택할 수 있다
      excellent: 삼중 채널 중복과 감각 대체(섬광 → 진동)
  M-WHICH-F-008-01:
    name: 상호작용 모드 선택 가능성
    description: 상호작용 모드 목록(직접 조작/명령/제스처/음성/단축키)의 공존성, 기본값 선택 가능성, 전환 비용을 감사한다
    measurement_method: 모드 × 작업 매트릭스 감사 + 모드 전환 단계 수와 재학습 비용 평가
    thresholds:
      minimum: 핵심 작업을 ≥2가지 모드로 사용할 수 있고 기본 모드를 사용자가 선택할 수 있다
      good: 전환이 ≤1단계이고 강제 모드가 없다(터치 스크린에 단축키 등가를 유지한다)
      excellent: 모드 선호 기억과 상황 인식 추천(운전 → 음성)
  M-WHICH-F-009-01:
    name: 알림 제어 가능성
    description: 알림의 세분도 제어(항목별 스위치/방해 금지/일괄 무음)와 긴급 알림 관통 전략을 감사한다
    measurement_method: 알림 유형 × 제어 세분도 매트릭스 감사 + 방해 금지 실측(긴급 항목이 관통할 수 있는지)
    thresholds:
      minimum: 알림을 항목별로 켜고 끌 수 있고 전역 무음을 제공한다
      good: 방해 금지 시간대/시나리오 규칙(긴급 예외 포함)
      excellent: 알림 요약 병합과 우선순위 사용자 정의
  M-WHO-F-001-01:
    name: 능력 요구 배제율
    description: Cambridge 배제 산출법(Waller/Langdon/Clarkson 2010)에 기반하여 제품 사용을 작업으로 분해하고 각 작업의 능력 요구를 등급화하여, 모집단 능력 분포와 대조해 배제되는 사용자 비율을 추정한다
    measurement_method: 작업 분석 → 5개 능력 요구 등급화(시각/청각/손재주/도달/이동) → 1996/97 DFS 능력 분포와 대조해 배제율 계산
    thresholds:
      minimum: 어느 핵심 작업이든 배제율 ≤ 10%
      good: 핵심 작업 배제율 ≤ 5%
      excellent: ≤ 2%이며 다중 장애 중첩 분석을 포함한다
  M-WHO-F-001-02:
    name: 보조 기술 호환성
    description: 상호작용 컴포넌트가 프로그래밍 방식으로 접근 가능한 형태로 이름/역할/값을 노출하는지, 상태 변화를 보조 기술(스크린 리더, 스위치 컨트롤)이 인지할 수 있는지 점검한다 — 능력 대체 채널의 기초 보장
    measurement_method: NVDA/VoiceOver + 키보드만으로 핵심 작업을 순회하며 컨트롤별 이름/역할/상태 낭독 가능성을 기록; 동적 피드백이 실시간으로 낭독되는지 점검(WCAG 4.1.2/4.1.3)
    thresholds:
      minimum: 핵심 작업의 모든 컨트롤에 낭독 가능한 이름과 역할이 있다(4.1.2)
      good: minimum 이상으로, 상태 변화를 실시간으로 낭독한다(4.1.3)
      excellent: NVDA/JAWS/VoiceOver 세 가지 주류 스크린 리더에서 차단급 문제 0건
  M-WHO-F-002-01:
    name: 사용자 페르소나 다양성 편차
    description: 조사 표본과 persona 분포를 목표 시장 인구 통계(연령대/성별/지역)와 대조하고 대표성 편차를 계산한다
    measurement_method: persona vs 목표 인구 통계 대조표 + 교차 차원 커버리지 점검
    thresholds:
      minimum: 연령/성별/지역 3개 차원 모두 대표성이 있고 단일 페르소나가 없다
      good: 각 차원의 목표 인구 대비 편차 ≤ 20%
      excellent: '편차 ≤ 10%이며 교차 취약 조합(예: 고령 × 낮은 기술 리터러시)을 커버한다'
  M-WHO-F-003-01:
    name: 건강 상태 적응 커버리지
    description: 설계가 흔한 건강 영향 범주(감각/운동/만성 통증/피로/복약 기간 변동)에 대한 적응을 어느 정도 완성했는지 감사한다
    measurement_method: 건강 영향 범주 × 적응 조치 매트릭스 감사(WCAG AA 기준선 확인 포함)
    thresholds:
      minimum: 감각 및 운동 범주 적응 100%(WCAG AA 기준선)
      good: 만성 질환의 흔한 영향(피로/통증/인지 변동)에 명시적 설계가 있다
      excellent: '저빈도 고위험 상태(예: 광과민성 간질)에 전용 보호가 있다'
  M-WHO-F-004-01:
    name: 다중 모달리티 제시 완비도
    description: 핵심 콘텐츠의 이중 채널 이상 제시(도해 + 영상 + 상호작용 훈련)를 감사하고, Pashler 2008 결론에 따라 설계 대응을 스타일 적응이 아닌 다중 모달리티 제시로 규정한다
    measurement_method: 핵심 콘텐츠 × 제시 모달리티 매트릭스 감사(콘텐츠를 ≥2개 채널로 접근할 수 있는지)
    thresholds:
      minimum: '핵심 조작 안내에 ≥2개 모달리티가 있다(예: 도해 + 영상)'
      good: 사용자가 기본 학습/도움말 모달리티를 선택할 수 있다
      excellent: 전체 콘텐츠가 ≥2개 모달리티이고 속도를 제어할 수 있다(반복/빨리 감기/느리게 재생)
  M-WHO-F-005-01:
    name: 정서 경험 3계층 감사
    description: Norman 3계층(본능/행동/반성)에 따라 정서 접점을 감사하고 사용자의 정서 반응을 측정한다
    measurement_method: 정서 접점 맵 × 3계층 분류 감사 + PANAS/SAM 척도 측정 + SDT 3요구 충족도 평가
    thresholds:
      minimum: 핵심 흐름에 좌절을 유발하는 지점이 없다(PANAS 부정 점수가 기준선보다 높지 않다)
      good: 핵심 접점에 긍정 설계(성취감/신뢰감)가 있고 SDT 3요구에 명시적 지원이 있다
      excellent: 임파워먼트 순간 설계(지각 가능한 진전/통제) + 피크-엔드 법칙 최적화
  M-WHO-F-006-01:
    name: 감각 강도 조정 가능성
    description: 각 감각 채널(시각/청각/촉각)의 강도 조절 능력을 감사하고, HSP 척도의 민감도 분포를 참조하여 조절 범위를 설계한다
    measurement_method: 감각 채널 × 조절 가능 특성 매트릭스 감사(밝기/색온도/음량/진동/모션 강도), HSP 민감도 분포와 대조해 조절 범위 설정
    thresholds:
      minimum: 주요 감각 채널의 강도를 조절할 수 있다(밝기/음량/진동)
      good: 모션을 끌 수 있고(prefers-reduced-motion 응답) 자극 없는 모드(저감각 모드)를 제공한다
      excellent: 전 채널 연속 조절 가능 + 상황별 감각 구성 기억
  M-WHO-F-006-02:
    name: 다중 감각 중복 커버리지
    description: 정보가 단일 감각 채널만으로 전달되는지 점검한다 — WCAG 1.4.1(색상을 유일한 시각 수단으로 삼아서는 안 된다)과 1.3.3(설명이 형상/색상/위치/소리 등 감각적 특성에만 의존해서는 안 된다)
    measurement_method: 인터페이스와 문서에서 색상/형상/위치/소리만으로 의미를 전달하는 정보 지점을 목록화 → 지점별로 중복 부호화(텍스트/아이콘/패턴/음성)가 제공되는지 확인
    thresholds:
      minimum: 색상만으로 전달하는 정보 지점 0개
      good: 어떤 단일 감각 채널만으로 전달하는 정보 지점도 0개
      excellent: 핵심 정보에 다중 모달리티 대안을 제공한다(시각 + 청각/촉각)
  M-WHO-F-007-01:
    name: 무경험 첫 시도 성공률
    description: '저기술 리터러시 사용자(예: 스마트 기기를 처음 사용하는 고령자)를 모집하여 무지원으로 핵심 작업을 완수하게 한다'
    measurement_method: 무지원 사용성 테스트, 첫 시도 작업 성공률, 도움 요청 횟수, 완료 시간 기록
    thresholds:
      minimum: 핵심 작업 무지원 성공률 ≥ 80%
      good: ≥ 90%이며 평균 도움 요청 ≤ 1회
      excellent: ≥ 95%이며 완료 시간 ≤ 숙련 사용자 P95
  M-WHO-F-008-01:
    name: 문화 현지화 감사
    description: 아이콘 은유, 색채 상징, 이름/날짜/주소 형식, 읽기 방향에 대해 문화 간 감사를 수행한다
    measurement_method: 목표 문화 체크리스트 항목별 감사 + ≥2개 문화 배경 사용자 검증
    thresholds:
      minimum: 불쾌감을 주는 상징이 없고 현지화 형식(이름/날짜/주소)을 지원한다
      good: 아이콘과 은유가 ≥2개 문화 배경 사용자에 의해 검증되었다
      excellent: RTL 레이아웃과 모든 목표 시장 언어를 지원한다
  M-WHO-F-009-01:
    name: 신경다양성 특성 커버리지
    description: 모션 감소, 예측 가능한 레이아웃, 평이한 언어, 콘텐츠 청킹, 시간 압박 없는 기본값 등 신경다양성 친화 특성을 점검한다
    measurement_method: 신경다양성 설계 체크리스트 감사(모션 전환/레이아웃 일관성/언어 평이성/콘텐츠 청킹/시간 제한 기본값), prefers-reduced-motion 응답 확인 포함
    thresholds:
      minimum: 모션 감소 옵션을 제공하고 레이아웃이 예측 가능하게 유지된다
      good: 평이한 언어와 콘텐츠 청킹이 기준을 충족한다
      excellent: 감각 강도를 전면 조절할 수 있고 집중 모드를 제공한다
  M-WHO-F-010-01:
    name: 인지 요구 배제율
    description: Cambridge 배제 산출의 인지 차원(기억/주의/이해)을 사용하여 작업의 인지 요구를 등급화하고 인지 배제율을 추정한다
    measurement_method: 작업 인지 요구 등급화(동시 기억 항목 수/단계 수/의사결정 지점 계수) → 능력 분포와 대조해 배제 추정
    thresholds:
      minimum: 핵심 작업의 동시 기억 항목 ≤ 4이고 단계를 청킹할 수 있다
      good: 인지 배제 추정 ≤ 5%
      excellent: ≤ 2%이며 미리 채우기/진행 안내 등 부담 경감 보조를 제공한다
  M-WHO-F-011-01:
    name: 언어 접근성 감사
    description: 페이지 언어 선언(lang), 콘텐츠 읽기 수준, 평이한 언어 대안의 접근성을 확인한다
    measurement_method: lang 속성 점검(WCAG 3.1.1/3.1.2) + 콘텐츠 읽기 수준 산출 + 목표 언어 커버리지 목록
    thresholds:
      minimum: lang 선언이 올바르고 목표 시장 언어를 100% 커버한다
      good: 핵심 콘텐츠 읽기 수준 ≤ 중학교 수준
      excellent: 평이한 언어 버전과 용어집을 제공한다
  M-WHO-F-012-01:
    name: 비텍스트 대안 커버리지
    description: 핵심 작업에 도해/영상/음성 등 비텍스트 대안 안내가 있는지, 핵심 문구가 통제 어휘를 사용하는지 점검한다
    measurement_method: 작업 × 대안 채널 매트릭스 감사 + 어휘 복잡도 표본 점검
    thresholds:
      minimum: 핵심 작업에 ≥1개 비텍스트 안내가 있다(도해 또는 영상)
      good: 핵심 조작 어휘가 통제되어 있다(상용 어휘 목록 내)
      excellent: 모든 작업을 음성 안내만으로 완수할 수 있다
  M-WHO-F-013-01:
    name: 인체 치수 적합 백분위
    description: ANSUR II와 GB/T 10000-2023 인체 데이터로 핵심 치수(도달/여유 공간/파지/시거리)의 모집단 백분위 커버리지를 확인한다
    measurement_method: '핵심 치수 × 모집단 백분위 대조(먼저 목표 모집단에 따라 데이터셋 선택: 중국은 GB/T 10000-2023, 북미는 ANSUR II 참조)'
    thresholds:
      minimum: 핵심 치수가 목표 모집단 P5–P95를 커버한다
      good: P1–P99 커버
      excellent: 핵심 치수를 연속 조절할 수 있다(시트/스탠드/스트랩 등)
  M-WHO-F-014-01:
    name: 프라이버시 제어 완비도
    description: 권한 세분도, 데이터 삭제/내보내기 진입점, 게스트 모드, 보존 정책을 감사하고 사용자 권리 요청 응답 소요 시간을 확인한다
    measurement_method: 프라이버시 제어 체크리스트 감사 + 권리 요청 절차 훈련(GDPR/PIPL 적용 범위 내)
    thresholds:
      minimum: 권한을 항목별로 켜고 끌 수 있고 계정 삭제 진입점에 도달할 수 있다(법정 응답 기간 내)
      good: 데이터 내보내기와 시나리오별 권한 부여를 제공한다
      excellent: 게스트/익명 모드와 로컬 처리 옵션을 제공한다
  M-WHO-F-014-02:
    name: 데이터 수집 최소화
    description: 제품이 수집하는 개인정보가 핵심 기능 필요성과 정렬되어 있는지 감사한다 — GDPR 제5(1)(c)조 데이터 최소화(adequate, relevant and limited to what is necessary)와 PIPL 최소 필요 원칙의 적용
    measurement_method: 양식별/권한별로 수집 필드를 목록화 → 필드별로 기능 필요성을 표기 → 비필수 수집 필드 비율을 계산하고 용도 설명을 확인
    thresholds:
      minimum: 핵심 기능과 무관한 필수 개인정보가 없다
      good: 비필수 수집 필드 100%에 용도 설명이 첨부되어 있다
      excellent: 비필수 수집이 0건이고 내보내기와 삭제 채널을 제공한다
  M-WHO-F-015-01:
    name: 성별 포용 완비도
    description: 성별 필드의 중립성, 호칭/대명사 설정 가능성, 사이즈 체계 중립성을 감사하고 트랜스젠더/논바이너리 사용자를 초청해 검증한다
    measurement_method: '성별 관련 접점 체크리스트 감사(양식/호칭/공간/사이즈) + 트랜스젠더 및 논바이너리 사용자 실측(Haimson 2016/2023 방법론: 정체성 변경 시나리오와 커뮤니티 참여 설계)'
    thresholds:
      minimum: 성별 필드가 선택 사항이고 논바이너리/밝히지 않음 옵션을 포함한다; 대명사를 설정할 수 있다
      good: 과거 데이터 변경 경로가 있다(정체성 전환 후 기록 갱신 가능)
      excellent: 전 성별 공간 옵션 + 신체 치수 기반 사이즈(성별 이분법이 아님)
  M-WHY-F-001-01:
    name: 포용성 투입산출 프레임워크
    description: 포용성 투입의 정량 기록(준수 비용/개발 투입)과 편익 프레임워크(시장 규모/개조 회피/브랜드 가치)를 감사하고, ROD 2024 시장 데이터와 대조한다
    measurement_method: '포용성 투입 대장 × 편익 차원 대조(ROD 2024: 전 세계 장애 시장 $18.3T/미국 PWD 가처분 소득 $1.3T/인구 63% 연관)'
    thresholds:
      minimum: 포용성 투입에 별도 기록이 있다(일반 개발 비용에 섞이지 않음)
      good: 생애주기 비용 비교가 있다(사전 포용 설계 vs 사후 개조 비용)
      excellent: 포용성 편익을 비즈니스 케이스에 반영한다(시장 포지셔닝/차별화/조달 우위)
  M-WHY-F-002-01:
    name: 포용성 시장 포지셔닝 감사
    description: 제품 포지셔닝에서 포용성 가치 제안의 명시성(목표 인구 커버리지 선언/차별화 설명/접근성 능력 공개)을 감사한다
    measurement_method: 포지셔닝 문서 × 포용성 가치 제안 체크리스트; ROD 2024의 63% 인구 연관 데이터와 대조해 목표 인구 정의 완비성을 평가한다
    thresholds:
      minimum: 목표 인구 정의가 합리적으로 도달 가능한 집단을 배제하지 않는다("한정"식 배제 선언이 없다)
      good: '포용성 능력이 가치 제안에 명시되어 있다(예: 접근성 자격/고령친화 인증)'
      excellent: 포용성을 핵심 차별화 판매 포인트로 삼고 조달 자격으로 뒷받침한다
  M-WHY-F-003-01:
    name: 다크 패턴 감사
    description: Mathur et al. 2019 분류학에 따라 유도성 설계(카운트다운 압박/가짜 재고/숨긴 해지/강제 번들)를 감사한다
    measurement_method: 핵심 흐름을 화면별로 다크 패턴 체크리스트(7대 범주 15유형)와 대조 감사; 해지 절차 단계 수와 가입 절차 단계 수의 대칭성 실측
    thresholds:
      minimum: 구독 해지 단계 ≤ 가입 단계이고 숨긴 해지가 없다(EU 소비자 보호 지침 실무)
      good: 전체 흐름에 Mathur 분류학의 기만형 패턴이 없다
      excellent: 핵심 결정에 냉각 기간/철회 기제가 있다
  M-WHY-F-004-01:
    name: 지속가능성 지표 커버리지
    description: 삼중 하한선(Elkington 1997)과 대조하여 환경 차원의 정량 목표와 데이터 공개를 감사한다
    measurement_method: 에너지 효율/수명/수리 가능성/재활용 가능성 4개 항목 점검; 유전 제품은 에너지 효율 라벨과 탄소 발자국 공개 확인
    thresholds:
      minimum: 적용되는 환경 규제를 준수한다(RoHS/에너지 효율 표준의 강제 항목)
      good: 에너지 효율과 수리 가능성 데이터를 공개한다(수리권 지침 실무)
      excellent: 전 생애주기 탄소 발자국 공개와 재활용 경로
  M-WHY-F-005-01:
    name: 이해관계자 갈등 해결
    description: Freeman 1984 이해관계자 식별 프레임워크에 따라 다자 요구 갈등의 명시적 기록과 해결 전략을 감사한다
    measurement_method: 이해관계자 맵 → 요구 갈등 등록부 → 해결 전략 기록 감사(의사결정 추적 가능)
    thresholds:
      minimum: 핵심 사용자와 지불 주체의 요구 갈등이 명시적으로 기록되어 있다
      good: 각 갈등에 판정 근거와 영향받는 당사자 설명이 있다
      excellent: 취약 이해관계자(최종 사용자 중 취약 집단)에 대변 기제가 있다
facets:
  FAC-WHO-F-001-01:
    name: 시각 능력
    definition: 시각 정보를 지각하는 데 필요한 시력, 시야, 색각 및 광적응 능력(청각, 신체 조작 및 인지 처리는 제외)
  FAC-WHO-F-001-02:
    name: 청각 능력
    definition: 청각 정보를 지각하는 데 필요한 청력과 소리 분별 능력(시각, 신체 조작 및 인지 처리는 제외)
  FAC-WHO-F-001-03:
    name: 운동 능력
    definition: 조작을 완수하는 데 필요한 사지의 힘, 정밀 동작, 도달 범위 및 이동 능력으로, 배제 측정법의 조작/도달/이동 세 범주에 해당한다(감각 채널과 인지 처리는 제외)
  FAC-WHO-F-001-04:
    name: 언어 및 인지 능력
    definition: 정보를 이해하고 표현하는 데 필요한 언어 수용/산출 능력 및 주의, 기억, 실행 등 인지 처리 능력(감각 채널과 신체 조작은 제외)
factors:
  HOW-F-001:
    name: 네트워크 조건
    evidence_note: 표준 조항(WCAG 2.2/EN 301 549 네트워크 관련)은 있으나 차원 특이적 연구가 부족함; 간접 지지, C 등급 유지
  HOW-F-002:
    name: 기기 성능
    evidence_note: 표준 조항(WCAG 2.2 목표 크기 등)이 있으며 기기 능력에 대한 간접적 표준 지지; C 등급 유지
  HOW-F-003:
    name: 전원과 배터리 지속시간
    evidence_note: 'C4a 검증 문헌 연결(2026-10-08): Rahmati & Zhong 2009 인간-배터리 상호작용 실증 연구(MobileHCI''07+PMC 확장), 직접 연구 지지'
  HOW-F-004:
    name: 호환성 요구사항
    evidence_note: 표준 조항(EN 301 549 호환성 요건)은 있으나 독립적 연구가 부족함; C 등급 유지
  HOW-F-005:
    name: 기술 환경
    evidence_note: 표준 조항(EN 301 549 개방성 조항)이 있으며 간접 지지; C 등급 유지
  HOW-F-006:
    name: 보조 기술 호환성
    evidence_note: 표준 조항(WCAG 2.2 SC 4.1 호환, EN 301 549 clause 11 AT 호환)이 있으며 간접 지지; C 등급 유지
  HOW-F-007:
    name: 입출력 기능
