guides:
  G-HOW-F-001:
    name: 네트워크 복원력 설계 가이드
    patterns:
    - name: 오프라인 우선 아키텍처
      description: 핵심 기능은 오프라인 상태에서 완수할 수 있도록 설계한다(로컬 캐시/Service Worker/충돌 병합). 네트워크는 강화 수단일 뿐 전제 조건이 아니다
      domain: digital
      example: 노트 앱은 오프라인에서도 작성·조회가 가능하고, 네트워크 연결 시 조용히 동기화된다
      refs:
      - STD-W3C-WCAG22:1.4.10
    - name: 적응형 미디어
      description: 미디어 품질은 실시간 대역폭에 맞추어 조정한다(비트레이트/해상도/로딩량). 약한 네트워크에서는 콘텐츠 도달성을 우선 보장한다
      domain: digital
      example: 동영상은 2G 환경에서 자동으로 오디오+자막 모드로 전환된다
    - name: 우아한 성능 저하 경로
      description: '네트워크를 사용할 수 없을 때 기능은 마비되지 않고 저하된다: 읽기 전용 사용, 전송 대기열, 로컬 대체 수단을 제공한다'
      domain: digital
      example: 약한 네트워크에서는 양식을 로컬에 임시 저장하고 『네트워크 복구 후 자동 제출됩니다』라고 안내한다
    - name: 상태의 정직한 표시
      description: 네트워크 상태와 예상 대기 시간을 명시적으로 알린다(현재 속도/예상 소요 시간/실패 원인). 모든 것이 정상인 척하지 않는다
      domain: digital
      example: 『현재 네트워크가 느려 이미지를 저화질로 불러옵니다』
    anti_patterns:
    - name: 클라우드 단일 의존
      description: 모든 기능이 실시간으로 클라우드에 요청한다
      consequence: 지하철, 엘리베이터, 지하실, 요금 미납——현대 생활의 단절 지점은 생각보다 많다. 네트워크가 끊기면 벽돌이 되는 제품은 네트워크 변동 앞에서 전면 붕괴한다
    - name: 백지 로딩
      description: 약한 네트워크에서 무한 로딩만 돌고 어떠한 저하 처리도 없다
      consequence: 3초 동안 피드백이 없으면 이탈률이 절반을 넘는다. 완벽한 공백보다 저하된 콘텐츠가 낫다
  G-HOW-F-002:
    name: 저사양 기기 친화 가이드
    patterns:
    - name: 성능 예산제
      description: 핵심 기기 등급별로 성능 예산(메모리/첫 화면 시간/패키지 크기)을 설정하고, CI에서 예산 초과 시 실패 처리한다. 성능은 최적화가 아니라 기능이다
      domain: digital
      example: '목표 2GB 메모리 기종: 콜드 스타트 ≤3초, 패키지 ≤80MB'
      refs:
      - STD-EN-301549:8
    - name: 역량 감지 적응
      description: 실행 시 기기 역량을 감지하여 기능을 동적으로 조정한다(효과/해상도/백그라운드 동시성). 구형 기기도 핵심 기능은 온전히 제공받는다
      domain: digital
      example: 저사양 기기에서는 배경 흐림 등 장식적 렌더링을 끄되 기능은 줄이지 않는다
    - name: 외부 기기 역량 확장
      description: 기기 자체 역량이 부족할 때 외부 확장(외장 키보드/USB 메모리/모니터)을 지원하고, 경로를 막아버리지 않는다
      domain: digital
      example: 태블릿은 외장 키보드 연결 시 데스크톱급 조작으로 전환된다
    - name: 절전 모드 기본 내장
      description: '절전 모드를 일등 시민 옵션으로 제공한다: 폴링/밝기/렌더링을 낮추되 기능은 온전히 유지한다'
      domain: digital
      example: 배터리가 부족할 때 불필요한 애니메이션과 백그라운드 새로고침을 끈다
      refs:
      - STD-GB-T-45122:6.4
    anti_patterns:
    - name: 플래그십 기기 가정
      description: 팀이 보유한 고급 기기를 기준으로 검수한다
      consequence: 목표 시장의 중간 기종이 진짜 기준이다. 플래그십에서 매끄러운 것이 보급형 기기에서는 멈춰버린다
    - name: 기능 차별 사슬
      description: 구형 기기를 저하 지원이 아니라 아예 지원하지 않는다
      consequence: 기기 수명은 5~10년이며, 강제 퇴출은 저소득 사용자를 배제한다. 점진적 저하는 디지털 환경 보호다
  G-HOW-F-003:
    name: 배터리 지속시간과 전원 가이드
    patterns:
    - name: 배터리 잔량 투명화
      description: 배터리 상태와 남은 사용 시간 예측을 항상 표시하고 조회 가능하게 한다. 저전력 경고는 단계별로 미리 알린다
      domain: digital
      example: 백분율만이 아니라 『예상 잔여 4시간』을 표시한다
      refs:
      - STD-GB-T-45122:6.4
    - name: 절전 모드 단계화
      description: 절전을 단계로 나눈다(경량/중량/극한 생존). 극한 단계에서는 핵심 기능(통화/구조 요청)을 보존한다
      domain: digital
      example: '배터리 5%에서 극한 모드 진입: 통화와 위치만 유지'
    - name: 다중 충전 방식 중복 확보
      description: 범용 충전 표준(USB-C PD/무선)을 지원하고, 전용 인터페이스는 변환 방안을 마련한다
      domain: industrial
      example: 기기는 사설 인터페이스가 아닌 USB-C를 사용하며, 변환 어댑터를 함께 제공한다
    - name: 핵심 기능 저전력 보장
      description: 안전 관련 기능(낙상 감지/긴급 호출)에는 독립적인 저전력 보장 경로를 둔다
      domain: digital
      example: 긴급 기능은 독립 전원 영역이나 초저전력 칩으로 구현한다
    anti_patterns:
    - name: 배터리 불안 유발 설계
      description: 높은 빈도로 깨우고 백그라운드에 상주하며 소리 없이 전력을 소모한다
      consequence: 사용자는 전력 절약을 위해 앱을 삭제한다. 배터리 지속시간은 가장 실제적인 사용자 고통 중 하나다(Rahmati & Zhong 2009 인간-배터리 상호작용 연구)
    - name: 사설 충전 생태계
      description: 전용 충전기/사설 프로토콜
      consequence: 충전기를 잃으면 기기가 마비된다. 범용 표준은 전원 포용의 최소선이다
  G-HOW-F-004:
    name: 호환성 매트릭스 가이드
    patterns:
    - name: 지원 매트릭스 명시화
      description: 플랫폼×브라우저×OS 버전×보조기술 지원 매트릭스를 문서화하고 지속적으로 테스트한다. 지원 경계를 사용자에게 명시적으로 알린다
      domain: digital
      example: '제품 페이지에 지원 매트릭스 공개: Chrome/Firefox/Safari 최근 두 개 주요 버전'
      refs:
      - STD-EN-301549:6
    - name: 점진적 향상
      description: 기본 기능은 누구나 사용할 수 있고, 강화 기능은 기기별로 점진적으로 더한다. 핵심은 최신 기능에 의존하지 않는다
      domain: digital
      example: 레이아웃은 안정적인 CSS로 구현하고, 신규 기능은 덧붙이는 역할만 한다
    - name: 표준 API 우선
      description: 표준화된 Web/시스템 API를 사용하고, 사설 기능과 구식 플러그인(Flash식 막다른 길)을 피한다
      domain: digital
      example: 네이티브 HTML5 컨트롤 + ARIA 보완을 사용하고, 사설 컨트롤을 만들지 않는다
    - name: 보조기술 테스트 상시화
      description: 주요 보조기술 조합(NVDA+Firefox, JAWS+Chrome, VoiceOver, TalkBack)을 CI 회귀 테스트에 포함한다
      domain: digital
      example: 매 릴리스마다 보조기술 스모크 테스트 케이스 집합을 실행한다
    anti_patterns:
    - name: 최신 버전 지상주의
      description: 최신 플랫폼 버전만 지원한다
      consequence: 기업 환경, 개발도상국 시장, 신중한 사용자는 대거 구버전에 머문다. 지원 매트릭스를 아래로 확장하는 것이 위로 신버전을 쫓는 것보다 중요하다
    - name: 단일 생태계 종속
      description: 단일 플랫폼/생태계에 깊이 의존한다
      consequence: 생태계 정책이 바뀌면(퇴출/인터페이스 변경) 전멸한다. 표준 인터페이스가 비상구다
  G-HOW-F-005:
    name: 기술 환경 적응 가이드
    patterns:
    - name: 로컬 우선 옵션
      description: 스마트 기기는 로컬 제어 경로(물리 스위치/로컬 네트워크 제어)를 제공하여, 클라우드에 도달할 수 없어도 조작할 수 있다
      domain: architecture
      example: '스마트 커튼: 앱 + 벽면 스위치 + 로컬 리모컨 세 가지 경로'
      refs:
      - STD-EN-301549:11.7
    - name: 저하 경험 설계
      description: '모든 클라우드 의존에는 단절 시 저하 대비책을 둔다: 로컬 캐시, 읽기 전용 모드, 물리적 대체'
      domain: universal
      example: 출입 통제 시스템은 네트워크가 끊겨도 로컬 화이트리스트로 통행할 수 있다
    - name: 유지보수 도구 보편화
      description: 수리에 필요한 도구와 기술을 현지 조달 가능성에 맞추어 설계한다(일반 나사/표준 인터페이스/도해 매뉴얼)
      domain: industrial
      example: 제품을 십자 드라이버 하나로 전부 분해할 수 있게 설계한다
    anti_patterns:
    - name: 클라우드 인질극
      description: 기기가 네트워크에 연결되어야만 기본 기능을 수행할 수 있다
      consequence: 네트워크 단절/서비스 종료 후 제품은 전자 폐기물이 된다. 로컬 최소 보장은 제품의 존엄 최소선이다
    - name: 전용 도구 의존
      description: 수리에 전용 도구나 공식 방문이 필요하다
      consequence: 수리 비용이 치솟아 사용자가 수리를 포기하고 조기 폐기로 이어진다(지속가능성 목표와 직접 충돌)
  G-HOW-F-006:
    name: 보조기술 상호운용 가이드
    patterns:
    - name: 표준 접근성 API
      description: 인터페이스 구성 요소는 플랫폼 네이티브 접근성 API(ARIA/UIAutomation/AT-SPI)를 사용하고, 직접 그린 컨트롤은 의미 역할을 보완한다
      domain: digital
      example: 사용자 정의 드롭다운 메뉴에 완전한 ARIA role/state/키보드 동작을 부여한다
      refs:
      - STD-EN-301549:9.4
    - name: 포커스 순서 정확
      description: 포커스 순서가 시각/논리 순서와 일치한다. 포커스는 보이며 사라지지 않고, 모달에서는 포커스가 갇힌다
      domain: digital
      example: Tab 순서는 읽기 순서를 따른다. 팝업이 열리면 포커스가 들어가고, 닫히면 포커스가 원래 위치로 돌아온다
      refs:
      - STD-W3C-WCAG22:4.1
    - name: 텍스트 대체 전면 커버
      description: 모든 비텍스트 콘텐츠에 동등한 텍스트 대체(alt/label/설명)가 있다. 이미지형 버튼에는 읽을 수 있는 이름이 있다
      domain: digital
      example: 아이콘 버튼에는 aria-label을, 장식 이미지는 alt를 비운다
    - name: 실제 사용자 검증
      description: 보조기술 호환은 에뮬레이터에만 의존할 수 없다. 실제 보조기술 사용자를 모집해 테스트 단계에 참여시킨다
      domain: digital
      example: 출시 전 화면읽기 프로그램 사용자 5명이 핵심 과제를 점검한다
    anti_patterns:
    - name: 보조기술 사후 패치
      description: 개발 완료 후 『접근성을 덧붙인다』
      consequence: 의미가 결여된 인터페이스에 ARIA 패치를 붙이는 것은 네이티브 컴포넌트의 한 줄 레이블만 못하다. 접근성은 아키텍처 결정이지 소금 뿌리기가 아니다
    - name: 포커스 블랙홀
      description: 포커스 소실/키보드 함정/순서 혼란
      consequence: 화면읽기 프로그램 사용자는 곧바로 연결이 끊긴다. 포커스 관리는 보조기술 상호운용의 첫 번째 도미노다
  G-HOW-F-007:
    name: 입출력 채널 가이드
    patterns:
    - name: 다중 채널 병존
      description: 입력 ≥2 채널(터치+키보드/음성), 출력 ≥2 채널(시각+소리/촉각)을 제공한다. 어떠한 단일 채널도 유일한 경로가 되지 않는다
      domain: digital
      example: '모든 조작: 터치 + 키보드 단축키 이중 채널'
      refs:
      - STD-EN-301549:11.5.2
    - name: 입출력 매핑 사용자 정의
      description: 키 재매핑/감도 조절/채널 전환을 제공한다. 가장 편안한 매핑은 사용자의 신체 조건이 결정하며, 하드웨어 기본값이 전부를 좌우하지 않는다
      domain: universal
      example: 한손 사용자는 좌우 키를 교환하고, 진동 강도는 필요에 따라 조절한다
    - name: 외부 기기 개방
      description: 표준 입출력 API/인터페이스(HID/블루투스/USB)를 제공하여 제3자 보조 기기를 꽂으면 바로 쓸 수 있다
      domain: industrial
      example: 기기에 표준 HID 인터페이스를 마련하여 스위치/조이스틱/시선 추적기를 연결한다
    - name: 피드백 다중 모드 동기화
      description: 핵심 상태 피드백을 다중 모드로 동기화하고(시각+소리+촉각), 각 모드의 의미가 일치한다
      domain: digital
      example: '결제 성공: 체크 애니메이션 + 짧은 소리 + 가벼운 진동이 같은 의미를 전달한다'
    anti_patterns:
    - name: 채널 독재
      description: 어떤 기능이 단 하나의 입력/출력 채널로만 동작한다
      consequence: 그 채널 역량이 제한된 사용자는 곧바로 갇힌다. 채널 중복은 정보 도달성의 보험이다
    - name: 매핑 패권
      description: 어떠한 사용자 정의 조정도 허용하지 않는다
      consequence: 왼손잡이, 한손, 떨림 사용자의 미세 조정 요구가 무시된다. 사용자 정의는 괴짜의 특권이 아니라 적응의 필수다
  G-HOW-F-008:
    name: 인증 접근성 가이드
    patterns:
    - name: 이중 경로 인증 최소선
      description: '역량 요구가 서로 다른 독립 인증 경로를 최소 두 개 제공하고(예: 비밀번호+생체 인식), 사용자가 자신의 역량에 맞게 선택한다'
      domain: digital
      example: 비밀번호(인지 부담)와 지문(운동 요건) 중 택일
      refs:
      - STD-W3C-WCAG22:3.3.8
    - name: 인지 테스트 면제
      description: 인증에서 인지 기능 테스트(비밀번호 암기/퍼즐/산수)를 강제하지 않는다. 복구 절차도 마찬가지로 면제한다. 대신 신뢰할 수 있는 연락처/기기/하드웨어 키를 사용한다
      domain: digital
      example: 비밀번호 분실 → 보안 질문 대신 신뢰 기기로 확인을 푸시한다
    - name: 비밀번호 관리자 친화
      description: 비밀번호 관리자의 자동 채우기를 막지 않고(autocomplete=off 미설정), 양식 의미가 올바르다(type=password + id)
      domain: digital
      example: 로그인 양식은 붙여넣기와 자동 채우기를 허용한다. 이는 기능이지 취약점이 아니다
    - name: 세션 인간화
      description: 세션 길이는 과제 요구에 맞게 설정하고 연장할 수 있다. 인지/운동이 느리다는 이유로 도중에 끊겨 재인증하지 않는다
      domain: digital
      example: 긴 글을 읽을 때 조용히 갱신하며, 『다시 로그인』 팝업으로 절대 방해하지 않는다
    anti_patterns:
    - name: 단일 인증 강제
      description: 인증 방식을 하나만 제공하고 모든 사람에게 강제한다
      consequence: WCAG 3.3.8을 직접 위반한다. 인지 장애가 있는 사람은 복잡한 비밀번호를 기억하지 못하고, 운동 장애가 있는 사람은 지문을 찍을 수 없다. 인증이 곧 필터가 된다
    - name: 복구의 죽음의 계곡
      description: 계정 복구가 보안 질문/신분증 업로드 등 높은 문턱에 의존한다
      consequence: 문 밖에 갇힌 사용자는 가장 취약한 순간에 가장 높은 벽을 만난다. 복구 경로의 가용성 요구는 일상 로그인보다 높다
  G-RUL-001:
    name: 접근성 규정 준수 실행 가이드
    patterns:
    - name: AA 기준선 우선
      description: WCAG 2.2 AA를 강제 기준선으로 삼고(EN 301 549 조달 요건에 정렬), AAA는 상황에 따라 선택적으로 달성한다. 기준선을 먼저 지킨 뒤 탁월함을 논한다
      domain: digital
      example: 신규 프로젝트 검수 체크리스트에 WCAG 2.2 AA의 모든 적용 조항을 바로 내장한다
      refs:
      - STD-W3C-WCAG22:1
      - STD-EN-301549:9
    - name: 접근성 선언 공표
      description: 접근성 선언(적용 범위/알려진 장벽/피드백 경로/개선 계획)을 발표하여 사용자가 확인할 수 있는 약속을 제시한다
      domain: digital
      example: 제품 페이지의 접근성 선언 + 장벽 피드백 전용 창구
      refs:
      - STD-GB-T-37668:1
    - name: 자동 스캔+수동 감사 이중 트랙
      description: CI에 자동 스캔(axe/Lighthouse)을 내장해 회귀를 차단하고, 주기적 수동 감사(화면읽기 점검/전문가 검토)를 병행한다. 기계는 기술 항목을, 사람은 경험 항목을 잡는다
      domain: digital
      example: 병합 요청에 자동 스캔 게이트를 걸고, 분기마다 전문가 감사를 실시한다
    anti_patterns:
    - name: 규정 준수가 종착점
      description: 규정 준수 보고서를 받으면 투자를 멈춘다
      consequence: 반복 개발 중 접근성은 계속 퇴행한다. 규정 준수는 증서가 아니라 과정이며, 접근성 부채는 코드처럼 쌓인다
    - name: 오버레이 패치 신화
      description: 원클릭 접근성 오버레이 도구를 사서 규정 준수를 때운다
      consequence: 업계 합의와 사용자 보고 모두 오버레이가 실제 수정을 대체하지 못하며 오히려 보조기술을 방해한다고 보여준다. 돈을 주고 가짜 준수를 사는 셈이다
  G-RUL-002:
    name: 데이터 프라이버시 규정 준수 가이드
    patterns:
    - name: 최소화 기본값
      description: 기본적으로 최소한의 데이터만 수집한다. 각 수집 항목은 명확한 목적을 가지며 목적에 한정해 사용한다. 최소화는 프라이버시 규정 준수의 제1원칙이다
      domain: universal
      example: 가입 시 이메일만 수집하고, 생일/휴대폰 번호는 선택 입력으로 두며 용도를 설명한다
      refs:
      - STD-GDPR:25
    - name: 철회 편의 동등
      description: 동의를 철회하는 경로를 동의를 부여할 때만큼 편리하게 만든다. 철회는 즉시 효력을 가지며 데이터 상태를 알린다
      domain: digital
      example: 프라이버시 패널에서 항목별 권한을 원클릭으로 철회 + 철회 후 처리 상태 피드백
      refs:
      - STD-GDPR:7.3
      - STD-PIPL:15
    - name: 권리 대응 SLA
      description: '정보주체 권리(열람/복제/정정/삭제)에 대응 절차와 SLA를 수립한다: GDPR은 1개월 기한, PIPL은 적시 대응. 구호가 아니라 절차다'
      domain: universal
      example: 권리 요청을 티켓화하고 기한 초과 시 자동 에스컬레이션한다
      refs:
      - STD-GDPR:12.3
      - STD-PIPL:45
    - name: 거부 무처벌
      description: 권한 부여를 거부하거나 동의를 철회한 후에도 기본 서비스가 영향을 받지 않는다(법정 필수 처리는 예외이며 이를 설명한다)
      domain: digital
      example: 마케팅 권한을 거부해도 모든 핵심 기능은 평소처럼 사용할 수 있다
      refs:
      - STD-PIPL:16
    anti_patterns:
    - name: 동의 공장
      description: 장황한 약관의 벽 + 기본 체크 + 거부 버튼 회색 처리
      consequence: GDPR/PIPL 어느 쪽에서도 유효한 동의를 구성하지 못한다(자유로운 의사 표시 원칙). 『동의당한』 사용자는 결코 진정으로 허락한 적이 없다. 법과 신뢰 모두에서 패배한다
    - name: 국경 간 전송 사각지대
      description: 데이터 국외 이전 시 규정 준수 경로를 평가하지 않는다
      consequence: PIPL 제38~40조는 국외 이전 안전 평가/인증/표준 계약 중 하나를 요구한다. 국경 간 처리의 규정 준수 경로는 반드시 사전에 설계해야 한다
  G-RUL-003:
    name: 안전 인증 계획 가이드
    patterns:
    - name: 목표 시장 목록 사전 확정
      description: 프로젝트 착수 시 목표 시장과 그 강제 인증(CE/UL/MDR/CCC 등)을 확정한다. 인증 요건은 요구사항의 일부이지 나중에 덧붙이는 자료가 아니다
      domain: industrial
      example: 제품 요구사항 문서에 『목표 시장 인증 매트릭스』 장을 포함한다
    - name: 요구사항 추적 매트릭스
      description: 각 인증 조항을 설계 문서와 테스트 근거로 추적한다(조항→요구사항→설계→테스트 사방 추적 가능)
      domain: industrial
      example: ISO 26262 조항-요구사항-테스트 삼방 추적표
      refs:
      - STD-ISO-26262
    - name: 위해 분석 우선
      description: 위해 분석과 위험 평가(HARA/FMEA)를 설계 초기에 완료하여 안전 요구사항을 이끌어내고, 사후 수습에 의존하지 않는다
      domain: industrial
      example: 개념 단계에서 HARA를 산출하고 검토한 뒤 상세 설계로 진입한다
    - name: 사전 규정 준수 테스트
      description: 정식 인증 전에 사전 테스트 격차 분석을 수행하여 문제를 제출 전에 없앤다
      domain: industrial
      example: 제출 전 내부적으로 표준 전 항목 자체 시험 + 격차 목록
    anti_patterns:
    - name: 인증 사후 처리
      description: 제품 완성 후에 인증 표준과 대조한다
      consequence: 구조적 부적합(재료/이중화 설계)은 개선으로 해결할 수 없다. 처음부터 다시 하는 것이 인증 사후 처리의 흔한 결말이다
    - name: 최소한의 통과
      description: 표준에 따라 설계하는 것이 아니라 검사 샘플에 맞춰 만든다
      consequence: 무작위 검사/재검사/실제 사고에서 드러난다. 통과만을 위해 설계된 제품은 현실 세계에서 알몸으로 달린다
  G-RUL-004:
    name: 지식재산권 규정 준수 가이드
    patterns:
    - name: SBOM 전수 관리
      description: '소프트웨어 자재 명세서(SBOM)를 SPDX 표준에 따라 유지한다: 모든 의존성의 라이선스, 버전, 출처를 기계 판독 가능하게 관리한다'
      domain: digital
      example: CI에서 SBOM을 자동 생성하고, 신규 의존성 라이선스 스캔 게이트를 둔다
      refs:
      - STD-SPDX
    - name: 소재 라이선스 대장
      description: 이미지/폰트/오디오를 항목별로 등록하여 허가 출처와 허용 범위를 기록한다. 『인터넷에서 찾은 것』은 라이선스가 아니다
      domain: universal
      example: 소재 라이브러리의 각 항목에 라이선스 증빙(구매 기록/라이선스 계약서/라이선스 링크)을 첨부한다
    - name: 전염성 격리
      description: 'GPL 등 전염성 라이선스 구성 요소의 도입에는 독립 검토 절차를 둔다: 링크 방식, 배포 경계, 의무 목록'
      domain: digital
      example: 신규 의존성이 GPL 계열 라이선스를 포함하면 법무 검토 티켓을 발행한다
    - name: 라이선스 고지 규범
      description: 모든 오픈소스 구성 요소에 라이선스가 요구하는 저작권 고지와 LICENSE 파일을 유지하고, 배포물에 라이선스 목록을 첨부한다
      domain: digital
      example: 배포 패키지 내에 전체 제3자 라이선스 고지 파일을 포함한다
    anti_patterns:
    - name: 무허가 의존
      description: 라이선스가 표시되지 않은 코드를 복사·붙여넣거나 무단 소재를 사용한다
      consequence: 퇴출, 손해배상 청구, 기업 실사 탈락. 한 번의 침해가 모든 원가 우위를 없앤다
    - name: 라이선스가 곧 허락
      description: 오픈소스는 마음대로 써도 된다고 여긴다
      consequence: 오픈소스 라이선스는 허락이지 무조건이 아니다. GPL 전염성, 출처 표시 요건, 상업적 이용 제한이 각각 다르며 위반은 곧 침해다
  G-RUL-005:
    name: 윤리 심의 실무 가이드
    patterns:
    - name: 인간 대상 연구 심의 필수
      description: 사용자 연구/데이터 수집이 사람을 대상으로 하면 윤리 심의(IRB/윤리위원회)를 거치고, 사전 동의 절차를 완전하게 갖춘다. Respect for Persons의 제도화다
      domain: universal
      example: 사용자 테스트 전 목적/위험/철회권을 담은 사전 동의서에 서명한다
      refs:
      - STD-BELMONT
    - name: 사전 동의 문턱 낮추기
      description: 동의 문서는 참여자가 이해할 수 있는 언어(도해/계층 요약)로 작성하여 『서명』이 아니라 『이해』를 보장한다
      domain: universal
      example: 한 장짜리 도해 버전 동의서 + 용어 쉬운 말 대조표
    - name: 알고리즘 공정성 감사
      description: 알고리즘 의사결정 시스템은 영향을 받는 집단별로 데이터를 층화해 감사한다(집단별 오류율/통과율 차이). Justice 원칙을 AI 상황에 구현한 것이다
      domain: digital
      example: 채용 시스템은 성별/연령으로 나누어 통과율 차이를 감사한다
      refs:
      - STD-IEEE-EAD
    - name: 윤리 피드백 채널
      description: 제품에 윤리 문제 신고/피드백 채널을 내장하고 처리 절차에 포함한다. 윤리 감독은 일회성 심의가 아니라 지속적 메커니즘이다
      domain: digital
      example: 『문제 신고』 창구에 윤리 범주를 포함하고 응답 기한을 둔다
    anti_patterns:
    - name: 윤리 연극
      description: 형식만 갖춘 윤리 심의/벽에 걸린 가치관
      consequence: 진짜 윤리 문제(중독 설계/편향 알고리즘/조작)는 아무도 실제로 보지 않는 곳에서 일어난다. 심의는 의식이 아니라 거버넌스다
    - name: 동의가 곧 면책
      description: 사용자 동의를 받으면 모든 것이 허용된다고 여긴다
      consequence: Belmont 원칙에서 Beneficence(위험-편익 평가)는 동의와 독립적이다. 동의서는 해악 자체의 부당함을 덮지 못한다
  G-RUL-006:
    name: 업계 규범 정렬 가이드
    patterns:
    - name: 업계 목록 유지
      description: 목표 업계 진입 규범을 목록으로 유지한다(의료 HIPAA/금융 PCI DSS/교육 FERPA/항공 DO-178C). 연 1회 검토하여 갱신한다
      domain: universal
      example: 규정 준수 대장에 적용 규범 목록+버전+담당자+재검토 일자를 포함한다
    - name: 조항을 근거에 매핑
      description: 적용되는 각 규범 조항을 구체적 근거(설계 문서/테스트 보고서/절차 기록)에 매핑한다. 매핑은 읽었다는 것이 아니라 검증 가능하다는 것이다
      domain: universal
      example: HIPAA 기술 보장 조항 → 암호화 설정 문서 + 감사 로그 샘플
    - name: 변경 추적 메커니즘
      description: 업계 규범 업데이트 채널(표준 기구/규제 공고)을 구독하고, 버전 변경 시 격차 평가를 발동한다
      domain: universal
      example: PCI DSS 신버전 발표 → 30일 내 격차 평가 보고서 산출
    - name: 영역별 규정 준수 담당자
      description: 여러 업계에 걸친 제품은 각 업계 영역별로 규정 준수 담당자를 둔다. 규범의 전문성은 『한 사람이 전부 관리』하는 것을 허용하지 않는다
      domain: universal
      example: 의료 라인과 금융 라인에 각각 DPO/규정 준수 전문가를 둔다
    anti_patterns:
    - name: 규범 스냅샷
      description: 규정 준수 검사를 한 번 하고 보관하면 영구히 유효하다고 본다
      consequence: 업계 규범은 계속 진화한다(PCI DSS 3→4는 변동이 막대했다). 스냅샷식 규정 준수는 두 번째 감사에서 위반 증거가 된다
    - name: 범용 규정 준수 환상
      description: 하나의 규정 준수 조치로 모든 업계를 커버한다
      consequence: 의료/금융/교육은 각각 전문 조항이 있어 범용 방안은 어느 업계에도 어설프다. 영역 분리는 업계 규정 준수의 철칙이다
  G-WHAT-F-001:
    name: 과제 복잡도 관리 가이드
    patterns:
    - name: 분할 정복
      description: 복잡한 과제를 선형의 단순한 하위 과제로 나눈다. 각 단계는 하나의 초점 결정만 가지며, 단계 사이에서 상태가 자동으로 전달된다
      domain: digital
      example: 계좌 개설 절차를 『한 페이지 30항목』에서 『다섯 단계 각 6항목』으로 바꾼다
      refs:
      - STD-ISO-9241-110:5.1
    - name: 기본값으로 부담 경감
      description: 예측 가능한 선택은 기본값+지능형 추천으로 처리하고, 사용자는 기본값에서 벗어날 때만 조작한다
      domain: digital
      example: 설치 마법사는 권장 구성을 기본으로 하고 고급 옵션은 접어 둔다
    - name: 마법사식 안내
      description: 처음 하는 복잡한 과제에는 마법사 템플릿을 제공하고, 익숙해지면 건너뛰어 전문가 경로로 바로 갈 수 있다
      domain: digital
      example: '보고서 도구: 처음에는 마법사 사용, 이후에는 템플릿 라이브러리 직행'
    - name: 결정점 예산
      description: 핵심 절차의 결정점 수에 상한을 둔다(단계당 ≤3). 예산을 초과하면 과제를 다시 나눈다
      domain: universal
      example: 결제 절차에서 선택적 추가 구매 팝업을 제거하고 결제 이후로 옮긴다
    anti_patterns:
    - name: 단계 적체
      description: 『사용자가 필요할지도 모르니』 모든 설정을 하나의 절차에 밀어 넣는다
      consequence: 결정 피로 속에서 사용자는 아무렇게나 고르거나 포기한다. 30개 옵션의 『자유』를 원하는 사람은 없다
    - name: 일회성 거대 양식
      description: 긴 양식을 한 페이지에 끝까지 담는다
      consequence: 완료율은 필드 수에 따라 선형으로 떨어진다. 단계 분할+진행 표시줄의 완료율이 현저히 높다. 분할은 전환 최적화이자 포용이다
  G-WHAT-F-002:
    name: 인지 부하 통제 가이드
    patterns:
    - name: 작업 기억 부담 경감
      description: 정보를 한 화면에 몰아넣지 않고 단계별로 제시한다. 사용자가 이 단계를 하려고 이전 단계를 기억할 필요가 없어야 한다
      domain: universal
      example: 단계식 양식 상단에 입력 완료 요약을 항상 표시한다
      refs:
      - STD-ISO-9241-110:5.1.3
    - name: 부하 측정 가능
      description: 핵심 과제에 NASA-TLX 등 척도로 부하 기준선을 수립한다. 중간 부하(TLX>60)를 넘으면 재설계를 발동한다
      domain: digital
      example: 신규 기능 출시 전 5명 TLX 신속 측정, 평균>60이면 반려
      refs:
      - STD-NASA-TLX
    - name: 즉시 도움말 내장
      description: 도움말 정보는 사용 지점 가까이에 나타나게 한다(인라인 힌트/말풍선 설명). 도움말 센터로 강제 이동시키지 않는다
      domain: digital
      example: 날짜 형식 오류 시 문서로 이동하지 않고 인라인 예시를 보여준다
      refs:
      - STD-W3C-WCAG22:3.3.7
    anti_patterns:
    - name: 팝업 폭격
      description: 겹치는 팝업, 배너, 부유 레이어가 동시에 주의를 다툰다
      consequence: 인지 과부하에서는 모든 정보가 없는 정보와 같다. 주의력은 제로섬 자원이다
    - name: 도움말 센터 고립
      description: 도움말 콘텐츠를 독립 페이지에 모아 둔다
      consequence: 도움말로 이동하면 맥락을 잃고 한 번 더 왕복해야 한다. 사용 지점에서 답을 주는 것이 효과적인 도움이다
  G-WHAT-F-003:
    name: 내결함성(오류 허용) 설계 가이드
    patterns:
    - name: 실행 취소 우선
      description: 오류 처리의 1차 수단은 실행 취소(undo/기록/휴지통)이며, 확인 팝업은 최후의 수단이다. 실행 취소는 몰입을 방해하지 않는다
      domain: digital
      example: 파일 삭제 → 휴지통 + Ctrl+Z, 확인 팝업 없음
      refs:
      - STD-ISO-9241-110:5.6
    - name: 위험 조작 격리
      description: 되돌릴 수 없는 조작은 물리적/시각적으로 격리하고(독립된 빨간 영역, 길게 누르기 또는 두 번 탭으로 발동), 필요 시 확인을 받는다
      domain: digital
      example: 『전체 데이터 삭제』는 설정 깊숙한 빨간 독립 영역에 두고 확인 단어를 입력해야 한다
      refs:
      - STD-W3C-WCAG22:3.3.4
    - name: 오류 메시지 세 요소
      description: 모든 오류 메시지에는 무엇이 일어났는지(사람의 말로) + 왜인지 + 어떻게 고치는지가 담긴다. 오류 메시지는 설계의 일부이지 프로그래머의 디버그 출력이 아니다
      domain: universal
      example: '『업로드 실패: 파일이 10MB 상한을 초과했습니다——이미지를 압축한 뒤 다시 업로드해 보세요』'
    - name: 자동 저장 스냅샷
      description: 버전 스냅샷+자동 저장을 기본으로 켜 둔다. 사용자는 언제든 임의의 과거 상태로 돌아갈 수 있다
      domain: digital
      example: 문서 30초 자동 저장 + 24시간 버전 기록
    anti_patterns:
    - name: 확인 팝업 남용
      description: 모든 조작에 확인을 요구한다
      consequence: 확인 피로가 쌓이면 사용자는 무심코 『예』를 누른다. 확인 팝업이 보호 기능을 잃는 순간은 꼭 필요할 때다
    - name: 오류 코드 책임 전가
      description: 오류 시 『Error 5003』만 제시한다
      consequence: 사용자는 스스로 해결할 수도 도움을 청할 수도 없다. 오류 코드는 개발자용이며 사용자에게 필요한 것은 복구 경로다
    - name: 비가역은 곧 위험
      description: 기본 조작은 되돌릴 수 있어야 하고 예외만 보호가 필요하다. 뒤집어 말하면 불가역+무보호=설계 결함이다
      consequence: 잘못된 삭제, 잘못된 발송, 잘못된 결제. 한 번의 불가역 오류가 무너뜨린 신뢰는 열 번의 성공으로도 되돌리기 어렵다
  G-WHAT-F-004:
    name: 과제 지속성 가이드
    patterns:
    - name: 중복 입력 금지 최소선
      description: 같은 절차 안에서 시스템이 이미 아는 사용자 정보는 자동으로 채우고, 두 번 입력하도록 절대 요구하지 않는다
      domain: digital
      example: 결제 페이지에서 배송지를 자동으로 불러오고, 수정 여부만 확인한다
      refs:
      - STD-W3C-WCAG22:3.3.7
    - name: 자동 임시 저장
      description: 긴 과제 전 과정을 조용히 자동 저장한다. 중단(오조작/전화/정전) 시 손실 없이 복구한다
      domain: digital
      example: 양식은 각 필드에서 포커스가 빠질 때마다 임시 저장하고, 다시 열면 바로 그 지점으로 간다
    - name: 이어하기 진입점
      description: 『이어서 계속』을 눈에 띄는 위치에 항상 배치한다. 이어하기에 재탐색이 필요하지 않다
      domain: digital
      example: 학습 앱 첫 화면의 첫 버튼이 『3단원 이어서』다
      refs:
      - STD-W3C-WCAG22:3.2.3
    - name: 기기 간 동기화
      description: 과제 상태를 클라우드로 동기화하여 기기를 바꿔도 끊김 없이 이어간다(양호/우수 등급, M-WHAT-F-004-01 참조)
      domain: digital
      example: 휴대폰에서 절반쯤 쓴 문서를 태블릿으로 열면 커서가 그 자리에 있다
    anti_patterns:
    - name: 한 자리 완주 요구
      description: 긴 과제를 한 번에 끝내야 하고 그렇지 않으면 처음부터 다시 해야 한다
      consequence: 두 번 중단된 사용자는 곧바로 포기한다. 중단은 예외가 아니라 일상이다(전화, 아이, 지하철 도착)
    - name: 조용한 유실
      description: 세션 초과 시 입력한 내용을 전부 지운다
      consequence: 30분간 입력한 내용이 물거품이 된다. 사용자는 단지 이탈하는 것이 아니라 분노를 품고 이탈한다
    - name: 반복 심문
      description: 같은 절차에서 이미 제공한 정보를 거듭 요구한다
      consequence: 『아까 이미 입력했는데』. 중복 입력은 가장 노골적인 무시다(WCAG 3.3.7의 입법화된 표현)
  G-WHAT-F-005:
    name: 협업 과제 가이드
    patterns:
    - name: 역할 권한 명시
      description: 협업 시작 전에 역할과 권한(보기/댓글/편집/관리)을 명확히 한다. 책임이 불분명한 것이 모든 협업 마찰의 근원이다
      domain: digital
      example: 문서 공유는 기본 읽기 전용, 필요 시 편집 권한으로 승격한다
      refs:
      - STD-ISO-9241-110:5.5.4
    - name: 비동기 우선
      description: 기본적으로 비동기 협업(메모/@/상태 추적)을 지원한다. 실시간 동기화는 동시 작업이 꼭 필요한 상황에만 쓴다
      domain: digital
      example: '검토 절차: 각자 비동기로 주석 → 요약 회의에서는 쟁점만 다룬다'
    - name: 진행 상황 자동 요약
      description: 협업 상태 변경을 관련자에게 자동 통지한다(구독 단계 설정 가능). 『진행 상황 문의』의 커뮤니케이션 비용을 줄인다
      domain: digital
      example: '과제 보드 자동 알림: 내가 담당한 것 + @된 것만'
    anti_patterns:
    - name: 회의 기본주의
      description: 협업이 필요하면 회의를 연다
      consequence: 동기 회의는 모든 사람의 일정을 가장 느린 사람에게 묶어 버린다. 비동기 도구는 협업을 시간 인질극에서 풀어낸다
    - name: 권한 혼돈
      description: 모든 사람에게 모든 권한을 주거나 아무도 누가 무엇을 관리하는지 모른다
      consequence: 오조작, 책임 공백, 버전 혼란. 권한 구조는 협업의 지반이지 행정 부담이 아니다
  G-WHAT-F-006:
    name: 중단 허용 설계 가이드
    patterns:
    - name: 미저장 상태 표시
      description: 저장되지 않은 상태를 인터페이스에 항상 표시하고(점/배지/문구), 종료 전에 먼저 확인한다. 저장 상태를 가시적 상태로 만든다
      domain: digital
      example: 저장되지 않은 수정이 있는 탭을 닫을 때 명확히 알린다
      refs:
      - STD-W3C-WCAG22:3.2.3
    - name: 집중 모드 설정 가능
      description: 사용자가 비긴급 알림을 스스로 차단할 수 있고(집중 모드/상태 설정), 긴급 예외 화이트리스트는 명시적이다
      domain: digital
      example: '글쓰기 앱의 원클릭 선(禪) 모드: 전체 화면+방해 금지+타이머'
    - name: 나중에 처리 대기열
      description: 모든 과제를 원클릭으로 할 일 대기열에 보류하고 알림을 설정할 수 있다. 중단은 망각도, 즉시 처리도 아니다
      domain: digital
      example: 절반쯤 읽은 글 → 나중에 읽기 + 오후 8시 알림
    - name: 과제의 자연스러운 중단점
      description: 과제 구조를 중단 가능한 단위로 나눈다. 중단점에서 상태가 온전히 복구 가능하다
      domain: universal
      example: 동영상 강의는 10분마다 단원 퀴즈가 있어 자연스러운 중단점이 된다
      refs:
      - STD-ISO-9241-110:5.5.2
    anti_patterns:
    - name: 알림 전면 관통
      description: 어떤 알림이든 언제든 어떤 과제도 중단시킨다
      consequence: 깊은 작업이 3분 조각으로 잘게 쪼개진다. 중단된 집중을 회복하는 데 평균 20분이 걸린다. 알림은 반드시 층위와 등급을 나눠야 한다
    - name: 중단은 곧 처벌
      description: 중단되면 진행/연속 기록/세션이 무효화된다
      consequence: 사용자는 중단 처벌을 피하려 불안하게 대비한다. 제품과 사용자의 목표가 어긋나 대립한다
  G-WHEN-F-001:
    name: 사용 시간대 적응 가이드
    patterns:
    - name: 시간대 인식 인터페이스
      description: 인터페이스가 사용 시간대에 따라 자동으로 조정되고(야간 어두운 색/아침 밝은 색), 자동 판단을 수동으로 덮어쓸 수 있다
      domain: digital
      example: 22:00 이후 자동 어두운 테마, 낮에는 고대비
    - name: 방해 금지 경계 존중
      description: 알림과 리마인더는 사용자가 설정한 선호 시간대와 시스템 방해 금지 모드를 준수한다. 긴급 정보는 화이트리스트로 예외 처리하며 이를 명시적으로 선언한다
      domain: digital
      example: 마케팅 알림은 방해 금지를 준수하고, 보안 경보는 관통하되 실제 긴급에 한한다
    - name: 시간대 과제 추천
      description: 시간대에 맞춰 콘텐츠와 기능을 추천하고(아침 요약/낮 가벼움/저녁 심층), 사용 습관을 강제로 바꾸지 않는다
      domain: digital
      example: 학습 앱은 아침에 15분 마이크로 강의를 추천한다
    anti_patterns:
    - name: 24시간 푸시
      description: 기본적으로 어느 때든 사용자를 방해할 수 있다고 본다
      consequence: 심야 마케팅 푸시는 곧바로 앱 삭제로 이어진다. 시간대 인지는 알림의 기본 예의다
    - name: 하드코딩된 시간대
      description: 고정된 시간표에 따라 기능을 전환한다
      consequence: 교대 근무자, 시차 이동 여행자의 실제 생활 리듬과 고정 시간표가 어긋난다. 시계가 아니라 사용자를 따라가라
  G-WHEN-F-002:
    name: 빈도 계층화 가이드
    patterns:
    - name: 고빈도 효율 채널
      description: '고빈도 사용자에게 효율 기능을 제공한다: 단축키, 일괄 조작, 자주 쓰는 기능 상단 고정. 반복은 가장 강력한 개인화 신호다'
      domain: digital
      example: 어떤 기능을 5번째 사용하면 첫 화면 추천 위치에 자동으로 나타난다
    - name: 저빈도 기억 보조
      description: '저빈도 사용자에게 기억 지원을 제공한다: 최근 사용 기록, 기본값 미리 채우기, 명확한 안내. 『기억나지 않음』을 설계 입력으로 삼는다'
      domain: digital
      example: 월 납부 페이지에서 지난 납부 등급을 자동으로 불러온다
    - name: 재방문 메커니즘 계층화
      description: 간격에 따라 재방문을 계층 설계한다(주간 활성/월간 활성/휴면 사용자). 빈도는 가정이 아니라 사용자 데이터가 결정한다
      domain: service
      example: 휴면 사용자는 시스템 홍보가 아니라 『당신의 식물은 아직 살아 있나요』라는 메시지를 받는다
    anti_patterns:
    - name: 단일 화면 전인 균형
      description: 하나의 인터페이스로 고빈도와 저빈도 사용자를 동시에 만족시키려 한다
      consequence: 고빈도 사용자는 느리다 불평하고 저빈도 사용자는 어지럽다 불평한다. 계층형 진입점이 만능 인터페이스보다 저렴하고 효과적이다
    - name: 점착성 지표 폭정
      description: DAU/MAU를 높이기 위해 열 이유를 억지로 만든다
      consequence: 지표를 위해 설계한 기능은 사용자의 시간을 소모한다. 중독식 설계는 단기적으로 데이터가 좋아 보이지만 장기적으로 신뢰가 무너진다
  G-WHEN-F-003:
    name: 계절성 적응 가이드
    patterns:
    - name: 기후 파라미터화 설계
      description: 목표 시장 기후 데이터(온도 극값/우기 일수/일조 변화)에 따라 하드웨어와 기능 포락선을 설정하고, 사계절 균형을 가정하지 않는다
      domain: industrial
      example: 남부 고온다습 시장 제품은 표기값 35°C가 아니라 40°C×90%RH 기준으로 설계한다
    - name: 계절성 기능 전환
      description: 계절 관련 기능을 시기에 맞춰 자동으로 사용 가능하게 한다(우기 경보, 꽃가루 알림, 설상 모드). 해당 시기가 아니면 인터페이스를 차지하지 않는다
      domain: digital
      example: 날씨 앱은 6월에 태풍 추적을 자동 개시하고 1월에는 빙설 노면 경보로 교체한다
    - name: 극한 날씨 중복 확보
      description: 극한 날씨(혹서/혹한/폭우) 일수를 현지 데이터에 따라 제품 신뢰성 설계에 반영한다(M-WHEN-F-003-01 시나리오 커버리지에 대응)
      domain: industrial
      example: 배달 용기는 현지 여름 고온 최고치에 맞춰 보온 성능을 설정한다
    anti_patterns:
    - name: 온대 중심주의
      description: 기본적으로 사계절이 뚜렷하고 기후가 온화하다고 가정한다
      consequence: 열대의 연중 여름, 극지의 긴 겨울 지역은 계절이 맞지 않는 제품을 받는다. 기후 적응은 현지화의 일부다
    - name: 장식적 계절화
      description: 계절 적응을 테마 스킨으로만 처리한다
      consequence: 스킨 교체는 진짜 문제를 해결하지 않는다(우기 노면 알림이 여름 스킨보다 훨씬 유용하다). 계절성은 기능을 먼저 충족한 뒤 분위기를 논한다
  G-WHEN-F-004:
    name: 시간 압박 적응 가이드
    patterns:
    - name: 남은 시간 표시
      description: 시간 제한 과제는 남은 시간과 진행 상황을 실시간 표시한다. 카운트다운 설계는 압박이 수행에 미치는 영향을 고려한다
      domain: digital
      example: 시험 시스템은 남은 시간을 항상 표시하고 마지막 10분에 시각적 알림을 준다
      refs:
      - STD-W3C-WCAG22:2.2.1
    - name: 시간 제한 조정 채널
      description: 시간 압박이 과제의 본질이 아닐 때 해제/연장할 수 있다(무제한 모드, 연장 신청). 압박은 수단이지 목적이 아니다
      domain: universal
      example: 연습 모드는 무제한, 평가 모드에서만 시간을 잰다
    - name: 빠른 경로 사전 설정
      description: 고빈도 긴급 상황에 미리 검증된 빠른 경로를 제공한다(원클릭 주문, 상용약 재구매 직행)
      domain: digital
      example: 상용약은 원클릭으로 처방을 갱신하고 모든 탐색 단계를 건너뛴다
    - name: 대기의 정직화
      description: 로딩 대기 시 실제 예상 시간과 진행 상황을 제시한다. 예상을 초과하는 대기에는 대안(나중에 알림)을 제공한다
      domain: digital
      example: 진행 표시줄은 가짜 등속이 아니라 실제 속도를 따른다
    anti_patterns:
    - name: 인위적 카운트다운
      description: 가짜 긴박감(『3분밖에 안 남았습니다!』)으로 결정을 재촉한다
      consequence: 압박 속 결정은 품질이 떨어지고 후회율이 오른다. 불안을 만들어 전환을 얻는 것은 다크 패턴이다(Mathur et al. 2019 분류학의 압박 항목)
    - name: 대기 블랙홀
      description: 진행 표시 없는 로딩
      consequence: 사용자는 기다려야 할지 떠나야 할지 모른다. 피드백 없는 2초는 10초처럼 느껴진다. 정직한 대기가 거짓된 빠름보다 견디기 쉽다
  G-WHEN-F-005:
    name: 자투리 시간 적응 가이드
    patterns:
    - name: 과제 분할 이어하기
      description: 긴 과제를 독립적으로 완수 가능한 시간 블록(15분 단위)으로 나눈다. 각 블록에는 자연스러운 중단점과 이어하기 진입점이 있다
      domain: digital
      example: 온라인 강의는 15분 단위로 구성되며, 한 단원을 마치면 이어볼 지점이 자동 기록된다
      refs:
      - STD-W3C-WCAG22:2.2.1
    - name: 나중에 이어하기 메커니즘
      description: '모든 긴 과제를 보류하고 나중에 이어갈 수 있다: 『나중에』 진입점이 항상 있고 상태가 온전히 보존된다'
      domain: digital
      example: 긴 글을 읽다 중간에 나가도 다음에 열면 원래 위치로 바로 간다
    - name: 단계별 예상 제시
      description: 긴 과제 시작 전에 단계별 계획과 예상 총 소요 시간을 제시하여, 사용자가 가용 시간에 근거해 결정하게 한다
      domain: universal
      example: 양식 첫 화면에 『약 20분 소요, 3회로 나눠 작성 가능』을 표시한다
    anti_patterns:
    - name: 통짜 시간 가정
      description: 기본적으로 사용자에게 연속된 큰 시간 덩어리가 있다고 가정한다
      consequence: 통근자, 돌봄 제공자의 실제 시간은 전부 조각나 있다. 통짜 가정은 80%의 사용자가 영영 시작조차 못 하게 만든다
    - name: 중단점은 곧 유실
      description: 중단 후 진행 상황이 보존되지 않는다
      consequence: 한 번 방해받으면 처음부터 다시 해야 한다. 사용자는 그 교훈을 배운 뒤 아예 시작하지 않는다
  G-WHEN-F-006:
    name: 피로 친화 설계 가이드
    patterns:
    - name: 피로 신호 대응
      description: '행동상의 피로 신호(연속 오류, 조작 둔화, 과도하게 긴 세션)를 감지하고 대응한다: 휴식 안내 또는 인터페이스 단순화'
      domain: digital
      example: 비밀번호를 3번 연속 틀리면 잠금 대신 『잠시 쉬시겠어요』라고 안내한다
      refs:
      - STD-W3C-WCAG22:2.2.6
    - name: 중단점 저장 최소선
      description: 긴 세션 전 과정을 자동 저장한다. 피로로 인한 중단 시 데이터를 잃지 않는다. 저장은 제품의 책임이지 사용자의 기억 부담이 아니다
      domain: universal
      example: 문서는 30초마다 조용히 저장되고, 종료하면 곧 복구된다
    - name: 피로 시 인터페이스 부하 경감
      description: 피로 상태가 감지되면 정보량을 줄이고, 핵심 요소를 키우고, 조작 허용 오차를 넓힌다
      domain: digital
      example: 장시간 세션 후 자동으로 큰 버튼 모드로 전환한다
    - name: 짧은 휴식 알림
      description: 장시간 세션이 있는 제품에는 휴식 알림(끌 수 있음)을 내장한다. 알림 주기는 조정 가능하며 설교조가 아니다
      domain: digital
      example: 45분 후 부드럽게 알리고, 사용자는 다시 알리지 않도록 설정할 수 있다
    anti_patterns:
    - name: 무한 연속 설계
      description: 연속 과제 흐름+진행 불안으로 사용자가 멈추지 못하게 한다
      consequence: 피로가 쌓이면 오류율이 치솟는다(특히 산업/의료 상황에서는 곧 안전사고다). 사용자를 화면 앞에 붙잡아 두는 설계는 헌신이 아니라 해악이다
    - name: 휴식 처벌
      description: 중단/휴식이 진행/보상 손실로 이어진다
      consequence: 연속 기록(streak) 메커니즘은 휴식을 낙인찍는다. 건강한 사용과 상업 지표가 충돌할 때 사용자의 건강이 담보가 되어서는 안 된다
  G-WHERE-F-001:
    name: 물리 환경 적응 가이드
    patterns:
    - name: 환경 포락선 테스트
      description: 제품 설계는 실제 사용 환경 포락선(온도/습도/진동/조명의 교차 조합)으로 테스트하고, 실험실의 이상 조건을 검수 기준으로 삼지 않는다
      domain: industrial
      example: 야외 장비는 단일 표기값이 아니라 -20~50°C × 30-90% RH 교차 매트릭스로 테스트한다
      refs:
      - STD-ISO-21542:5.4
    - name: 강한 빛 가독성 보장
      description: '야외/강광 상황에서도 화면 정보의 가독성을 유지한다: 고휘도 모드 + 고대비 방안 + 차광 구조'
      domain: digital
      example: 햇빛 아래에서 밝기만 올리는 것이 아니라 대비를 자동으로 높인다
    - name: 방수방진 등급
      description: 목표 시나리오에 따라 IP 보호 등급을 선택하고 사양에 명시적으로 표기한다. 일상적 비산 시나리오에는 최소 IP54
      domain: industrial
      example: 주방 가전 패널은 IPX4부터 시작
    - name: 환경 보상 설계
      description: '환경으로 인한 감각 저하를 보상할 채널을 제공한다: 소음이 크면 시각/촉각 피드백으로 보완하고, 강한 빛이면 음성으로 보조한다'
      domain: universal
      example: 소음 제거 마이크 + 음성-텍스트 변환 이중 안전장치
    anti_patterns:
    - name: 실험실 환상
      description: 실험실의 이상 조건만을 기준으로 설계·검증한다
      consequence: 고온+고습 교차, 이동 진동 등 실제 조합에서 성능이 급락한다. 사용자는 제품을 받은 첫날 바로 겪는다
    - name: 극한 조건 편집증
      description: 극한(수중/고온)만 방어하고 일상의 경미한 불리함(조금 밝은 방, 손바닥 땀)은 무시한다
      consequence: 극한 방어는 비용만 쌓고, 일상 90% 상황의 사용성은 아무도 챙기지 않는다
    - name: 환경 교차 사각지대
      description: 단일 요인이 각각 기준을 통과하면 안전하다고 본다
      consequence: 고온+고습, 진동+먼지 등 교차 효과가 겹치면 기준을 초과한다. 실제 환경은 결코 단일 요인으로 나타나지 않는다
  G-WHERE-F-002:
    name: 사회 환경 포용 가이드
    patterns:
    - name: 편향 감사 사전 실시
      description: 콘텐츠/알고리즘/표현에서 집단 표상에 대한 편향 감사(다양성 표현, 고정관념 스캔)를 출시 전에 완료한다
      domain: digital
      example: 이미지 소재 라이브러리를 피부색/연령/체형 분포로 검토하고, 단일 미적 기준을 쓰지 않는다
    - name: 사회적 격리 차단
      description: 물리적·디지털 공간에서 계층/신분에 따른 격리 설계(별도 출입구, 전용 구역)를 피한다. 공유 시설의 품질은 균등하다
      domain: architecture
      example: 주거 프로젝트의 모든 출입구를 같은 기준으로 하고, 『서비스 인력 전용문』을 두지 않는다
    - name: 표현의 다양성
      description: 대중을 향한 이미지/문구에서 집단의 다양성을 표현하고, 단일 집단이 『기본 이미지』를 독점하지 않게 한다
      domain: universal
      example: 삽화 캐릭터가 휠체어 사용자, 다양한 연령과 문화를 포괄한다
    - name: 지역 규범 적응
      description: 사회 규범의 차이(신체 접촉, 시선, 성별 상호작용 예절)를 현지화 점검표에 포함한다
      domain: universal
      example: 고객 응대 인사말은 지역 문화에 따라 격식 수준을 조정한다
    anti_patterns:
    - name: 기술이 곧 사회적 사용 가능
      description: 기능이 작동하면 모든 집단이 사용할 수 있다고 여긴다
      consequence: 잠재적 편향(누가 기본이고 누가 특별 취급받는지)이 설계를 통해 전달된다. 소수 집단은 『사용 가능한』 제품 안에서도 계속 불편을 느낀다
    - name: 중립성 환상
      description: 설계가 중립적이라 선언하지만 실제로는 주류 집단의 시각을 기본으로 삼는다
      consequence: 『중립』 설계는 주류 집단에게는 보이지 않고 소수 집단에게는 드러난다. 입장을 설계하지 않는 것 자체가 입장이다
    - name: 빈민문 효과
      description: 요금/신분에 따라 품질이 다른 시설 출입구를 따로 둔다
      consequence: 공공연한 제도적 차별 신호로, 모든 사용자의 신뢰와 존엄을 훼손한다
  G-WHERE-F-003:
    name: 공간 접근성 가이드
    patterns:
    - name: 통행 유효폭 최소선
      description: 주 통행로 유효폭 ≥900mm(휠체어 서로 교행 시 ≥1500mm), 전 구간에서 돌출물로 인한 협소화가 없다
      domain: architecture
      example: 복도 설계를 900mm 유효폭으로 검수하고, 소방 배관 하단은 폭에 산입하지 않는다
      refs:
      - STD-GB-55019:2
    - name: 무계단 출입구
      description: 주 출입구는 단차가 없거나 동등한 경사로/리프트로 대체한다. 경사로 구배는 ≤1:12이며 손잡이를 설치한다
      domain: architecture
      example: 출입구 15mm 단차는 한 단 계단이 아니라 경사 전환으로 처리한다
    - name: 수직 이동 중복 확보
      description: 계단 외에 반드시 엘리베이터/경사로의 동등한 대체가 있다. 핵심 시설은 접근 가능한 층에 배치한다
      domain: architecture
      example: 공공 서비스 창구는 1층에만 두지 않고 엘리베이터로 갈 수 있는 층에 설치한다
    - name: 원격 동등 대체
      description: 오프라인 공간에 접근할 수 없을 때 원격 동등 서비스 채널(온라인 처리/배송/방문)을 제공한다
      domain: service
      example: 정부 청사에 갈 수 없다면? 온라인 처리 + 방문 서비스 이중 채널
    anti_patterns:
    - name: 휠체어 전용 사고
      description: 접근성을 휠체어 사용자만을 위한 부가 시설로 여긴다
      consequence: 유모차, 짐 끌기, 배달, 일시적 다리 부상. 휠체어 경사로는 바퀴를 굴리는 모든 사람을 위한 것이다. 부속 위치의 휠체어 경사로는 느리게 걷는 사람까지 배제한다
    - name: 기준 통과가 종착점
      description: 규범 최저값에 맞춰 지은 뒤 더 최적화하지 않는다
      consequence: 유효폭 810mm에 딱 맞는 문, 구배 1:12에 딱 붙는 경사로. 기술적으로는 기준을 통과하지만 경험은 주변화되어, 휠체어 사용자는 『합법적으로』 편안함에서 배제된다
    - name: 접근성 사후 처리
      description: 건물 완공 후에 접근성 시설을 덧붙인다
      consequence: 사후 설치 비용은 10배이고 효과도 나쁘다(구조적 제약). 접근성은 배치 문제이지 인테리어 문제가 아니다
  G-WHERE-F-004:
    name: 자원 복원력 설계 가이드
    patterns:
    - name: 핵심 기능 오프라인화
      description: '핵심 기능은 지속적 자원 공급에 의존하지 않는다: 오프라인 사용 가능, 정전 시 저장, 네트워크 단절 시 마비가 아니라 저하'
      domain: digital
      example: 편집 앱은 네트워크가 끊겨도 로컬에서 계속 쓸 수 있고, 복구 후 동기화한다
    - name: 자원 요구 명시화
      description: 제품/서비스에 필요한 자원(전기/네트워크/물/소모품)을 획득 전에 명시적으로 알려 숨은 자원 문턱을 피한다
      domain: universal
      example: 다운로드 페이지에 『XX GB 저장공간 + 지속적 네트워크 필요』를 표기한다
    - name: 대안 병행
      description: '자원이 부족한 상황에 대체 경로를 제공한다: 건전지로 충전 대체, 종이로 전자 대체, 수동으로 자동 대체'
      domain: industrial
      example: 스마트 도어록은 배터리가 소진돼도 기계식 열쇠로 문을 열 수 있다
    - name: 자원 소모 최적화
      description: 절전/데이터 절약/소모품 절약 모드를 내장하고, 기본 등급이 곧 경제 등급이다
      domain: digital
      example: 데이터 절약을 기본으로 켜고, 고소모는 선택 사항으로 둔다
    anti_patterns:
    - name: 자원 가정 사슬
      description: 전기, 네트워크, 소모품이 언제나 충분하다고 가정한다
      consequence: '정전/요금 미납/소모품 구매 불가 시 제품이 전면 마비된다. 가장 취약한 순간이 바로 그것이 가장 필요한 순간이다(예: 인슐린 펌프 정전)'
    - name: 단일 자원 의존
      description: 획득 경로가 하나뿐이다(충전만, 네트워크만)
      consequence: 그 경로가 끊기면 기능이 0이 된다. 중복은 복원력의 최소 단위다
    - name: 저하가 곧 소멸
      description: 자원이 부족할 때 기능이 저하되는 것이 아니라 통째로 사용 불가가 된다
      consequence: 사용자는 자원이 빠듯한 시기에 완전히 연결이 끊긴다. 점진적 저하(저화질이라도 사용 가능)가 전부 아니면 전무보다 낫다
  G-WHERE-F-005:
    name: 경제적 접근성 설계 가이드
    patterns:
    - name: 총소유비용 투명화
      description: 구매가 외에 사용 비용(소모품/데이터/유지보수/업그레이드)을 명시적으로 제시하여, 사용자가 총비용에 근거해 결정하게 한다
      domain: universal
      example: 제품 페이지에 『연간 소모품 비용 약 XX위안』을 표기한다
    - name: 무료 핵심 계층
      description: '핵심 기능에는 유료 장벽을 두지 않는다. 유료는 부가가치 계층에만 대응한다(비교 계층 데이터 출처: World Bank 소득 분류에 따른 계층별 가격)'
      domain: digital
      example: 학습 앱의 기초 과정은 영구 무료, 고급 콘텐츠는 구독
    - name: 저사양 기기 호환
      description: 목표 시장의 주류 저사양 기종과 구형 OS 버전을 지원한다. 경량판과 완전판을 병행한다
      domain: digital
      example: Go 버전 앱은 2GB 메모리 기기에서도 원활하게 실행된다
    - name: 수리 친화 설계
      description: 분해 수리가 가능하고(접착제가 아닌 나사), 예비 부품을 장기 공급하며, 제3자 수리로도 보증이 무효화되지 않는다
      domain: industrial
      example: 배터리 교체 가능 + 공식 수리 매뉴얼 공개
    anti_patterns:
    - name: 일회성 가격 근시안
      description: 구매 가격만 최적화하고 사용 기간 비용을 무시한다
      consequence: '『살 수는 있지만 쓸 수는 없다』: 저렴한 프린터 + 터무니없는 잉크 카트리지 모델은 저소득 사용자를 지속 지불 함정에 가둔다'
    - name: 저렴함은 곧 불편함
      description: 저소득 시장은 기능을 바로 잘라내고 품질을 낮춘다
      consequence: 『저렴하지만 불편함』은 경제적 접근성이 아니라 이차적 배제다. 저소득 사용자도 좋은 디자인을 누릴 자격이 있다(SAST 근거)
    - name: 인플레이션 취약 가격 책정
      description: 가격 책정과 원가 구조가 경제 변동을 고려하지 않는다
      consequence: 인플레이션 시기에는 이탈이 급증한다. 계층별·지역별 가격 책정이 변동 대응 완충책이다
  G-WHERE-F-006:
    name: 비상 상황 설계 가이드
    patterns:
    - name: 한 단계 도움 요청
      description: 긴급 도움 요청 기능은 ≤1단계로 도달 가능해야 하며 항상 사용할 수 있다(잠금 화면/저전력/어떤 인터페이스 상태에서도)
      domain: digital
      example: 잠금 화면에서 측면 버튼을 길게 누르면 잠금 해제 없이 바로 SOS
    - name: 다중 채널 발동
      description: 긴급 발동은 최소 두 가지 채널(버튼 + 음성/자동 감지)을 두어, 어느 채널이 고장 나도 경로가 남는다
      domain: universal
      example: 낙상 감지 자동 구조 요청 + 물리 버튼 이중 채널
    - name: 포카요케(실수 방지)이지 오작동 방지가 아니다
      description: 긴급 절차에는 다중 확인을 두지 않는다(당황한 상태에서는 완수할 수 없다). 다만 오작동을 취소할 짧은 창을 제공한다
      domain: universal
      example: SOS 발동 후 3초 카운트다운 내에 취소할 수 있다
    - name: 상태 확인 피드백
      description: '도움 요청 발송 후 명확히 피드백한다: 누구에게 연락했는지, 위치 공유가 성공했는지, 예상 대응 시간. 당황 속의 정보 공백을 해소한다'
      domain: digital
      example: 『긴급 연락처에 전화했습니다. 위치가 공유되었습니다. 응답을 기다리는 중입니다』
    anti_patterns:
    - name: 확인 계층 지옥
      description: 오작동을 막으려고 긴급 절차에 다중 확인을 둔다
      consequence: 실제 긴급 상황에서 각 확인 계층은 생존의 장애물이다. 오작동의 대가는 민망함이지만 확인의 대가는 생명이다
    - name: 긴급 기능 깊은 매몰
      description: SOS를 여러 겹 메뉴 안에 숨긴다
      consequence: '긴급한 순간에는 아무도 경로를 기억하지 못한다. 긴급 기능의 가용성 기준은 일상 기능과 전혀 다르다: 반사적으로 도달 가능해야 한다'
    - name: 단방향 발신
      description: 도움 요청 후 어떠한 상태 피드백도 없다
      consequence: 사용자는 요청이 성공했는지 알 수 없어 반복하거나 포기한다. 피드백 부재는 당황을 공포로 확대한다
  G-WHERE-F-007:
    name: 사용 상황 적응 가이드
    patterns:
    - name: 한손 조작 영역 설계
      description: 이동 상황의 핵심 조작을 엄지 도달 영역(화면 하단 1/3)에 집중시킨다. 양손 조작은 선택적 강화에만 쓴다
      domain: digital
      example: 하단 작업 표시줄 + 엄지 열역에 주 버튼 배치
    - name: 주의 분산 상황 부하 경감
      description: '운전/요리 등 주의가 분산되는 상황에서는 자동으로 저상호작용 모드로 전환한다: 큰 버튼, 음성 우선, 최소 단계'
      domain: digital
      example: '차량 모드: 초대형 터치 대상 + 순수 음성 대체 경로'
    - name: 자세 전환 연속성
      description: 앉기/서기/걷기/눕기의 자세 변화를 설계로 포괄한다(WHO-F-007에서 검증된 직관 외부화 원칙——상황도 마찬가지다)
      domain: universal
      example: 읽기 앱은 가로/세로 전환 + 누운 자세 페이지 넘김 제스처
    - name: 이동 플랫폼 안정성
      description: 불안정한 플랫폼(보행/차량 내)에서는 터치 대상을 키우고 정밀 조작을 줄이며 오류 허용도를 높인다
      domain: digital
      example: 보행이 감지되면 정밀 편집 모드를 자동 일시 중지한다
    anti_patterns:
    - name: 집중 착석 자세 가정
      description: 조용히 앉아 전념하는 데스크톱 상황만을 기준으로 설계한다
      consequence: 통근 중 한손, 서서 흔들리는 상태, 아이를 안은 상황이 모두 주요 상황이다. 집중 착석이 오히려 소수 상황이다
    - name: 정적 상황 고정
      description: 상황을 동적 전환이 아니라 정적으로 본다
      consequence: 앉기에서 걷기로, 실내에서 강광으로의 전환점이 경험 단절점이 된다. 적응은 연속적이어야 한다
    - name: 인지 자원 초과 인출
      description: 멀티태스킹 상황에서도 전부의 주의력을 요구한다
      consequence: 운전 중 정밀 조작을 요구하는 것은 곧 사고를 만드는 일이다. 주의력은 희소 자원이므로 설계는 세금을 걷지 말고 빚을 갚아야 한다
  G-WHERE-F-008:
    name: 공유 상황 프라이버시 가이드
    patterns:
    - name: 다중 사용자 프로필 격리
      description: 공유 기기는 다중 사용자 프로필과 신속 전환(지문/얼굴 ≤1단계)을 지원하여, 개인 콘텐츠와 추천이 서로 오염되지 않는다
      domain: digital
      example: '가족용 태블릿: 지문 인식으로 각자의 홈 화면에 바로 진입한다'
    - name: 게스트 모드
      description: '원클릭으로 흔적을 남기지 않는 모드에 진입한다: 기록을 저장하지 않고 추천을 오염시키지 않으며 나가면 곧 비운다'
      domain: digital
      example: 남의 컴퓨터를 빌리면 → 게스트 창, 창을 닫으면 끝
    - name: 공개도 등급화
      description: '같은 제품 안에서 대상별로 가시성을 등급화한다: 업무 자료는 동료에게만, 가족 사진은 가족에게만. 프라이버시는 전부 아니면 전무가 아니다'
      domain: universal
      example: 앨범을 인물 관계에 따라 가시성을 구분한다
    - name: 환경 인식 프라이버시
      description: '공공 상황(공용 Wi-Fi/비컨)이 감지되면 자동으로 강화한다: 엿보기 방지 안내, 알림에서 민감 내용 숨김'
      domain: digital
      example: 공용 Wi-Fi에 연결되면 알림은 『새 메시지 1건』만 표시한다
    anti_patterns:
    - name: 단일 계정 가정
      description: 기본적으로 한 사람, 한 기기, 한 계정이라고 가정한다
      consequence: 가족 공유 기기에서 추천이 엉키고 서로의 프라이버시를 엿본다. 공유 기기는 전 세계적으로 보편적인 현실이다(가정/PC방/도서관)
    - name: 흔적이 곧 노출
      description: 공유 상황에서 삭제/무흔적 경로를 제공하지 않는다
      consequence: 사용자가 빌려 쓰는 것에 사과하거나 아예 쓰길 거부한다. 사회적 마찰이 제품을 부담으로 만든다
    - name: 화면 엿보기 무방비
      description: 공공 상황에서도 민감 정보를 평소처럼 전부 표시한다
      consequence: 알림 내용과 메시지 미리보기가 공공 공간에서 주변인에게 방송된다. 프라이버시 유출은 종종 능동적 공격이 아니라 수동적 엿보기로 일어난다
  G-WHERE-F-009:
    name: 보조받는 사용 상황 가이드
    patterns:
    - name: 단계별 대리 권한
      description: 대리 권한을 최소 필요에 따라 단계화한다(읽기 전용/조력/완전 위임/긴급 인수). 사용자는 언제든 철회할 수 있다. 보조는 주권을 넘기는 것이 아니다
      domain: digital
      example: '자녀가 부모의 재정을 돕는 경우: 『보기』 권한만 부여하고, 자금 이동은 본인이 확인한다'
    - name: 이중 인터페이스 상태 동기화
      description: 주 사용자 인터페이스와 조력자 인터페이스가 병존하며 상태가 동기화된다. 조력자 대시보드는 주 계정과 독립적이다
      domain: digital
      example: '약통 앱: 어르신 화면에는 큰 글씨 알림, 가족 화면에는 복약 여부가 보인다. 비밀번호를 공유할 필요가 없다'
    - name: 프라이버시 경계 설정 가능
      description: '조력자가 볼 수 있는 범위는 주 사용자가 설정한다: 과제 진행만 / 전체 내용 / 이상 경보만'
      domain: digital
      example: '당뇨 관리: 혈당 수치만 공유하고 채팅 기록은 공유하지 않는다'
    - name: 물리적 보조 적응
      description: '실물 제품의 보조 조작 경로: 자석 단추/벨크로로 정교한 잠금구 대체, 큰 개구부 설계, 간병 공간 확보'
      domain: fashion
      example: 수술 후 환자복은 옆트임 자석 설계로 환자가 혼자 입거나 간호사가 돕기에 모두 쉽다
    anti_patterns:
    - name: 비밀번호 공유가 곧 대리
      description: 조력자와 피조력자가 하나의 계정 비밀번호를 공유한다
      consequence: '권한 경계가 전무하다: 모든 프라이버시가 노출되고 조작 주체를 구분할 수 없어 책임이 불분명하다. 대리는 반드시 시스템 수준 기능이어야 하지 비밀번호 공유가 아니다'
    - name: 주도권 박탈
      description: 기본적으로 조력자가 전권을 인수한다
      consequence: 피조력자의 자율권과 존엄이 박탈된다. 보조의 목표는 역량을 확장하는 것이지 결정을 대체하는 것이 아니다(ICF e3 지지적 환경의 의미)
    - name: 간병 공간 부재
      description: 시설 설계가 사용자 본인만 고려하고 조력자를 고려하지 않는다
      consequence: 휠체어 사용자가 왔는데 동행 가족이 앉을 자리가 없다. 간병 자리는 보조받는 상황의 기반 시설이다
  G-WHICH-F-001:
    name: 정보 밀도 등급화 가이드
    patterns:
    - name: 밀도 3단계 전환
      description: 간략/표준/상세 3단계 밀도(또는 밀도 슬라이더)를 제공하고, 전환은 즉시 적용되며 선호를 기억한다
      domain: digital
      example: 데이터 표는 기본 화면당 10행, 조밀 모드로 화면당 25행 전환 가능
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: 점진적 공개 구조
      description: '정보를 계층화한다: 요약은 항상 표시, 상세는 필요 시 펼침(접기/말풍선/드릴다운). 한 화면에 꽉 채우지 않는다'
      domain: universal
      example: '상품 페이지: 첫 화면에 핵심 사양, 상세 사양은 접어 둔다'
    - name: 사용자 정의 대시보드
      description: 사용자가 패널 내용과 배치를 제어할 수 있게 한다(카드 추가·삭제/순서 조정). 기본 배치는 중간 정도 밀도로 한다
      domain: digital
      example: 워크스페이스 첫 화면의 카드를 추가·삭제하고 끌어서 배치할 수 있다
      refs:
      - STD-ISO-9241-110:5.5.4
    anti_patterns:
    - name: 디자이너 취향 강요
      description: 팀의 미적 기준으로 유일한 밀도를 고정한다
      consequence: 저밀도 선호자는 어지럽다 하고 고밀도 선호자는 느리다 한다. 밀도는 옳고 그름이 아니라 선호이므로 답이 아니라 선택을 주어야 한다
    - name: 접기 숨바꼭질
      description: 핵심 정보까지 접어 숨긴다
      consequence: 『너무 깊이 숨기면 없는 것과 같다』. 접기는 저빈도 상세에만 쓰고, 핵심 경로 정보는 반드시 바로 닿아야 한다
  G-WHICH-F-002:
    name: 탐색 깊이 등급화 가이드
    patterns:
    - name: 이중 속도 경로
      description: 같은 목표에 빠른 경로(직행/기본값)와 심층 경로(모든 옵션/고급 설정)를 병행 제공하고 서로를 강요하지 않는다
      domain: digital
      example: 『빠른 시작』과 『사용자 정의 설치』 이중 진입점
      refs:
      - STD-ISO-9241-110:5.4.3
    - name: 탐색과 검색 병행 중시
      description: 심층 탐색자는 계층 탐색으로, 빠른 사용자는 검색 직행으로. 두 가지 사고 모드를 모두 지원한다
      domain: universal
      example: '지식 베이스: 목차 트리 + 전체 텍스트 검색 이중 채널'
    - name: 브레드크럼 회귀
      description: 다층 탐색에서 언제든 되돌아가고 건너뛸 수 있다(브레드크럼/기록). 탐색 중 길을 잃지 않는다
      domain: digital
      example: 분류 페이지 상단의 브레드크럼으로 임의 계층으로 되돌아갈 수 있다
    anti_patterns:
    - name: 깊이의 일방통행문
      description: 깊이 들어간 뒤에는 되돌아가기 어렵다
      consequence: 탐색이 모험이 된다. 사용자는 『열지 않기』를 배우고, 정보 구조에 들인 심층 투자가 전부 낭비된다
    - name: 초보자가 곧 전문가
      description: 깊지도 얕지도 않은 중간 경로 하나만 있다
      consequence: 빠른 사용자는 느려지고 심층 사용자는 배가 부르지 않다. 이중 속도 병행이 절충한 단일 속도보다 저렴하다
  G-WHICH-F-003:
    name: 통제감 설계 가이드
    patterns:
    - name: 자동화 등급 조정 가능
      description: 자동화 등급을 사용자가 선택할 수 있고(완전 자동/반자동/수동), 언제든 낮은 등급으로 내려 직접 인수할 수 있다
      domain: universal
      example: '에어컨: 자동 모드 + 온도/풍량 수동 세부 조절'
      refs:
      - STD-ISO-9241-110:5.5
    - name: 덮어쓰기와 취소의 이중 권한
      description: 시스템 결정을 덮어쓸 수 있고 취소할 수 있다. 『최종 결정권은 언제나 사람에게 있다』
      domain: digital
      example: 자동 분류된 메일은 원클릭으로 되돌리고 규칙을 다시 설정할 수 있다
    - name: 상태 투명
      description: 시스템이 지금 무엇을 하는지, 왜 그렇게 하는지, 다음에 어떻게 될지를 알린다. 투명성은 통제감의 전제다
      domain: universal
      example: 『밝기를 자동 조정했습니다(강한 빛 감지)——여기를 눌러 취소』
    - name: 도움말 일관성
      description: 도움말 진입점의 위치가 고정되고 구조가 통일되며, 필요할 때 바로 있고 주 흐름을 방해하지 않는다
      domain: digital
      example: 우측 상단 상시 도움말 아이콘 + 인라인 힌트 이중 트랙
      refs:
      - STD-W3C-WCAG22:3.2.6
    anti_patterns:
    - name: 블랙박스 자동화
      description: 시스템이 결정했지만 알리지도 설명하지도 않는다
      consequence: 사용자는 통제를 잃고 존중받지 못한다고 느낀다. 블랙박스는 신뢰의 블랙홀이다(Parasuraman 2000 10단계 모델의 투명성 요소에 대응)
    - name: 자동화 인질극
      description: 수동 인수 경로를 제공하지 않는다
      consequence: 자동화가 고장 나면 사용자는 속수무책이다. 『당신을 위한 것』이라는 강제가 최악의 강제다
  G-WHICH-F-004:
    name: 사회적 가시성 통제 가이드
    patterns:
    - name: 항목별 독립 제어
      description: 가시성 설정을 정보 유형별로 항목마다 독립적으로 둔다(게시물/접속 상태/활동/친구 목록). 전부 아니면 전무로 하지 않는다
      domain: digital
      example: 접속 상태는 친구에게만, 게시물은 공개——두 개의 자물쇠를 분리한다
    - name: 기본 프라이버시 최강
      description: 기본값을 가장 엄격한 가시성으로 둔다. 공개는 능동적 선택이지 기본 상태가 아니다
      domain: digital
      example: 새 계정은 기본적으로 나만 보기, 게시 시 가시 범위를 명시적으로 선택한다
      refs:
      - STD-GDPR:25
    - name: 가시성 상태 표시
      description: 게시/공유 시점에 현재 가시 범위를 명시적으로 표기한다(『공개로 표시됩니다』). 나중에야 알게 되지 않는다
      domain: digital
      example: 게시 버튼 옆에 대상 레이블을 항상 표시하고, 눌러서 변경할 수 있다
    - name: 상황별 프리셋
      description: 상황별 프리셋(가족만/동료만/공개) + 사용자 정의 미세 조정을 제공한다. 일괄 설정으로 부담을 줄인다
      domain: digital
      example: '앨범 공유: 원클릭 『가족만 보기』 프리셋'
    anti_patterns:
    - name: 공개 기본값 함정
      description: 『활동성』을 높이려고 기본을 공개로 둔다
      consequence: 사용자는 모르는 사이 예상보다 훨씬 넓은 대상에게 노출된다. 프라이버시 사고는 곧 신뢰 사고다. GDPR/PIPL의 기본 최소화는 이미 법정 요건이다
    - name: 가시성 미로
      description: 프라이버시 설정이 여러 겹 메뉴 깊숙이 묻혀 있고 진입점을 찾기 어렵다
      consequence: 『바꿀 수 없음』은 『바꾸지 못함』과 같다. 도달할 수 없는 통제는 장식품이지 권리가 아니다
  G-WHICH-F-005:
    name: 스타일 선택 가이드
    patterns:
    - name: 공식 테마 다중
      description: 공식 테마를 ≥2개 제공한다(최소한 고대비와 부드러움 포함). 기본 테마는 개성 과시가 아니라 보편적 가독성을 취한다
      domain: digital
      example: 기본 밝은 중성 + 어두운 + 고대비 세 테마
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: 스타일 전환 시 위치 불변
      description: 어떤 스타일/테마를 전환해도 핵심 기능의 위치는 변하지 않는다. 변화는 피부 층에 한정하고 근육 기억 층은 건드리지 않는다
      domain: digital
      example: 어두운 모드 전환 후에도 내비게이션/버튼 위치가 꿈쩍하지 않는다
    - name: 핵심 사용자 정의 지점
      description: 영향이 큰 사용자 정의(글자 크기/대비/모션 전환)에 집중하고, 끝없는 사용자 정의 시스템을 만들지 않는다
      domain: digital
      example: '설정 3종 세트: 글자 크기, 대비, 모션——충분하면 좋다'
    anti_patterns:
    - name: 기본값이 곧 태도
      description: 기본 스타일이 강하게 개성화되어 있다(과감한 배색/무거운 모션)
      consequence: 미적 감각은 정규분포의 중심이 아니라 선호의 분포다. 강한 기본값은 대다수 사용자가 첫눈에 도망치고 싶게 만든다
    - name: 스킨 교체가 배치 교체
      description: 테마 전환이 기능 위치 재배치를 동반한다
      consequence: 사용자는 테마를 바꾸려고 조작을 다시 배워야 한다. 스타일 자유가 근육 기억을 대가로 해서는 안 된다
  G-WHICH-F-006:
    name: 입력 방식 중복 확보 가이드
    patterns:
    - name: 전면 키보드 접근
      description: 모든 기능을 키보드로 완수할 수 있다(합리적 Tab 순서 + 단축키). 마우스/터치는 유일한 채널이 아니다
      domain: digital
      example: 모든 조작에 단축키 + 가시적 포커스 테두리
      refs:
      - STD-W3C-WCAG22:2.1.1
    - name: 비포인터 대체
      description: 드래그/호버 등 포인터 상호작용에 비포인터 등가 수단(버튼/메뉴)이 있다. 복잡한 제스처에는 단순한 대체가 있다
      domain: digital
      example: 드래그 정렬 → 위/아래 이동 버튼 병존
      refs:
      - STD-W3C-WCAG22:2.5.7
    - name: 입력 우선순위 설정
      description: '기본 입력 방식을 사용자가 선택할 수 있다(예: 음성 우선/키보드 우선). 기기를 바꿔도 선호가 따라간다'
      domain: digital
      example: 외장 키보드 연결 시 단축키 힌트가 자동 복원된다
    - name: 상황별 입력 추천
      description: 사용 상황을 감지해 입력 방식을 추천한다(이동 중→음성, 소음→키보드). 추천은 강제가 아니다
      domain: digital
      example: 보행 상태가 감지되면 『음성 입력을 시도해 보세요』라고 안내한다
    anti_patterns:
    - name: 마우스 유일 경로
      description: 기능을 마우스/터치로만 완수할 수 있다
      consequence: 운동 장애 사용자, 화면읽기 프로그램 사용자, 효율 중시 사용자가 동시에 배제된다. 키보드 접근은 디지털 포용의 지반이다(WCAG 2.1.1 A 등급)
    - name: 제스처 폭정
      description: 버튼 대신 독자적인 복잡 제스처를 만든다
      consequence: '발견 가능성이 0에 가까워진다: 숨은 제스처를 기억하는 사람은 없다. 제스처는 가속기일 수 있어도 외나무다리여서는 안 된다'
  G-WHICH-F-007:
    name: 피드백 채널 통제 가이드
    patterns:
    - name: 채널별 독립 조정
      description: 시각/소리/촉각 피드백 강도를 독립적으로 조절하거나 끌 수 있다. 사용자의 감각 경계는 사용자가 정한다
      domain: universal
      example: 알림 음량, 진동 강도, 애니메이션 전환이 세 갈래로 독립
    - name: 고위험 다중 채널
      description: 위험/긴급 상태는 기본적으로 다중 채널 강피드백(소리+빛+진동)을 쓰되, 강제 해제가 아니라 역량에 맞게 맞춤 설정할 수 있다
      domain: industrial
      example: '기기 과열: 빨간 등 + 부저 + 패널 경고 세 채널 동시'
    - name: 상태 메시지 도달
      description: 조작 결과 피드백을 프로그래밍 방식으로 접근 가능한 상태 메시지(aria-live 등)로 제시하여 화면읽기 프로그램이 동시에 인지한다
      domain: digital
      example: 저장 성공 토스트에 aria-live=polite 부여
      refs:
      - STD-W3C-WCAG22:4.1.3
    - name: 방해 금지 중 긴급 유지
      description: 무음/방해 금지 모드에서도 긴급 피드백은 화이트리스트로 관통하며, 화이트리스트는 사용자가 심의한다
      domain: digital
      example: 방해 금지 중에도 안전 경보는 진동 + 배너를 유지한다
    anti_patterns:
    - name: 피드백 인질극
      description: 『당신이 보도록 하기 위해』 끄기 옵션을 주지 않는다
      consequence: 강제 피드백은 감각 괴롭힘이다. 사용자는 소음을 피하려고 제품 전체의 알림을 꺼버린다
    - name: 단일 채널 독재
      description: 모든 피드백이 단 하나의 모드로만 존재한다
      consequence: 그 채널 역량이 약한 사용자는 모든 피드백을 놓친다. 다중 채널 중복은 정보 도달의 기본 보험이다
  G-WHICH-F-008:
    name: 상호작용 모드 병존 가이드
    patterns:
    - name: 핵심 과제 이중 모드
      description: 핵심 과제에 ≥2 상호작용 모드(터치+키보드/음성)를 사용할 수 있고, 『유일하게 올바른』 사용법이 없다
      domain: digital
      example: '목록 조작: 터치 길게 누르기 + 우클릭 메뉴 + 단축키 삼통'
      refs:
      - STD-ISO-9241-110:5.5.4
    - name: 기본 모드 선택
      description: 기본 상호작용 모드를 사용자가 설정할 수 있다(터치 우선/키보드·마우스 우선/음성 우선). 기기 역량이 사용자 선호를 결정하지 않는다
      domain: digital
      example: 태블릿 사용자도 외장 키보드를 연결해 전면 키보드 조작이 가능하다
    - name: 전환 무비용
      description: 모드 전환은 ≤1단계이고 상태를 잃지 않는다. 전환 진입점은 일정하다
      domain: digital
      example: 음성과 터치는 언제든 전환하고 대화 맥락은 보존된다
    anti_patterns:
    - name: 기기가 곧 운명
      description: 터치스크린 기기는 터치 상호작용만 만든다
      consequence: 외부 기기 사용자, 접근성 사용자, 선호가 다른 사용자가 기기 형태에 인질로 잡힌다. 기기는 역량이지 성격이 아니다
    - name: 모드 상호 배타 청소
      description: 새 버전에서 『경험을 단순화한다』며 구형 상호작용 모드를 잘라낸다
      consequence: 기존 사용자의 근육 기억이 하룻밤 사이 무효가 된다. 모드의 퇴출은 사용자의 학습보다 느려야 한다
  G-WHICH-F-009:
    name: 알림 거버넌스 가이드
    patterns:
    - name: 세밀한 등급화
      description: 알림을 유형+발신자+긴급도 3차원으로 독립 제어한다. 『전부 끄기』와 『전부 받기』 사이에 중간 지대가 있다
      domain: digital
      example: 프로모션 끔, 개인 메시지 켬, 보안 경보 강알림——세 등급 병존
      refs:
      - STD-W3C-WCAG22:2.2.3
    - name: 기본 보수
      description: 기본적으로 핵심 알림만 전달한다. 더 많은 알림은 사용자가 능동적으로 켠 결과다
      domain: digital
      example: 설치 후 첫 푸시 전에 『무엇을 받으시겠어요?』를 묻고 기본은 전부 끔
    - name: 시간 창과 스로틀
      description: 알림은 사용자의 시간 창(생활 리듬/방해 금지)과 빈도 스로틀(같은 유형은 묶어서 도배하지 않음)을 준수한다
      domain: digital
      example: '읽지 않은 같은 유형 알림 병합: 12번 울리는 대신 『새 상호작용 12건』'
    - name: 방해하면 보상
      description: 강한 방해(벨/전체 화면)는 사용자가 표시한 고우선순위에만 한정한다. 강한 방해마다 신속 조정 진입점을 제공한다
      domain: digital
      example: 강한 알림 배너 모서리에 『이런 알림 줄이기』 상시 배치
    anti_patterns:
    - name: 알림 군비 경쟁
      description: 리텐션을 위해 알림을 기본으로 전부 켠다
      consequence: 알림 피로 → 원클릭 끄기 → 제품과의 단절. 사용자가 끄는 것은 특정 알림 하나가 아니라 제품 전체다
    - name: 유도 구독
      description: 마케팅 알림을 미리 체크하고, 『구독 안 함』을 10단계 미로로 만든다
      consequence: GDPR/PIPL은 사전 체크 동의를 명백히 금지한다. 유도 구독은 규정 위반 위험 + 다크 패턴이라는 이중 죄다
  G-WHO-F-001:
    name: 신체 능력 포용 가이드
    patterns:
    - name: 다감각 중복 제시
      description: 핵심 정보를 ≥2 감각 채널(시각+청각/촉각)로 동시에 전달하여, 어느 단일 채널 능력이 떨어져도 정보에 도달할 수 있다
      domain: universal
      example: '엘리베이터 도착: 층 표시 + 알림음 + 진동'
      refs:
      - STD-W3C-WCAG22:1.4.3
    - name: 조절 가능한 조작 파라미터
      description: 물리적 상호작용 파라미터(힘/치수/높이)가 최소한 P5~P95 인구 구간을 포괄하고, 핵심 조작에 힘을 덜 쓰는 대안을 제공한다
      domain: industrial
      example: 손잡이 조작력 ≤ 도어 하드웨어 표준값; 높이 조절 작업대
      refs:
      - STD-GB-T-10000
    - name: 터치 대상 확대
      description: 터치 대상 ≥44×44 CSS 픽셀(WCAG 2.5.8 목표 크기 하한), 오조작 방지를 위해 간격 충분
      domain: digital
      example: 모바일 주 조작 버튼 48dp, 간격 ≥8dp
      refs:
      - STD-W3C-WCAG22:2.5.8
    - name: 역량 스펙트럼 전면 커버
      description: '『장애인 대 비장애인』 이분법이 아니라 역량 스펙트럼(일시적/상황적 제한 포함: 아기 안기, 강한 빛, 골절)에 따라 동일한 방안을 설계한다'
      domain: universal
      example: 음성 입력은 시각장애인의 채널이자 두 손이 묶인 상황의 채널이다
    anti_patterns:
    - name: 평균 사용자 오류
      description: 통계적 평균 인체 치수로 고정 파라미터를 설계한다
      consequence: P5/P95 양 끝의 집단이 곧바로 배제된다. 평균인은 존재하지 않고 통계적 환상 속에만 있다
    - name: 장애 극화
      description: 극단적 장애(전맹/마비)만 고려하고, 더 큰 집단인 경증·중등도 능력 차이를 무시한다
      consequence: 1%의 극단 사례를 포괄하면서 30%의 경증·중등도 제한 사용자를 배제한다
    - name: 단일 시각 피드백
      description: 모든 상태 피드백을 시각(색/도형)으로만 전달한다
      consequence: 저시력, 색각 장애, 강광/눈부심 상황의 사용자는 핵심 상태 변화를 인지할 수 없다
      domain: digital
  G-WHO-F-002:
    name: 인구통계 포용 가이드
    patterns:
    - name: 인구 집단 페르소나 세분화
      description: 단일 『목표 사용자』 가정을 다차원 교차 페르소나(연령×지역×생애주기 단계)로 대체한다. 설계가 포괄하는 인구 경계를 명시적으로 선언한다
      domain: universal
      example: 고령자 친화 인터페이스는 성별이 아니라 능력으로 정의하고, 아동 모드는 인지 발달 단계로 등급화한다
    - name: 고정관념 차단
      description: '설계 검토에 『고정관념 점검』 단계를 둔다: 모든 인구 가정은 데이터나 사용자 연구로 뒷받침되어야 하며, 근거 없는 가정(예: 『노인은 기술을 모른다』)은 강제로 제거한다'
      domain: universal
      example: 65세 이상 인터넷 사용률 데이터로 직관적 가정을 대체한다
    - name: 지역 발전 격차 적응
      description: 글로벌 제품의 기능 집합을 지역 인프라(네트워크/결제/기기 수준)에 따라 등급화하고, 획일적 경험 기준선을 가정하지 않는다
      domain: digital
      example: 경량판 앱은 핵심 기능을 유지해 저사양 기기에 적응한다
    anti_patterns:
    - name: 균질 전체 가정
      description: 목표 사용자군을 내부 차이가 없는 하나의 전체로 본다
      consequence: 내부 차이가 가장 큰 하위 집단(초보/주변부 사용자)의 경험이 가장 나쁘며, 바로 그들이 포용이 가장 필요한 집단이다
    - name: 신흥 집단 사각지대
      description: 과거 사용자 데이터로 미래 사용자를 외삽한다
      consequence: 디지털 노마드, Z세대 등 신흥 집단의 행동 양식이 과거 페르소나와 체계적으로 어긋난다
  G-WHO-F-003:
    name: 건강 상태 포용 가이드
    patterns:
    - name: 변동성 설계
      description: 건강 상태를 변동 스펙트럼으로 다룬다(만성질환 안정기/발작기, 통증일, 피로일). 핵심 기능은 저에너지 상태에서도 사용할 수 있다
      domain: universal
      example: '통증일 인터페이스는 『오늘은 적게 하기』 모드를 제공한다: 꼭 해야 할 과제만 남긴다'
    - name: 안전 민감 콘텐츠 보호
      description: 깜박임/고주파 시각 콘텐츠를 안전 임계값 내로 통제한다(간질 보호). 의료 알림은 경고음과 혼동되지 않게 한다
      domain: digital
      example: 모션은 prefers-reduced-motion을 준수하고 초당 >3회 깜박임이 없다
      refs:
      - STD-W3C-WCAG22:2.3.1
    - name: 저조작력 대체
      description: 물리 조작에 낮은 힘의 대체 경로(밀어 열기로 손잡이 대체, 음성으로 버튼 대체)를 제공하고, 조작력 요구를 명시적으로 표기한다
      domain: industrial
      example: 미끄럼 방지 저저항 손잡이 + 음성 제어 이중 경로
    anti_patterns:
    - name: 건강 이분법
      description: 건강 상태를 『건강/장애』 두 상태로 단순화한다
      consequence: 변동성 건강 문제(만성 피로, 현기증 발작) 사용자는 『장애로 칠 만큼 심하지 않다』는 회색 지대에서 완전히 무시된다
    - name: 동반 질환 사각지대
      description: 단일 질환에 맞춰 최적화하고 여러 질환이 공존하는 실제 복잡성을 무시한다
      consequence: '단일 질환을 위해 정교하게 설계한 방안이 동반 질환 조합에서는 쓸 수 없다(예: 시각+손 관절이 동시에 제한된 경우)'
  G-WHO-F-004:
    name: 다중 모드 학습 가이드
    patterns:
    - name: 콘텐츠 이중 모드 최소선
      description: 핵심 조작 안내를 최소 두 가지 모드(도해+영상/상호작용 연습)로 제시한다. 『학습 스타일』에 따라 개인을 매칭하지 않고(근거가 부정되었다) 다중 모드로 포괄한다
      domain: universal
      example: '초보자 안내: 도해 단계 + 건너뛸 수 있는 영상 + 상호작용 연습 중 택일'
    - name: 리듬 자기 통제
      description: 학습 콘텐츠는 반복/빨리 감기/느리게/건너뛰기를 지원하며 선형 진행을 강제하지 않는다
      domain: digital
      example: 튜토리얼 영상 배속 재생 + 단원 건너뛰기
    - name: 필요에 따라 학습 순서 선택
      description: 안내 흐름에서 시연→조작 또는 조작→힌트 두 경로를 모두 허용하고, 순서를 획일적으로 강제하지 않는다
      domain: digital
      example: 안내 첫 화면에 『바로 시작』과 『먼저 시연 보기』 이중 진입점을 제공한다
    anti_patterns:
    - name: 학습 스타일 적합화 함정
      description: VARK 등 학습 스타일 분류에 따라 개인별로 콘텐츠 모드를 맞춤 제작한다
      consequence: Pashler et al. 2008의 근거 검토는 매칭 가설에 실증적 지지가 없음을 보여준다. 자원을 투입해도 학습 성과가 없고, 『나는 시각형』이라는 가짜 수요 낙인을 만든다
    - name: 단일 모드 강제
      description: '모든 교육 콘텐츠가 단 하나의 모드(예: 순수 영상 튜토리얼)만 쓴다'
      consequence: 청각장애/난독증/대역폭 제한 사용자가 배제된다. 다중 모드가 가장 저렴한 전면 포괄 방안이다
  G-WHO-F-005:
    name: 정서 경험 설계 가이드
    patterns:
    - name: 좌절점 제로화
      description: 핵심 절차의 정서 접점을 하나씩 점검하고, 좌절을 유발하는 지점(피드백 없는 막다른 길, 모욕적인 오류 안내)은 P0로 간주해 수정한다
      domain: universal
      example: 오류 안내를 『입력 무효!』 대신 『여기에는 X 형식의 날짜가 필요합니다』 + 원클릭 수정 버튼으로 바꾼다
    - name: 자율성 지원 3종 세트
      description: '자기결정이론에 따라 제공한다: 선택권(선택 가능한 경로), 유능감 피드백(체감 가능한 진행), 의미 연결(왜 이렇게 조작해야 하는지 설명)'
      domain: universal
      example: 설정 항목에 『이것을 왜 묻는지』 용도 설명 한 줄을 덧붙인다
    - name: 긍정 강화 설계
      description: 핵심 접점에 긍정적 정서 피드백(완료 축하, 진행 시각화)을 설계하되 강도를 상황에 맞춘다. 의료 응급 인터페이스는 환호 애니메이션이 아니라 차분한 확인을 쓴다
      domain: digital
      example: '건강 목표 달성: 정적 체크 + 짧은 문구, 색종이 애니메이션은 쓰지 않는다'
    - name: 피크-엔드 최적화
      description: 절차의 절정 순간과 종료 순간을 식별하고, 두 지점에 정서 설계 자원을 우선 투입한다
      domain: service
      example: '체크아웃 절차: 종료 페이지에 명시적 감사 + 다음 숙박 빠른 진입점'
    anti_patterns:
    - name: 기능주의 사각지대
      description: 기능적 사용성만 최적화하고 정서 경험을 『덧붙이는 것』으로 본다
      consequence: '기능은 쓸 만하지만 불안하거나 모욕적인 제품(예: 오류 시 사용자가 어리석다는 듯한 암시)은 사용자가 스스로 피하고, 사용성 투자가 물거품이 된다'
    - name: 즐거움이 곧 오락화
      description: 긍정 경험을 게임화 요소(포인트/배지/색종이)와 동일시한다
      consequence: 진지한 상황(의료, 금융, 행정)의 오락화 요소는 신뢰를 훼손한다. 정서 설계는 상황에 맞는 적절한 긍정 감정이다
    - name: 상벌 의존
      description: 외적 보상으로 행동을 이끌고 내적 동기 육성을 무시한다
      consequence: 보상을 없애면 사용 행동이 붕괴한다. SDT 연구는 외적 보상이 내적 동기를 침식함을 보여준다
  G-WHO-F-006:
    name: 감각 선호 적응 가이드
    patterns:
    - name: 전 채널 강도 조절 가능
      description: 각 감각 채널(밝기/음량/진동/모션)의 강도를 독립적으로 조절할 수 있고, 기본값은 중립 등급으로 하며 『표준 사용자』 선호를 가정하지 않는다
      domain: universal
      example: '설정 패널: 밝기 슬라이더 + 음량 + 진동 + 모션 전환 네 항목 독립'
    - name: 무자극 모드
      description: 원클릭 저자극 모드(어두운 색+무음+모션 감축+저채도)를 제공하여 HSP(고민감군)와 감각 과부하 상황(편두통/자폐 스펙트럼)에 도움이 된다
      domain: digital
      example: prefers-reduced-motion과 prefers-contrast 환경 선호에 전면 응답한다
      refs:
      - STD-W3C-WCAG22:1.4.4
    - name: 선호 상황 기억
      description: 감각 구성을 상황별로 여러 세트 저장할 수 있고(주간 사무/야간 독서/운전 모드), 전환은 ≤1단계
      domain: digital
      example: 원클릭으로 『야간 모드』 구성 세트 전환
    anti_patterns:
    - name: 중립 설계 신화
      description: 모든 사람에게 맞는 하나의 『중립』 감각 설계가 있다고 가정한다
      consequence: 자극에 민감한 집단은 과부하로 사용을 포기하고, 자극 요구가 높은 집단은 지루해 정보를 무시한다. 양극단이 동시에 배제된다
    - name: 정적 선호 가정
      description: 감각 선호를 고정된 개인 속성으로 보고 상황/피로/건강에 따른 변동을 무시한다
      consequence: 야간의 강한 백색광 인터페이스, 피로할 때의 고주파 모션. 사용자가 가장 취약한 순간이 바로 자극이 가장 강한 순간이다
  G-WHO-F-007:
    name: 기술 리터러시 계층화 가이드
    patterns:
    - name: 점진적 공개
      description: '기능을 사용 빈도와 복잡도에 따라 계층적으로 노출한다: 핵심 조작은 첫 화면에 보이고 고급 기능은 점진적으로 발견되며, 모든 능력을 한꺼번에 쌓아 두지 않는다'
      domain: digital
      example: '카메라 앱: 기본 자동 모드, 전문 파라미터는 『더보기』 안에서 단계적으로 펼쳐짐'
    - name: 직관 외부화 검증
      description: 『직관적』이라는 판단은 반드시 목표 사용자 테스트로 검증해야 하며, 디자이너의 직관을 검수 기준으로 삼지 않는다
      domain: universal
      example: '첫 사용 점검: 기술 배경이 전혀 없는 사용자가 안내 없이 핵심 과제를 완수해야 통과'
    - name: 일관된 모드 재사용
      description: 같은 종류의 조작은 제품 안에서 동일한 상호작용 모드를 따른다. 플랫폼 관례(길게 눌러 삭제 등)가 독자 제스처보다 우선한다
      domain: digital
      example: 앱 전체에서 『왼쪽으로 밀어 삭제』로 통일하고, 일부 페이지는 밀고 일부는 길게 누르는 식으로 하지 않는다
    - name: 가역 조작 최소선
      description: 파괴적 조작 전에는 반드시 실행 취소/확인이 있다. 가벼운 조작은 되도록 가역으로 한다(소프트 삭제 30일 창)
      domain: digital
      example: 삭제 → 30일 휴지통 + 상단 Snackbar 취소
    anti_patterns:
    - name: 디자이너 직관 오류
      description: 『내가 보기에 직관적이다』를 사용성 판단 근거로 삼는다
      consequence: 디자이너의 익숙함≠목표 사용자의 직관. 저리터러시 사용자는 고리터러시 디자이너의 『직관적』 인터페이스에서 체계적으로 길을 잃는다
    - name: 매뉴얼 의존증
      description: 설명서/교육으로 복잡한 설계를 메운다
      consequence: 저리터러시 사용자는 오히려 매뉴얼을 가장 안 본다. ISO 9241-110은 자기서술성, 즉 인터페이스 자체가 사용법을 전달할 것을 명확히 요구한다
  G-WHO-F-008:
    name: 문화 포용 가이드
    patterns:
    - name: i18n 전 계층 적응
      description: '국제화는 번역만이 아니다: 날짜/시간/숫자 형식, 이름 순서, 쓰기 방향(RTL), 줄바꿈 규칙을 모두 적응시킨다'
      domain: digital
      example: 아랍어 버전은 레이아웃을 미러링(RTL)하고, 날짜 형식은 지역을 따른다
    - name: 문화 기호 검토
      description: 색/아이콘/제스처/은유의 의미를 목표 문화에서 하나씩 검토하고, 자국 직관으로 타국의 의미를 추정하지 않는다
      domain: universal
      example: 흰색은 동아시아 혼례 맥락과 서구 장례 맥락에서 의미가 반대다
    - name: 종교와 관습 사전 확보
      description: 음식 접촉 재료, 문양, 공간 방향(기도 방향), 축제 달력을 목표 문화에 맞춰 적응 자리를 미리 마련한다
      domain: architecture
      example: 다목적 공간에 이동식 기도 매트와 방향 표지를 미리 마련한다
    anti_patterns:
    - name: 세계화가 곧 영어화
      description: 영어 인터페이스를 제공하면 국제화라고 여긴다
      consequence: 비영어권 원어민이 이중 언어 인지 부담을 진다. 문화적 격차(형식/금기/예절)는 그대로 남는다
    - name: 직역 함정
      description: 기계 번역 내용을 현지화 검수 없이 그대로 출시한다
      consequence: 실례가 되거나 우스꽝스러운 문구가 신뢰를 훼손한다. 은유/농담/관용구의 직역 참사가 빈발한다
    - name: 고정관념 기호 차용
      description: 단순화한 고정관념적 문화 기호(토템/의복)를 장식으로 쓴다
      consequence: 목표 문화 집단을 불쾌하게 한다. 현지 사용자가 성의 없는 가짜 현지화로 알아본다
  G-WHO-F-009:
    name: 신경다양성 포용 가이드
    patterns:
    - name: 감각 조절 패널
      description: '집중식 감각 조절 진입점을 제공한다: 모션 전환, 밝기 상한, 소리 감축, 인터페이스 밀도 낮추기. 한 곳에서 켜면 전역에 적용된다'
      domain: digital
      example: 『감각 자극 줄이기』 총 스위치가 애니메이션을 끄고, 대비 자극을 낮추고, 인터페이스를 단순화한다
      refs:
      - STD-W3C-WCAG22:2.4.4
    - name: 예측 가능한 상호작용
      description: '갑작스러운 변화를 없앤다: 예고 없는 팝업, 자동 재생 음성·영상, 페이지 전환. 변화가 일어나기 전에 예고한다'
      domain: universal
      example: 카운트다운 종료 3초 전에 시각적 예고를 띄운 뒤 전환을 실행한다
    - name: 리듬 완전 자기 통제
      description: 모든 시간 제한 콘텐츠를 일시정지/다시보기/건너뛰기할 수 있다. 카운트다운 압박을 두지 않는다
      domain: universal
      example: 튜토리얼과 퀴즈 모두 시간 제한이 없다
    - name: 다중 채널 정보 중복
      description: 핵심 정보를 텍스트+아이콘+음성의 다중 채널로 중복 제시하여, 어느 처리 채널이 약해도 다른 채널을 쓸 수 있다
      domain: digital
      example: '오류 안내: 문자 설명 + 아이콘 + 낭독 가능'
      refs:
      - STD-W3C-WCAG22:3.3.7
    anti_patterns:
    - name: 돌발 자극
      description: 예고 없는 소리/깜박임/팝업/자동 재생
      consequence: 자폐 스펙트럼과 감각 민감 사용자의 감각 과부하로 곧바로 제품을 끈다. 모든 사람에게 방해 요인이다
    - name: 카운트다운 압박
      description: 시간 제한 과제로 긴박감을 조성한다
      consequence: 처리 속도가 느린 사용자(난독증/불안)는 압박 속에서 더 나쁘게 수행한다. 재는 것은 역량이 아니라 불안이다
    - name: 한 화면 다중 과제
      description: 같은 화면에 여러 주의 쟁탈 구역(팝업+스크롤 배너+깜박이는 배지)을 쌓는다
      consequence: 주의 배분이 어려운 사용자는 과부하로 도망친다. 정보 습득률이 전반적으로 떨어진다
  G-WHO-F-010:
    name: 인지 친화 설계 가이드
    patterns:
    - name: 정보 청킹
      description: 긴 내용을 3~5개씩 한 묶음의 의미 블록으로 나누고, 블록 사이에 시각적 구분을 둔다. 한 화면에 주 과제 하나
      domain: digital
      example: 양식을 주제별로 묶어 단계적으로 제시한다(기본 정보→선호→확인), 각 단계 ≤5항목
      refs:
      - STD-W3C-WCAG22:3.1.5
    - name: 익숙한 모드 우선
      description: 상호작용은 사용자가 이미 익숙한 플랫폼 관례와 보편적 패러다임을 따르고, 혁신적 상호작용에는 전통적 경로를 병행해야 한다
      domain: universal
      example: 신식 내비게이션은 과도기용으로 햄버거 메뉴 진입점을 남긴다
    - name: 오류 메시지 세 요소
      description: 오류 안내에는 무엇이 일어났는지(사람의 말로) + 왜인지 + 어떻게 고치는지가 담긴다. 순수 오류 코드나 『작업 실패』는 금지한다
      domain: digital
      example: 『비밀번호는 8자 이상 필요합니다. 현재 6자입니다——2자를 보충한 뒤 제출하세요』
      refs:
      - STD-ISO-9241-110:5.6
    - name: 인지 피로 예산
      description: 긴 흐름은 진행과 남은 단계를 명시적으로 표기하고, 도중 저장·종료를 지원한다. 고빈도 조작은 ≤3단계로 직행
      domain: digital
      example: '다단계 양식: 상단 단계 표시줄 + 자동 임시 저장'
    anti_patterns:
    - name: 문자 의존
      description: 모든 설명을 문자로만 전달한다
      consequence: 난독증과 저학력 사용자가 배제된다. 도형+시연이 인지 부담이 가장 낮은 채널이다
    - name: 계층 미로
      description: 기능을 >3단계 메뉴 깊숙이 묻는다
      consequence: 작업 기억이 제한된 사용자는 심층 탐색에서 길을 잃는다. 『어디에 있는지』를 기억하는 것 자체가 인지세다
    - name: 인지세 중첩
      description: 멀티태스킹 병행 인터페이스가 동시에 여러 상태를 기억하도록 요구한다
      consequence: 압박/피로/멀티태스킹 상황에서 모든 사용자의 오류율이 오른다. 인지 여유는 모든 사람이 소모하는 자원이다
  G-WHO-F-011:
    name: 언어 접근성 가이드
    patterns:
    - name: 다국어 기반 시설
      description: 인터페이스 언어를 전환할 수 있고 목표 시장 언어를 포괄한다. 화면읽기 프로그램의 음성 전환을 위해 lang 속성을 정확히 표기한다
      domain: digital
      example: <html lang='zh-CN'>를 lang='en'으로 바꾸면 화면읽기 프로그램이 자동으로 음성 엔진을 바꾼다
      refs:
      - STD-W3C-WCAG22:3.1.1
      - STD-W3C-WCAG22:3.1.2
    - name: 도형 기호로 부담 경감
      description: 핵심 표지와 경고에 도형 기호를 붙여 언어 의존을 낮춘다. 기호는 국제 통용 의미를 채택한다
      domain: universal
      example: 비상구는 문자 대신 사람이 달리는 그림을, 세탁 표지는 도형 기호를 쓴다
    - name: 음성 입력 관용
      description: 음성 인식이 비원어민 억양, 조음 장애, 방언을 얼마나 인식하는지를 검수 기준에 포함한다
      domain: digital
      example: 테스트 세트에 억양 있는 음성 샘플을 포함하고, 인식률이 원어민 샘플의 90% 이상이어야 한다
    - name: 언어 계층 통제
      description: 핵심 정보에 쉬운 언어(plain language) 버전을 보충 제공한다. 전문용어는 처음 나올 때 짧은 설명을 덧붙인다
      domain: digital
      example: 의학 용어 옆에 쉬운 말 설명과 도해를 붙인다
      refs:
      - STD-W3C-WCAG22:3.1.5
    anti_patterns:
    - name: 단일 언어 가정
      description: 기본적으로 영어나 단일 주류 언어로 모든 사용자를 커버한다
      consequence: 그 언어가 아닌 사용자는 곧바로 배제된다. 저학력 사용자에게 장벽을 한 겹 더 얹는다
    - name: 기계 번역 그대로 출시
      description: 기계 번역 내용을 원어민 검수 없이 발표한다
      consequence: 오역이 핵심 조작(의료/금융)에서 실제 피해를 준다. 경어 표현의 어긋남이 신뢰를 훼손한다
    - name: 문자 단일 채널
      description: 모든 정보를 문자로만 전달한다
      consequence: 문맹/난독증 사용자는 정보를 얻을 채널이 전무하다. 도형+음성이 가장 기본적인 이중 채널 중복이다
  G-WHO-F-012:
    name: 저문해력 친화 가이드
    patterns:
    - name: 도형 주도 전달
      description: 핵심 조작과 경고는 도형 기호를 주 채널로, 문자를 보조로 한다. 도형의 의미는 목표 사용자 테스트로 이해 가능함을 확인한다
      domain: universal
      example: '의약품 설명서: 복약 시간을 『하루 두 번』 대신 해/달 도형으로 표시한다'
    - name: 음성 채널 병행
      description: 핵심 정보에 음성 낭독 옵션을 제공한다. 상호작용은 문자 입력을 음성 입력으로 대체할 수 있다
      domain: digital
      example: '양식 음성 작성: 말한 내용이 자동 입력되고, 사용자가 확인하면 제출한다'
    - name: 정보 밀도 통제
      description: 한 화면에 한 주제. 문단 ≤3행. 여백과 계층으로 빽빽한 문자 벽을 대체한다
      domain: digital
      example: 행정 양식 첫 화면에는 한 가지 일의 설명과 진입점만 둔다
      refs:
      - STD-W3C-WCAG22:1.4.8
    - name: 전문용어 문턱 제로
      description: 대중을 향한 콘텐츠에는 전문 은어를 금지한다. 필수 용어에는 도해와 쉬운 말 설명을 붙인다. 문장은 짧게, 능동태로
      domain: universal
      example: 『티켓이 처리 대기열에 들어갔습니다』 대신 『신청이 접수되었습니다. 영업일 3일 내에 회신드립니다』
    anti_patterns:
    - name: 문해율 가정
      description: 기본적으로 사용자가 중학교 이상의 문해력을 갖췄다고 가정한다
      consequence: 전 세계 약 7억 6천만 성인 문맹 + 더 많은 저학력 집단이 곧바로 배제된다. 기능적 문맹은 선진 사회에서도 똑같이 흔하다
    - name: 문자 벽
      description: 긴 문단, 빽빽한 조항식 조판
      consequence: 저문해력 사용자는 문자 벽을 보면 곧바로 포기한다. 정보 습득률은 페이지 문자 밀도에 반비례한다
  G-WHO-F-013:
    name: 인체공학 적응 가이드
    patterns:
    - name: 백분위 설계법
      description: 물리 치수 파라미터는 P5(여성 5백분위)~P95(남성 95백분위)를 포괄 구간으로 삼는다. 직관이 아니라 GB/T 10000-2023 / ANSUR II 데이터를 쓴다
      domain: industrial
      example: 좌석 높이 조절 범위가 여성 P5~남성 P95의 앉은키를 포괄한다
      refs:
      - STD-GB-T-10000
      - STD-ANSUR-II
    - name: 조절 가능한 구조
      description: 핵심 물리 인터페이스(책상·의자/스탠드/손잡이)를 조절 가능하게 한다. 고정 인터페이스는 여러 규격 옵션을 제공한다
      domain: industrial
      example: '워크스테이션: 책상 높이 전동 조절 + 모니터 전방위 스탠드'
    - name: 토크 상한 통제
      description: 일상 조작력은 표준 권장값을 넘지 않는다. 고력 조작에는 도구 보조나 다인 협업 방안을 제공한다
      domain: industrial
      example: 밸브 핸드휠에 토크 연장봉을 갖춰 한 사람이 ≤200N 조작을 완수할 수 있다
    - name: 특수 체형 명시적 포괄
      description: 임산부, 아동, 휠체어 사용자의 치수와 접근성 요구를 설계 범위에 명시적으로 포함하고, 『평균 인체』로 외삽하지 않는다
      domain: universal
      example: 프런트 서비스 창구 높이가 휠체어 시선과 호환된다. 좌석은 임산부의 복부 여유를 확보한다
    anti_patterns:
    - name: 남성 규격 기본값
      description: 남성 평균 치수를 기본 설계 기준으로 삼는다
      consequence: 여성 및 체형이 평균에서 벗어난 사용자가 도구 치수, 조작력, 도달 거리에서 체계적으로 배제된다. PPE 『프리사이즈』 함정의 전형적 근원이다
    - name: 고정 파라미터 맹신
      description: 비용을 위해 단일 규격으로 고정한다
      consequence: 포괄 구간 밖의 사용자는 맞지 않는 자세로 쓸 수밖에 없다. 장기적으로 근골격 손상이 누적된다
  G-WHO-F-014:
    name: 프라이버시 신뢰 설계 가이드
    patterns:
    - name: 데이터 최소화 우선
      description: 모든 데이터 필드에 『수집하지 않으면 어떻게 되는가』를 묻는다. 수집하지 않을 수 있으면 수집하지 않고, 수집하면 반드시 용도 설명을 붙인다
      domain: universal
      example: 가입 시 이메일+비밀번호만 요구하고, 생일/휴대폰 번호는 모두 선택이며 용도를 설명한다
      refs:
      - STD-GDPR:25
    - name: 등급별 공유 제어
      description: 개인정보 가시성을 등급화한다(공개/친구/나만). 사용자는 각 정보 유형을 독립적으로 제어한다
      domain: digital
      example: 프로필 페이지의 각 정보 옆에 가시성 선택기가 있다
    - name: 동의가 곧 절차
      description: 프라이버시 약관을 계층 요약으로 제시한다(한 장 도해 + 절별 상세 + 전문). 거부 옵션과 동의 옵션은 같은 페이지, 같은 등급, 같은 시각적 비중으로 둔다
      domain: digital
      example: '최초 실행: 세 장 도해 요약 + 하단 『동의/거부』 동등 비중 이중 버튼'
    - name: 철회 편의 동등
      description: 동의를 철회하는 경로를 동의를 부여한 방식만큼 편리하게 한다. 철회 후 즉시 효력을 발휘하고 데이터 상태를 알린다
      domain: digital
      example: 프라이버시 패널에서 특정 권한을 원클릭 철회, 철회 즉시 중단
      refs:
      - STD-GDPR:7.3
      - STD-PIPL:15
    anti_patterns:
    - name: 기능 인질극
      description: 기능 사용을 볼모로 사용자에게 데이터를 내놓으라고 요구한다(동의하지 않으면 못 씀)
      consequence: PIPL 제16조는 동의하지 않는다는 이유로 제품 제공을 거부하는 것을 명확히 금지한다. 법적 위험+신뢰 붕괴로 이중 패배한다
    - name: 약관의 벽
      description: 장황한 법률 용어의 프라이버시 정책 + 기본 체크
      consequence: 사용자는 아는 것이 아니라 『동의』만 한다. GDPR/PIPL 어느 쪽에서도 유효한 동의가 아니다. 신뢰감이 다크 패턴으로 붕괴한다
    - name: 익명화가 종착점
      description: 익명화를 프라이버시 의무의 종착점으로 본다
      consequence: 익명 데이터의 재식별 위험이 계속 존재한다. 투명성과 사용자 통제는 지속적 의무다
  G-WHO-F-015:
    name: 젠더 포용 설계 가이드
    patterns:
    - name: 성별 필드 선택화
      description: 성별 필드에 『밝히지 않음/사용자 정의』 옵션을 제공하거나 아예 제거한다. 수집 전에 용도를 먼저 묻고, 정당한 용도가 없으면 그 필드를 두지 않는다
      domain: digital
      example: 가입 양식의 성별은 드롭다운 선택이며 사용자 정의 입력란을 포함한다
    - name: 호칭과 대명사 설정 가능
      description: 호칭 필드는 선택 사항이다. 사용자가 설정한 대명사를 UI와 통신에서 일관되게 사용한다. 이름/외모로 추정해서는 안 된다
      domain: universal
      example: 고객 응대 시스템이 사용자가 설정한 대명사(they/그/그녀)를 표시하고 호칭에 자동으로 쓴다
    - name: 치수는 성별이 아니라 측정으로
      description: 치수 체계는 신체 측정(가슴둘레/허리둘레/엉덩이둘레)을 축으로 하고, 성별 이분법으로 묶지 않는다
      domain: fashion
      example: '상의 치수표: 가슴둘레(센티미터)로 바로 사이즈를 고르고, 남녀 구분이 없다'
    - name: 전 성별 공간
      description: 화장실/탈의실 등 성별 연관 공간에 전 성별/가족 옵션을 제공한다
      domain: architecture
      example: 쇼핑몰은 층마다 최소 한 곳의 전 성별 화장실을 둔다(많은 건축 규범이 이미 요구한다)
    - name: 신원 변경 경로
      description: 기록 속 성별 정보를 신원 변화에 따라 갱신할 수 있다. 변경 절차는 과거 신원의 세부를 노출하도록 요구하지 않는다
      domain: digital
      example: 프로필의 성별을 바꿀 수 있고, 기록이 동기 갱신되며 『과거 X였음』을 표시하지 않는다
    anti_patterns:
    - name: 이분법 강제 단일 선택
      description: 성별 필드가 남/여 상호 배타 단일 선택뿐이고 필수다
      consequence: 논바이너리, 트랜스젠더, 밝히기 꺼리는 사용자가 곧바로 배제된다. 양식 첫 단계부터 적대감을 조성한다
    - name: 성별 추정
      description: 이름, 외모, 행동 습관으로 성별을 자동 추정하여 호칭이나 콘텐츠 푸시에 사용한다
      consequence: 추정 오류가 불쾌감을 준다. 성별 표현≠정체성이며, 둘 다 외부에서 추정할 수 없다
    - name: 공간 이분 구획
      description: 화장실/탈의실/회원 혜택을 남녀로만 구분한다
      consequence: 트랜스젠더와 논바이너리 사용자는 『어느 쪽으로 가도 틀린』 공간적 배제, 나아가 안전 위험에 직면한다
  G-WHY-F-001:
    name: 포용성 비용 전략 가이드
    patterns:
    - name: 전 생애주기 비용 관점
      description: 포용성 투자를 『초기 설계 대 후기 개조』 전 주기로 대비해 제시한다. 초기 포용 설계의 비용이 출시 후 규정 대응 개조보다 현저히 낮다(M-WHY-F-001-01 대장 프레임워크에 대응)
      domain: universal
      example: 신축 시 경사로 비용은 완공 후 개조의 약 1/10이다
    - name: 플랫폼화로 분산 상각
      description: 포용 역량을 플랫폼 구성 요소(접근성 컴포넌트 라이브러리/범용 인체공학 모듈)로 축적하여 여러 제품에서 재사용해 단위 비용을 분산 상각한다
      domain: digital
      example: 디자인 시스템에 접근성 컴포넌트를 내장하여 신제품이 추가 비용 없이 물려받는다
    - name: 우선순위 매트릭스
      description: 『배제 인구 규모 × 개조 비용』으로 투자 우선순위를 정한다. 강제 규정 항목(WCAG AA/GB 55019)은 잘라낼 수 없는 제1군이다
      domain: universal
      example: P0=법정 규정 준수; P1=높은 포괄·낮은 비용 개조; P2=장기 로드맵
    anti_patterns:
    - name: 비용 근시안
      description: 초기 투자를 아끼려고 접근성을 『2차』로 미룬다
      consequence: 후기 개조 비용이 몇 배로 뛰고 초기 사용자를 놓친다. 『일단 출시하고 나중에 보완』이 포용성에서 가장 비싼 길이다
    - name: 공익화 오해
      description: 포용 투자를 공익/브랜드 지출로 계상한다
      consequence: ROI로 검토할 수 없다. 포용 설계는 자선이 아니라 시장 확장(장애 시장+고령화+상황적 수요)이다
  G-WHY-F-002:
    name: 포용성 시장 포지셔닝 가이드
    patterns:
    - name: 역량 명시화
      description: 접근성/고령자 친화 역량을 가치 제안에서 명시적으로 제시한다(인증 자격, 실측 데이터). 『말 없는 좋은 설계』를 하지 않는다
      domain: universal
      example: 제품 페이지에 『WCAG 2.2 AA 검증 통과 + 고령자 친화 인증』을 바로 표시한다
      refs:
      - STD-W3C-WCAG22:1
    - name: 연관 인구 확장
      description: '목표 인구 정의에 『연관 인구』를 포함한다: 장애인의 가족, 고령화 사회의 주류 사용자(ROD 2024 대조: 인구의 63%가 장애 집단과 연관)'
      domain: universal
      example: 고령자 친화 제품은 동시에 『부모님께 사 드리는 자녀』를 겨냥한다
    - name: 조달 자격 사전 구비
      description: 정부 조달/기업 조달의 규정 문턱(EN 301 549/접근성 선언)을 제품 역량으로 미리 내장한다
      domain: digital
      example: 정부·기업 시장을 겨냥해 EN 301 549 규정 준수 보고서를 미리 작성한다
      refs:
      - STD-EN-301549:9
    anti_patterns:
    - name: 규정 준수 최저가
      description: 법정 최저선에 맞춰 포용성을 하고 그것을 비용 상한으로 본다
      consequence: 최소 규정 준수는 차별화 가치가 없다. 구매자가 보는 것은 『누가 기준선을 넘어서는가』다. 기준 통과는 입장권이지 세일즈 포인트가 아니다
    - name: 극단 과잉 대응
      description: 가장 엄격한 기준을 위해 주류 경험을 희생한다
      consequence: 포용성은 제로섬이 아니다. 1%를 위해 100%를 만들어 99%를 희생하는 방안은 양쪽 모두에게 미움을 산다. 계층적 충족이 정답이다
  G-WHY-F-003:
    name: 비즈니스 모델 포용 가이드
    patterns:
    - name: 무료 핵심 계층
      description: 핵심 기능의 영구 무료 계층 + 부가가치 유료. 유료 장벽을 기본 접근성 위에 두지 않는다(M-WHERE-F-005-01 및 본 카드와 연동)
      domain: digital
      example: '노트 앱: 기본 기록은 무료, 협업과 AI는 유료 계층'
    - name: 수익화가 경험을 해치지 않음
      description: '광고/수익 설계가 핵심 과제 흐름을 침범해서는 안 된다: 조작 영역을 가리지 않고, 시스템 알림을 위장하지 않으며, 건너뛰기 경로를 정직하게 노출한다'
      domain: digital
      example: 보상형 동영상 광고는 선택 시청, 팝업 광고는 나타나지 않는다
    - name: 지불 능력 계층화
      description: '지불 능력이 낮은 집단을 포괄하는 결제 방식을 제공한다: 월납/학생가/지역별 가격/과제 수행으로 권익 교환(ROD 2024 가격 계층화 실무에 대응)'
      domain: service
      example: 개발도상국 지역별 가격 + 학생 반값
    anti_patterns:
    - name: 유료 장벽 포위
      description: 핵심 기능을 차츰 유료 계층으로 옮겨 구독을 강제한다
      consequence: 『끓는 개구리』식 과금이 신뢰를 무너뜨린다. 무료 계층의 가치 약속은 지켜져야 한다
    - name: 광고 기생
      description: 광고 가림, 클릭 유도, 닫기 버튼 위장
      consequence: Mathur et al. 2019 다크 패턴 분류학의 전 항목에 해당한다. 단기 전환은 오르지만 장기적으로 브랜드가 반격을 받는다. 또한 WCAG 여러 조항과 충돌한다
  G-WHY-F-004:
    name: 지속가능 포용 설계 가이드
    patterns:
    - name: 내구성이 곧 포용
      description: 제품 수명을 연장하는 설계(수리 가능/업그레이드 가능/모듈화)가 지속가능성과 경제적 접근성을 동시에 충족한다. 오래 쓰는 것이 싸게 사는 것보다 절약된다(M-WHERE-F-005-01과 연동)
      domain: industrial
      example: 배터리 교체형 휴대폰 + 5년 부품 공급 약속
    - name: 그린 모드 기본값
      description: 절전/저전력 모드를 깊숙이 묻은 옵션이 아니라 기본 등급으로 둔다. 친환경 선택에 추가 부담이 없다
      domain: digital
      example: 기본 활성화된 어두운 절전 + 백그라운드 새로고침 끔
    - name: 회수 경로 폐쇄 루프
      description: 제품 수명 종료 시의 회수/보상 판매 채널을 설계 산출물의 일부로 둔다
      domain: industrial
      example: 브랜드 직영 회수 + 재료에 분해 분류 표기
    anti_patterns:
    - name: 친환경은 곧 비쌈
      description: 친환경 버전을 고가 특별판으로 만든다
      consequence: 지속가능성은 사치품이어서는 안 된다. 대중 가격의 친환경 설계가 세상을 바꾼다(포용적 가격 책정과 같은 이치)
    - name: 계획적 폐기
      description: 교체 불가 배터리/폐쇄 인터페이스로 기기 교체를 강제한다
      consequence: 저소득 사용자에게 이중 배제다(자주 새로 사기가 어렵다). 규제(각국 수리권 법안)가 이 낡은 길을 막고 있다
  G-WHY-F-005:
    name: 이해관계자 균형 가이드
    patterns:
    - name: 지불자와 사용자 분리 식별
      description: 『쓰는 사람』과 『돈 내는 사람』이 일치하지 않는 상황을 명시적으로 식별하고, 각각의 핵심 요구를 충족한다(Freeman 1984 프레임워크 실천)
      domain: universal
      example: '기업용 소프트웨어: 직원은 효율을, 경영진은 보고서를 원한다——절충한 한 세트가 아니라 두 세트의 뷰'
    - name: 갈등 명시적 기록
      description: '다자 요구의 갈등에 대장을 작성한다: 갈등 지점, 판단 근거, 영향받는 당사자. 결정을 추적할 수 있다(M-WHY-F-005-01 대응, C 등급 근거 표기)'
      domain: universal
      example: 요구 검토에 『IT 보안을 위해 직원 편의를 포기』와 그 이유를 기록한다
    - name: 약자 대변 메커니즘
      description: 최종 사용자 중 약자 집단(관리받는 학생/보호받는 환자)이 결정 과정에서 명시적 대변 채널을 가진다. 돈 내는 사람이 발언권을 독점해서는 안 된다
      domain: universal
      example: 의료 시스템 설계 검토에는 반드시 환자 대표가 포함된다
    anti_patterns:
    - name: 지불자 폭정
      description: 돈 낸 사람 말을 따른다
      consequence: B2B 제품 사용자는 『관리자에게 친화적이지만 사용자는 괴로운』 시스템을 쓸 수밖에 없다. 발로 투표하는 이탈이 결국 지불자 자신을 해친다
    - name: 절충의 수렁
      description: 다자 요구를 평균화해 처리한다
      consequence: 모든 집단이 60%의 만족도만 얻으면 모두가 불만이다. 핵심 요구에 따라 뷰와 기능을 나누는 것이 뒤범벅 한 그릇보다 낫다
cases:
  CASE-001:
    title: 'Apple Assistive Access: 인지 접근성을 위한 감산적 설계'
    summary: 'iOS 17에서 Assistive Access를 도입: 인지 장애 사용자를 위해 큰 버튼, 적은 선택지, 단일 과업의 극도로 단순한 인터페이스를 제공하며, 홈 화면에는 선별된 App만 표시되고 메시지는 이모지나 셀피 영상으로 답할 수 있다.'
    outcome: 인지 접근성의 모범 사례로 널리 평가됨; Apple은 이후 iOS/iPadOS 26에서 Assistive Access scene API를 개방하여 서드파티 App이 접속할 수 있게 함.
  CASE-002:
    title: 'Xbox Adaptive Controller: 해커톤에서 V&A 컬렉션까지'
    summary: '마이크로소프트는 2018년 99.99달러의 Xbox Adaptive Controller를 출시: 19개의 잭 포트로 기존 컨트롤러 버튼을 대체하고, AbleGamers, 뇌성마비 재단 등 조직과 협력하여 설계했으며 접근성 패키징을 포함한다.'
    outcome: V&A 박물관의 신속 대응 컬렉션에 소장됨; Copilot 두 컨트롤러 협업 모드로 플레이 방식을 확장; 포용적 하드웨어의 시장 실현 가능성과 문화적 가치를 입증.
  CASE-003:
    title: 'OXO Good Grips: 사랑하는 이의 관절염을 위해 설계된 유니버설 주방용품'
    summary: 1990년 Sam Farber는 아내 Betsey의 류마티스 관절염 때문에 Smart Design과 협력하여 타원형 열가소성 고무 손잡이 주방용품을 설계했고, 첫 15개 제품을 샌프란시스코 Gourmet Products Show에서 발표했다.
    outcome: '보편적 디자인의 교과서적 사례가 됨: 소수를 위해 설계했으나 주류 시장을 얻었고 MoMA에 영구 소장됨; 2004년 OXO는 2억 7,320만 달러에 Helen of Troy에 매각되었다.'
  CASE-004:
    title: 'Nike GO FlyEase: 마케팅에 역풍 맞은 접근성 설계'
    summary: 'Nike의 첫 핸즈프리 착탈화 GO FlyEase($120, 2021-04-30 출시)는 한정 판매로 리셀러에게 매집되었고, 이차 시장에서 $500-2000까지 치솟았다; 장애 구매자(설계 목표 사용자)는 오히려 구매할 수 없었다. 홍보 문안은 ''장애''라는 단어를 회피했다(Slate: Jackson & Virdi 비판).'
    outcome: 장애 옹호자 Louie Lingard의 비판 영상이 110만 회 이상 재생됨; Nike는 추가 공급을 약속했으나 이미 커뮤니티 신뢰를 훼손함——'포용적 디자인이 포용적 판매를 하지 못한' 반면교사.
  CASE-005:
    title: 'WebAIM Million 2025: 웹 전반의 접근성 기준선 현황'
    summary: 'WebAIM이 상위 100만 개 웹사이트 홈페이지를 연례 스캔: 94.8%의 홈페이지에 검출 가능한 WCAG 2 실패 항목이 있었고, 페이지당 평균 51.1개 오류(2024: 56.8); 저대비 텍스트 79.1%, alt 텍스트 누락 55.5%가 가장 보편적인 문제였다.'
    outcome: 6년간 3.1퍼센트포인트만 개선됨——자동화로 검출 가능한 접근성 부채는 거의 제자리걸음; 기업 접근성 부채의 직접적 정량 증거.
  CASE-006:
    title: 'Ed Roberts Campus: 건축적 내러티브로서의 유니버설 디자인'
    summary: Berkeley의 Ed Roberts Campus(Leddy Maytum Stacy Architects, 2011)는 지름 56피트의 나선형 경사로를 건물의 핵심 사회적 공간으로 설계했다——폭 7피트로 휠체어 두 대가 나란히 대화할 수 있고, 경사로 안쪽 원은 전시 공간을 겸한다.
    outcome: '''보편적 디자인은 규칙의 제약이 아니라 좋은 디자인 그 자체''라는 건축적 선언; 3,600만 달러 공사비에서 접근성이 비용이 아니라 판매 포인트가 되었다.'
  CASE-007:
    title: 'Robles v. Domino''s: 웹 접근성 규정 준수 리스크 판례'
    summary: 시각장애 사용자 Robles는 Domino's 웹사이트와 App을 스크린 리더로 조작할 수 없다는 이유로 소송을 제기했다(ADA Title III). 제9순회법원은 2019-01-15 ADA가 웹사이트/App에 적용된다고 판정했고, Domino's의 절차상 상고는 대법원에서 기각되었다(cert denied 2020).
    outcome: '웹 접근성 컴플라이언스의 선례를 확립: 구체적 기술 규정이 없다고 해서 법적 의무가 면제되지 않음; 6년 후(2022-06) Domino''s는 합의로 사건을 종결. 기업의 접근성 지연에 대한 소송 비용 실증.'
  CASE-008:
    title: 'NAD v. Netflix: 자막 소송이 이끈 100% 적용'
    summary: '2011년 NAD는 Netflix Watch Instantly가 자막 없이 ADA를 위반한다며 소송을 제기했다. 법원은 Netflix의 CVAA 우선 적용 항변을 기각했고(2012-06-19), 같은 해 10월 합의에 도달했다: 2년 내 100% 스트리밍 콘텐츠에 자막을 제공하고, Netflix는 75만 5천 달러의 변호사 비용을 지불하며,
      법원은 4년간 감독권을 유지한다.'
    outcome: 스트리밍 업계의 자막 커버리지가 소송을 기점으로 법정 기준선(CVAA+FCC 규칙)과 시장 표준의 이중 동력으로 나아감; 법률 주도와 기술 표준이 병행하는 업계 차원의 변화 경로를 보여주었다.
