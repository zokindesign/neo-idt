[package]
name = "inclusive-design-tool"
version = "0.1.0"
description = "包容性设计因素决策系统 —— Windows 11 原生壳（Tauri 2 + WebView2）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
